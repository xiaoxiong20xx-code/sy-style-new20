<script>
/* ===== 25 木版年画 · WOODBLOCK PRINT (连年有余) =====
   Shot top-down on a printer's bench, the way the Yangliuqing / Taohuawu shops work: the paper is clamped at
   one edge like a book page, the carved block lies on the other side, mirror-reversed. The key block is inked,
   the sheet turns over onto it, the palm brush rubs it down, it turns back carrying the black line. Then on
   every beat the sheet flips over to the next colour block and comes back with one more colour — peach, yellow,
   green, indigo — and the picture comes alive. On the gong the last, vermilion block lands a twin-fish
   roundel in the yellow cartouche (asymmetric, so the block beside it reads reversed); the camera settles on the print.
   The page turn is a real cylinder curl (front/back faces, shading, cast shadow); xuan-paper fibres, wood grain
   printed into the flats, speckle where ink missed, and each colour a little off register. */
const { E, clamp, inv, lerp } = Reel;
const stage = Reel.makeStage('#2a1a10');
Reel.ownJitter = true;

const AS = 1400;                                  // artwork size (px), square page
const DBG = +(Reel.Q.get('dbg') || 0);

/* ---------------- the artwork: one canvas per block ---------------- */
function mkCanvas() { const c = document.createElement('canvas'); c.width = AS; c.height = AS; const g = c.getContext('2d', { willReadFrequently: true }); g.lineCap = 'round'; g.lineJoin = 'round'; return [c, g]; }
function smooth(g, pts, closed) {      // Catmull-Rom through points
  const n = pts.length; g.moveTo(pts[0][0], pts[0][1]);
  const P = (i) => pts[closed ? (i + n) % n : Math.max(0, Math.min(n - 1, i))];
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    g.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6, p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]);
  }
  if (closed) g.closePath();
}
// a leaping carp; local coords: length 1 along +x (head at +x), y up. T maps local -> canvas px
function carpT(cx, cy, len, ang, flip, bend) {
  const ca = Math.cos(ang), sa = Math.sin(ang);
  return (x, y) => {
    const yb = (y * 1.22) + bend * (x - 0.55) * (x - 0.55) - bend * 0.1;
    const lx = x * len, ly = -yb * len * flip;
    return [cx + lx * ca - ly * sa, cy + lx * sa + ly * ca];
  };
}
const BODY = [[0.16, 0.055], [0.3, 0.14], [0.48, 0.2], [0.66, 0.195], [0.8, 0.15], [0.92, 0.085], [1.0, 0.02], [1.0, -0.01], [0.95, -0.065], [0.82, -0.13], [0.62, -0.165], [0.42, -0.145], [0.26, -0.09], [0.16, -0.048]];
const TAIL = [[0.17, 0.05], [0.06, 0.1], [-0.06, 0.2], [-0.15, 0.27], [-0.08, 0.12], [-0.02, 0.0], [-0.08, -0.13], [-0.15, -0.26], [-0.05, -0.19], [0.06, -0.09], [0.17, -0.045]];
const DORSAL = [[0.3, 0.14], [0.36, 0.25], [0.46, 0.3], [0.58, 0.29], [0.68, 0.24], [0.72, 0.19]];
const PECT = [[0.8, -0.1], [0.74, -0.2], [0.66, -0.25], [0.68, -0.17], [0.75, -0.12]];
const PELV = [[0.52, -0.16], [0.46, -0.26], [0.38, -0.29], [0.4, -0.2], [0.45, -0.15]];
function carpOutline(g, T, lw) {
  const tp = (pts) => pts.map(([x, y]) => T(x, y));
  g.lineWidth = lw;
  g.beginPath(); smooth(g, tp(TAIL), true); g.stroke();
  g.beginPath(); smooth(g, tp(DORSAL), false); g.stroke();
  g.beginPath(); smooth(g, tp(PECT), true); g.stroke();
  g.beginPath(); smooth(g, tp(PELV), true); g.stroke();
  g.beginPath(); smooth(g, tp(BODY), true); g.stroke();
  // fin rays
  g.lineWidth = lw * 0.45;
  for (let k = 0; k < 9; k++) { const u = k / 8; const e = [lerp(-0.13, -0.13, u), lerp(0.24, -0.23, u)]; g.beginPath(); const a = T(0.16, 0), b = T(e[0] + 0.04 * Math.abs(u - 0.5), e[1] * 0.92); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }
  for (let k = 0; k < 6; k++) { const x = lerp(0.36, 0.68, k / 5); const a = T(x, 0.16 + 0.02 * Math.sin(k)), b = T(x + 0.03, 0.27 - 0.06 * Math.abs(k / 5 - 0.4)); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }
  // gill cover, eye, mouth, barbels
  g.lineWidth = lw * 0.8;
  g.beginPath(); smooth(g, [T(0.84, 0.135), T(0.8, 0.04), T(0.81, -0.06), T(0.85, -0.115)], false); g.stroke();
  const ec = T(0.905, 0.055), er = 0.03 * Math.hypot(T(1, 0)[0] - T(0, 0)[0], T(1, 0)[1] - T(0, 0)[1]);
  g.beginPath(); g.arc(ec[0], ec[1], er, 0, 7); g.stroke();
  g.beginPath(); g.arc(ec[0], ec[1], er * 0.45, 0, 7); g.fill();
  g.lineWidth = lw * 0.6;
  g.beginPath(); smooth(g, [T(0.985, -0.012), T(1.05, -0.05), T(1.08, -0.11), T(1.04, -0.15)], false); g.stroke();
  g.beginPath(); smooth(g, [T(0.97, -0.03), T(1.0, -0.09), T(0.98, -0.14)], false); g.stroke();
}
function carpScales(g, T, lw) {
  g.save();
  g.beginPath(); smooth(g, BODY.map(([x, y]) => T(x, y)), true); g.clip();
  g.lineWidth = lw * 0.5;
  const sc = Math.hypot(T(1, 0)[0] - T(0, 0)[0], T(1, 0)[1] - T(0, 0)[1]);
  for (let i = 0; i < 12; i++) for (let j = -5; j <= 5; j++) {
    const x = 0.24 + i * 0.05, y = j * 0.042 + (i % 2) * 0.021;
    if (x > 0.8) continue;
    const c = T(x, y), a = Math.atan2(T(1, y)[1] - c[1], T(1, y)[0] - c[0]);
    g.beginPath(); g.arc(c[0], c[1], 0.034 * sc, a + Math.PI * 0.5, a + Math.PI * 1.5); g.stroke();
  }
  g.restore();
}
function petalPath(g, cx, cy, ang, len, wid) {
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const P = (x, y) => [cx + x * ca - y * sa, cy + x * sa + y * ca];
  const b = P(0, 0), tip = P(len, 0), l1 = P(len * 0.35, wid), l2 = P(len * 0.8, wid * 0.55), r1 = P(len * 0.35, -wid), r2 = P(len * 0.8, -wid * 0.55);
  g.moveTo(b[0], b[1]); g.bezierCurveTo(l1[0], l1[1], l2[0], l2[1], tip[0], tip[1]); g.bezierCurveTo(r2[0], r2[1], r1[0], r1[1], b[0], b[1]);
}
const LOTUS = { x: 700, y: 660, s: 1 };
const PETALS = [[-2.5, 220, 80], [-0.64, 220, 80], [-1.57, 250, 86], [-2.02, 262, 90], [-1.12, 262, 90], [-2.75, 175, 66], [-0.39, 175, 66], [-1.57, 150, 66]];
const LEAVES = [[290, 640, 215, -0.25], [1110, 640, 215, 0.25], [700, 930, 140, 0]];
function leafPath(g, cx, cy, r, rot) {
  const pts = [];
  for (let k = 0; k < 28; k++) { const a = rot + (k / 28) * Math.PI * 2; const rr = r * (1 + 0.05 * Math.sin(a * 7 + 1) + 0.03 * Math.sin(a * 13)); pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * 0.62]); }
  smooth(g, pts, true);
}
const CARPS = [carpT(200, 1150, 520, -0.62, 1, 0.62), carpT(1200, 1150, 520, Math.PI + 0.62, -1, 0.62)];
const WAVE_Y = 1085;
const STEMS = [[[700, 700], [688, 820], [706, 990], [700, 1110]], [[290, 700], [310, 860], [350, 1100]], [[1110, 700], [1090, 860], [1050, 1100]]];

function drawArt() {
  const L = {};
  // ---- K: the key block (black lines) ----
  { const [c, g] = mkCanvas(); L.K = c; g.fillStyle = '#000'; g.fillRect(0, 0, AS, AS); g.strokeStyle = '#fff'; g.fillStyle = '#fff';
    // frames
    g.lineWidth = 13; g.strokeRect(70, 70, AS - 140, AS - 140);
    g.lineWidth = 7; g.strokeRect(100, 100, AS - 200, AS - 200);
    // the band between frames: a running key pattern (回纹)
    g.lineWidth = 4.6;
    const key = (x, y, s) => { g.beginPath(); g.moveTo(x, y + s); g.lineTo(x, y); g.lineTo(x + s, y); g.lineTo(x + s, y + s * 0.7); g.lineTo(x + s * 0.3, y + s * 0.7); g.lineTo(x + s * 0.3, y + s * 0.35); g.stroke(); };
    for (let x = 80; x < AS - 100; x += 26) { key(x, 77, 16); key(x, AS - 93, 16); }
    for (let y = 106; y < AS - 106; y += 26) { key(77, y, 16); key(AS - 93, y, 16); }
    // cartouche
    g.lineWidth = 11; const rr = (x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); g.stroke(); };
    rr(380, 140, 640, 210, 40); g.lineWidth = 6; rr(398, 158, 604, 174, 30);
    // lotus leaves with veins
    g.lineWidth = 11;
    for (const [x, y, r, rot] of LEAVES) {
      g.beginPath(); leafPath(g, x, y, r, rot); g.stroke();
      g.lineWidth = 5.8;
      for (let k = 0; k < 11; k++) { const a = rot + k / 11 * Math.PI * 2; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + 0.15) * r * 0.5, y + Math.sin(a + 0.15) * r * 0.31, x + Math.cos(a) * r * 0.93, y + Math.sin(a) * r * 0.58); g.stroke(); }
      g.beginPath(); g.arc(x, y, 14, 0, 7); g.fill(); g.lineWidth = 11;
    }
    // stems (outlined)
    const stems = STEMS;
    for (const s of stems) { g.lineWidth = 26; g.beginPath(); smooth(g, s, false); g.stroke(); }
    g.globalCompositeOperation = 'destination-out';
    for (const s of stems) { g.lineWidth = 13; g.beginPath(); smooth(g, s, false); g.stroke(); }
    g.globalCompositeOperation = 'source-over';
    // lotus petals
    g.lineWidth = 11;
    for (const [a, l, w] of PETALS) { g.beginPath(); petalPath(g, LOTUS.x, LOTUS.y, a, l, w); g.fillStyle = '#000'; g.fill(); g.stroke(); g.lineWidth = 5.5; g.beginPath(); const ca = Math.cos(a), sa = Math.sin(a); g.moveTo(LOTUS.x + ca * l * 0.15, LOTUS.y + sa * l * 0.15); g.lineTo(LOTUS.x + ca * l * 0.75, LOTUS.y + sa * l * 0.75); g.stroke(); g.lineWidth = 11; }
    g.fillStyle = '#fff';
    // seed pod + stamens
    g.beginPath(); g.ellipse(LOTUS.x, LOTUS.y - 52, 60, 26, 0, 0, 7); g.fillStyle = '#000'; g.fill(); g.fillStyle = '#fff'; g.stroke();
    for (let k = 0; k < 7; k++) { g.beginPath(); g.arc(LOTUS.x - 39 + k * 13, LOTUS.y - 55 + (k % 2) * 8, 5, 0, 7); g.fill(); }
    // carp
    for (const T of CARPS) { g.fillStyle = '#000'; g.beginPath(); smooth(g, BODY.map(([x, y]) => T(x, y)), true); g.fill(); g.fillStyle = '#fff'; carpOutline(g, T, 12); carpScales(g, T, 11); }
    // waves: rows of fish-scale arcs + curling crests
    g.lineWidth = 5.6;
    for (let r = 0; r < 7; r++) for (let i = -1; i < 16; i++) {
      const cx = 130 + i * 84 + (r % 2) * 42, cy = WAVE_Y + 40 + r * 34;
      if (cy > AS - 130) continue;
      for (let k = 1; k <= 3; k++) { g.beginPath(); g.arc(cx, cy, k * 13, Math.PI, 2 * Math.PI); g.stroke(); }
    }
    g.lineWidth = 11;
    for (let i = 0; i < 8; i++) { const x = 170 + i * 152, y = WAVE_Y + 10 + 12 * Math.sin(i * 1.7);
      g.beginPath(); smooth(g, [[x - 70, y + 30], [x - 30, y - 10], [x + 20, y - 22], [x + 48, y], [x + 30, y + 20], [x + 8, y + 6], [x + 18, y - 4]], false); g.stroke(); }
    // clip everything to inside the inner frame except frames
    g.globalCompositeOperation = 'destination-out'; g.fillRect(0, 0, AS, 66); g.fillRect(0, AS - 66, AS, 66); g.fillRect(0, 0, 66, AS); g.fillRect(AS - 66, 0, 66, AS); g.globalCompositeOperation = 'source-over';
  }
  // ---- colour blocks (white = colour) ----
  const fillCanvas = (fn, noClip) => { const [c, g] = mkCanvas(); g.fillStyle = '#000'; g.fillRect(0, 0, AS, AS); g.fillStyle = '#fff'; g.strokeStyle = '#fff'; fn(g);
    if (!noClip) { g.globalCompositeOperation = 'destination-out'; g.beginPath(); g.rect(0, 0, AS, AS); g.rect(104, 1296, AS - 208, -1192); g.fill('evenodd'); g.globalCompositeOperation = 'source-over'; } return c; };
  L.P = fillCanvas((g) => {             // peach / rose: lotus petals, carp fins, a few wave crests
    for (const [a, l, w] of PETALS) { g.beginPath(); petalPath(g, LOTUS.x, LOTUS.y, a, l * 0.97, w * 0.95); g.fill(); }
    for (const T of CARPS) { for (const F of [TAIL, DORSAL.concat([[0.5, 0.17]]), PECT, PELV]) { g.beginPath(); smooth(g, F.map(([x, y]) => T(x, y)), true); g.fill(); } }
    g.beginPath(); g.ellipse(700, 1210, 520, 40, 0, 0, 7); g.globalAlpha = 0; g.fill(); g.globalAlpha = 1;
  });
  L.Y = fillCanvas((g) => {             // yellow: carp bodies, cartouche, lotus pod
    for (const T of CARPS) { g.beginPath(); smooth(g, BODY.map(([x, y]) => T(x, y)), true); g.fill(); }
    g.beginPath(); g.roundRect ? g.roundRect(396, 156, 608, 178, 30) : g.rect(396, 156, 608, 178); g.fill();
    g.beginPath(); g.ellipse(LOTUS.x, LOTUS.y - 52, 58, 24, 0, 0, 7); g.fill();
  });
  L.G = fillCanvas((g) => {             // green: leaves and stems
    for (const [x, y, r, rot] of LEAVES) { g.beginPath(); leafPath(g, x, y, r * 0.985, rot); g.fill(); }
    g.lineWidth = 15; for (const s of STEMS) { g.beginPath(); smooth(g, s, false); g.stroke(); }
    g.globalCompositeOperation = 'destination-out';
    for (const T of CARPS) { g.beginPath(); smooth(g, BODY.map(([x, y]) => T(x, y)), true); g.fill(); for (const F of [TAIL, DORSAL, PECT, PELV]) { g.beginPath(); smooth(g, F.map(([x, y]) => T(x, y)), true); g.fill(); } }
    for (const [a, l, w] of PETALS) { g.beginPath(); petalPath(g, LOTUS.x, LOTUS.y, a, l, w); g.fill(); }
    g.globalCompositeOperation = 'source-over';
  });
  L.B = fillCanvas((g) => {             // indigo: water and the border band
    g.fillRect(104, WAVE_Y + 4, AS - 208, AS - 104 - WAVE_Y - 4);
    g.fillRect(74, 74, AS - 148, 26); g.fillRect(74, AS - 100, AS - 148, 26); g.fillRect(74, 74, 26, AS - 148); g.fillRect(AS - 100, 74, 26, AS - 148);
    g.globalCompositeOperation = 'destination-out';
    for (const T of CARPS) { g.beginPath(); smooth(g, BODY.map(([x, y]) => T(x, y)), true); g.fill(); for (const F of [TAIL, PECT, PELV]) { g.beginPath(); smooth(g, F.map(([x, y]) => T(x, y)), true); g.fill(); } }
    for (let i = 0; i < 8; i++) { const x = 170 + i * 152, y = WAVE_Y + 10 + 12 * Math.sin(i * 1.7); g.beginPath(); g.ellipse(x - 5, y + 2, 55, 22, -0.2, 0, 7); g.fill(); }
    g.lineWidth = 20; for (const s of STEMS) { g.beginPath(); smooth(g, s, false); g.stroke(); }
    g.globalCompositeOperation = 'source-over';
  }, true);
  L.R = fillCanvas((g) => {             // vermilion: a twin-fish roundel for the cartouche + a square seal
    const cx = 700, cy = 247, R0 = 78;
    g.lineWidth = 11; g.beginPath(); g.arc(cx, cy, R0, 0, 7); g.stroke();
    // two little carp chasing round the ring, one larger than the other (so the block reads reversed)
    const fish = (a0, sc, dir) => {
      const pts = [];
      for (let i = 0; i <= 24; i++) {
        const u = i / 24, a = a0 + dir * u * 2.3, rr = R0 * (0.56 + 0.07 * Math.sin(u * Math.PI));
        const w = sc * 16 * Math.sin(Math.PI * Math.min(1, u * 1.15)) ** 0.7 * (1 - 0.55 * u);
        pts.push([cx + Math.cos(a) * (rr + w), cy + Math.sin(a) * (rr + w)]);
      }
      for (let i = 24; i >= 0; i--) {
        const u = i / 24, a = a0 + dir * u * 2.3, rr = R0 * (0.56 + 0.07 * Math.sin(u * Math.PI));
        const w = sc * 16 * Math.sin(Math.PI * Math.min(1, u * 1.15)) ** 0.7 * (1 - 0.55 * u);
        pts.push([cx + Math.cos(a) * (rr - w), cy + Math.sin(a) * (rr - w)]);
      }
      g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.fill();
      const ta = a0 + dir * 2.35, tr = R0 * 0.56;                       // the tail, a forked flick
      const tx = cx + Math.cos(ta) * tr, ty = cy + Math.sin(ta) * tr;
      g.beginPath(); g.moveTo(tx, ty);
      g.lineTo(tx + Math.cos(ta + dir * 1.9) * 22 * sc, ty + Math.sin(ta + dir * 1.9) * 22 * sc);
      g.lineTo(tx + Math.cos(ta + dir * 1.2) * 14 * sc, ty + Math.sin(ta + dir * 1.2) * 14 * sc);
      g.lineTo(tx + Math.cos(ta + dir * 0.6) * 22 * sc, ty + Math.sin(ta + dir * 0.6) * 22 * sc); g.closePath(); g.fill();
      g.fillStyle = '#000';                                             // the eye, cut out of the block
      g.beginPath(); g.arc(cx + Math.cos(a0 + dir * 0.18) * R0 * 0.6, cy + Math.sin(a0 + dir * 0.18) * R0 * 0.6, 4.5 * sc, 0, 7); g.fill();
      g.fillStyle = '#fff';
    };
    fish(-2.2, 1.12, 1); fish(0.95, 0.86, 1);
    g.beginPath(); g.arc(cx + 8, cy - 6, 11, 0, 7); g.fill();          // the pearl they chase, off centre
    // a ruyi cloud-head either side, the left one larger (keeps the block visibly reversed)
    const ruyi = (x, y, k, dir) => {
      g.beginPath(); g.arc(x, y + 6 * k, 15 * k, 0, 7); g.arc(x - dir * 17 * k, y - 4 * k, 12 * k, 0, 7); g.arc(x + dir * 17 * k, y - 4 * k, 12 * k, 0, 7); g.fill();
      g.beginPath(); g.moveTo(x - dir * 4 * k, y + 18 * k); g.quadraticCurveTo(x + dir * 30 * k, y + 40 * k, x + dir * 70 * k, y + 26 * k); g.lineWidth = 8 * k; g.stroke();
      g.fillStyle = '#000'; g.beginPath(); g.arc(x, y + 5 * k, 5 * k, 0, 7); g.fill(); g.fillStyle = '#fff';
    };
    ruyi(cx - 175, cy - 6, 1.25, -1); ruyi(cx + 170, cy - 2, 0.95, 1);
    // a small square seal (a fish in a frame, no characters) in the lower right margin
    g.fillRect(1190, 1326, 66, 66);
    g.fillStyle = '#000'; g.fillRect(1199, 1335, 48, 48); g.fillStyle = '#fff';
    g.beginPath(); g.ellipse(1223, 1359, 17, 8, -0.5, 0, 7); g.fill();
    g.beginPath(); g.moveTo(1208, 1368); g.lineTo(1203, 1378); g.lineTo(1214, 1373); g.closePath(); g.fill();
  }, true);
  return L;
}

/* ---------------- GL ---------------- */
const rm = Reel.RM(stage, {
  bloom: 0.06, th: 1.6, expo: 0.97, vig: 0.38, grain: 0.03, ca: 0.25, contrast: 1.07, sat: 1.12, bands: 4,
  lift: [0.004, 0.002, 0.0], gain: [1.02, 1.0, 0.96],
  uniforms: `
uniform sampler2D uA, uB;          // A: K, P, Y, G   B: Ind, Red
uniform vec4 uCam;                 // centre xy, half height, rotation
uniform vec4 uPage;                // mode (0 left, 1 turning right, 2 right, 3 turning left), c, r, layers printed
uniform vec4 uBlk;                 // block layer index, inked fraction (sweep), rub fraction, show-through wetness
uniform vec4 uBrush;               // ink brush xy, palm brush xy
uniform vec2 uBrushA;              // brush alphas
uniform float uDbg, uWet, uSheen; uniform vec2 uTh;`,
  scene: `
const vec3 INK = vec3(.022, .02, .024);
vec3 LCOL(int i){
  if (i == 1) return vec3(.80, .14, .26);    // 桃红, leaning to rouge
  if (i == 2) return vec3(.88, .58, .06);    // 槐黄, warm
  if (i == 3) return vec3(.10, .40, .26);    // 翠绿 / 石绿, deep
  if (i == 4) return vec3(.10, .16, .40);    // 靛蓝, greyed
  return vec3(.78, .12, .07);                // 朱红
}
// every colour block is a different plank: its grain runs its own way and prints into the flat
float grainL(int i, vec2 uv){
  float a = float(i)*1.37 + .5;
  vec2 q = mat2(cos(a), sin(a), -sin(a), cos(a))*uv;
  float w = fbm2(q*2.5 + float(i)*3.1);
  return fbm2(vec2(q.x*2.2 + w*.6, q.y*95. + w*4.));
}
vec2 OFF(int i){                              // a little off register, as every real print is
  if (i == 1) return vec2(.0052, -.0031);
  if (i == 2) return vec2(-.0041, .0046);
