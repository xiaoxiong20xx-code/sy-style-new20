<script>
/* ===== 23 刺绣 · SILK EMBROIDERY IN A BAMBOO HOOP =====
   Macro on a pair of koi being worked in silk floss on shot silk (teal warp / indigo weft). Every stitch is an
   instanced ribbon with a rounded cross-section, end taper where it dives into its needle hole, filament
   striations and a Kajiya-Kay anisotropic sheen along its own direction. Scales are fan-stitched, so when the key
   light swings round, the sheen runs across the fish scale by scale. A fabric-space height map (rendered per frame)
   gives contact shadows / AO / puckering; the needle, bamboo hoop and brass clamp are ray-traced analytically.
   Thin-lens depth of field, ACES. Needle stitches on the beat, then a time-lapse fills the fish while the camera
   pulls back; the last stitches embroider the title. */
const { E, clamp, lerp, inv } = Reel;
const stage = Reel.makeStage('#0a0c0f');

const C = Reel.cfg({});
const RS = Reel.RS, SS = 1.5;
const OW = Math.round(1920 * RS), OH = Math.round(1080 * RS), IW = Math.round(OW * SS), IH = Math.round(OH * SS);
const H = 12;                          // drum (fabric) height, mm
const HMR = 104, HMN = 6144;           // height map covers [-HMR, HMR]^2 mm
const R = Reel.rng(23032026);

layout(location=0) in vec2 p; out vec2 vUV; void main(){ vUV = p*.5+.5; gl_Position = vec4(p,0.,1.); }`;

/* ------------------------------------------------------------------ shared GLSL */

precision highp float; precision highp int;

#define PI 3.14159265
uniform vec3 uCam; uniform vec3 uL; uniform vec3 uLc; uniform float uT;
uniform sampler2D uHM; uniform float uHMr;
uniform vec4 uNd; uniform vec4 uNa; uniform vec3 uNe1;
uniform vec4 uCap[10]; uniform int uNCap;

const float H = ${H.toFixed(1)};

// height map (absolute z of the stitched surface over the drum)
float hmH(vec2 p){ vec2 uv = p/(2.*uHMr)+.5; return texture(uHM, uv).r; }

/* ------------------------------------------------------------------ world pass: fabric, table, hoop, clamp, needle */
const fsWorld = HEAD + COMMON + `
in vec2 vUV; out vec4 o;
uniform vec3 uCR, uCU, uCF; uniform float uTanH, uAsp; uniform vec2 uRes, uJn; uniform mat4 uVP;
uniform sampler2D uLines; uniform float uLinesA; uniform float uDbg; uniform float uMatDbg;

// clamp: two lugs + screw + thumb nut, in a local (radial, tangential, z) frame
