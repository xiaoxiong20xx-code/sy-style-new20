<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>34 孔版套印 · Risograph</title>
<script src="../../lib/core.js"></script>
<script src="../../lib/track.js"></script>
</head><body><div id="stage"></div>
<script>
/* ===== 34 孔版套印 · RISOGRAPH, TWO PASSES =====
   The exit of a stencil duplicator: through the slot we see the inked drum turning, rubber exit rollers, the ribbed
   output tray. An A3 sheet slides out; ink appears exactly where the sheet has passed the drum's nip line.
   Pass 1 = fluorescent pink, pass 2 (new drum) = blue over it. Inks are transparent and multiply (pink+blue = violet),
   flat areas carry riso grain and white specks, tints are AM screens at their own angles, the blue is misregistered,
   there is roller banding, faint roller tracks and the sheen of wet ink. When the blue lands, the tiger "appears".
   Everything is ray-traced analytically; the artwork is drawn into two density maps at setup. */
const { E, clamp, lerp, inv } = Reel;
// ★ 改光色改这里：着色器里的 LIGHT_COL（搜 LIGHT_COL）。它乘在室内主光（所有受光面的漫反射和反光高光）上。
//   vec3(1.) = 原样（和成片一模一样）；偏冷例如 vec3(.85, .95, 1.15)；6.75 秒后窗帘拉开的窗光是另一束光（搜 uWinI）。只想换物体/纸/颜料的颜色是“配色”，不是光，见 SKILL 的对照表。
const stage = Reel.makeStage('#1a1816');
Reel.ownJitter = true;
const C = Reel.cfg({ ed: '№ 01/50', ed2: '№ 02/50' });
const RS = Reel.RS, OW = Math.round(1920 * RS), OH = Math.round(1080 * RS);
const PW = 297, PH = 420, MPX = 4;      // paper (mm), map px per mm
const hsh = Reel.hash;

/* ------------------------------------------------------------------ GL */
const cv = document.createElement('canvas'); cv.width = OW; cv.height = OH;
cv.style.cssText = 'position:absolute;left:0;top:0;width:1920px;height:1080px'; stage.appendChild(cv);
const gl = cv.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true, alpha: false });
gl.getExtension('EXT_color_buffer_float'); gl.getExtension('OES_texture_float_linear');
function shd(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { const e = gl.getShaderInfoLog(s); console.error(e + '\n' + src.split('\n').map((l, i) => (i + 1) + ': ' + l).join('\n')); throw new Error(e); } return s; }
function prog(vs, fs) { const p = gl.createProgram(); gl.attachShader(p, shd(gl.VERTEX_SHADER, vs)); gl.attachShader(p, shd(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); const L = {}; p.loc = (n) => (n in L ? L[n] : (L[n] = gl.getUniformLocation(p, n))); return p; }
function U(p, n, v) { const l = p.loc(n); if (l === null) return; if (typeof v === 'number') gl.uniform1f(l, v); else if (v.length === 2) gl.uniform2fv(l, v); else if (v.length === 3) gl.uniform3fv(l, v); else if (v.length === 4) gl.uniform4fv(l, v); }
function target(w, h) { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0); return { t, f }; }
const bindTex = (p, n, t, unit) => { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t); const l = p.loc(n); if (l !== null) gl.uniform1i(l, unit); };
const T_MAIN = target(OW, OH), T_DOF = target(OW, OH);
let tInk = null;
const vaoFS = gl.createVertexArray(); gl.bindVertexArray(vaoFS);
{ const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0); }
const VSFS = `#version 300 es
layout(location=0) in vec2 p; out vec2 vUV; void main(){ vUV = p*.5+.5; gl_Position = vec4(p,0.,1.); }`;

const pScene = prog(VSFS, `#version 300 es
precision highp float; in vec2 vUV; out vec4 o;
uniform vec3 uCam, uCR, uCU, uCF; uniform float uTanH, uAsp; uniform vec2 uRes, uJn;
uniform sampler2D uInk;                 // r = pink density, g = blue density (poster space)
uniform float uZL;                      // leading edge of the sheet (mm, along +z)
uniform float uP1, uP2;                 // printed length (mm from leading edge) for pink / blue
uniform float uDrumCol, uDrumA, uT, uWet, uRoll;
uniform vec3 uL;
uniform float uCurl;                    // hero: trailing-edge curl (mm)
uniform float uZL2, uP2b, uWet2, uCurl2; // second print: leading edge, printed blue length, wetness, trailing curl
uniform vec3 uS2;                       // second print: x offset (mm), rotation (rad), on/off
uniform float uWinX, uWinI;             // window light: curtain edge position (mm), intensity
const vec3 LIGHT_COL = vec3(1.);   // light colour, vec3(1.) = as delivered (see the Chinese note at the top of the script)
const vec3 LW = vec3(-.1176, .7843, .6087);   // direction to the window (normalised (-.15, 1., .776))
#define PI 3.14159265
const vec2 PSZ = vec2(${PW}., ${PH}.);
const float NIP = -112., DR = 92., DCY = 94.;      // drum: radius, centre height, nip z
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(hash12(i),hash12(i+vec2(1,0)),f.x), mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ float a=.5,s=0.; for(int i=0;i<4;i++){ s+=a*vnoise(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return s; }
vec2 boxT(vec3 ro, vec3 rd, vec3 mn, vec3 mx, out vec3 n){ vec3 iv = 1./rd, t0 = (mn - ro)*iv, t1 = (mx - ro)*iv; vec3 a = min(t0,t1), b = max(t0,t1);
  float tn = max(max(a.x,a.y),a.z), tf = min(min(b.x,b.y),b.z); n = -sign(rd)*step(a.yzx, a.xyz)*step(a.zxy, a.xyz); return vec2(tn, tf); }
float cylX(vec3 ro, vec3 rd, vec2 c, float r, vec2 xr, out vec3 n){   // cylinder along x, centre (y,z)=c
  vec2 o = ro.yz - c, d = rd.yz; float a = dot(d,d), b = dot(o,d), cc = dot(o,o) - r*r, disc = b*b - a*cc; n = vec3(0.);
  if (disc < 0. || a < 1e-9) return 1e9; float t = (-b - sqrt(disc))/a; float x = ro.x + rd.x*t;
  if (t > 0. && x > xr.x && x < xr.y) { vec2 q = o + d*t; n = vec3(0., q)/r; return t; } return 1e9; }
// riso ink at a poster point (mm, origin centre, y up); returns transmission
vec3 inkAt(vec2 pp, float printedP, float printedB, vec3 mis, vec2 dens, float sd, float wetA, float sheet2, out float wet){
  wet = 0.;
  vec2 uv = pp/PSZ + .5; vec3 T = vec3(1.);
  if (any(lessThan(uv, vec2(0.))) || any(greaterThan(uv, vec2(1.)))) return T;
  float v = (PSZ.y*.5 + pp.y);                                 // distance from the leading edge (the sheet runs foot first)
  vec2 fw = fwidth(pp);
  float aa = max(max(fw.x, fw.y), .03);
  // pink
  if (v < printedP) {
    vec4 tx = texture(uInk, uv); float d = clamp(tx.r + (sheet2 > .5 ? tx.a : tx.b), 0., 1.);
    float band = .95 + .05*sin(pp.y*.11 + fbm(vec2(pp.y*.02, 3.))*4.) ;     // roller banding
    float grain = .9 + .1*vnoise(pp*3.1 + sd*13.) + .05*vnoise(pp*.4 + sd*7.);
    float speck = step(.965, hash12(floor(pp*4.) + sd*31.));
    float dd = d;
    if (d < .96) { // AM screen, 15 deg, coarse 1.7 mm cells: the dots of a riso tint are visible at arm's length
      vec2 q = mat2(.966,-.259,.259,.966)*pp/1.7; vec2 f = fract(q) - .5;
      float th = (cos(f.x*2.*PI) + cos(f.y*2.*PI))*.25 + .5;
      float ab = aa/1.7*1.6;
      dd = smoothstep(th - ab, th + ab, d)*(.92 + .08*grain);
      dd = mix(dd, d, smoothstep(.75, 1.4, aa));                 // only when a dot is smaller than a pixel does it average out
    } else { dd = d*grain*(1. - speck*.7); }
    dd *= band*dens.x;
    vec3 pink = vec3(1.0, .07, .42);
    T *= mix(vec3(1.), pink, clamp(dd, 0., 1.));
    wet = max(wet, dd*(1. - smoothstep(0., 60., printedP - v))*wetA);
  }
  // blue, misregistered by ~1.1 mm and a hair of rotation
  if (v < printedB) {
    float mc = sqrt(1. - mis.z*mis.z); vec2 pb = mat2(mc,-mis.z,mis.z,mc)*pp + mis.xy;
    float d = texture(uInk, pb/PSZ + .5).g;
    float band = .95 + .05*sin(pb.y*.13 + 1.3 + fbm(vec2(pb.y*.02, 7.))*4.);
    float grain = .9 + .1*vnoise(pb*2.9 + 11. + sd*5.) + .05*vnoise(pb*.37 + 5. + sd*3.);
    float speck = step(.97, hash12(floor(pb*4.) + 17. + sd*23.));
    float dd = d;
    if (d < .96) { vec2 q = mat2(.259,-.966,.966,.259)*pb/1.7; vec2 f = fract(q) - .5;
      float th = (cos(f.x*2.*PI) + cos(f.y*2.*PI))*.25 + .5; float ab = aa/1.7*1.6; dd = smoothstep(th - ab, th + ab, d)*(.92 + .08*grain); dd = mix(dd, d, smoothstep(.75, 1.4, aa)); }
    else dd = d*grain*(1. - speck*.7);
    dd *= band*dens.y;
    vec3 blue = vec3(.05, .21, .56);
    T *= mix(vec3(1.), blue, clamp(dd, 0., 1.));
    wet = max(wet, dd*(1. - smoothstep(0., 60., printedB - v))*wetA);
  }
  return T;
}
vec3 env(vec3 r){ vec3 c = mix(vec3(.08,.08,.085), vec3(.5,.5,.52), smoothstep(-.2, .9, r.y));
  c += LIGHT_COL*vec3(1.,.97,.92)*2.2*smoothstep(.93, .985, dot(r, normalize(uL + vec3(0.,.25,0.)))); return c; }
vec3 lightDiffuse(vec3 n, float sh){ return LIGHT_COL*vec3(1.,.97,.92)*1.15*max(dot(n, uL), 0.)*sh + mix(vec3(.10,.10,.11), vec3(.28,.28,.30), n.y*.5 + .5); }
float sheetMask(vec3 p){ return step(abs(p.x), PSZ.x*.5)*step(uZL - PSZ.y, p.z)*step(p.z, uZL); }
float heroCurl(vec3 p){ float u2 = p.z - (uZL - PSZ.y); float ax = abs(p.x)/(PSZ.x*.5); return uCurl*exp(-max(u2, 0.)/26.)*(1. + .6*ax*ax); }
float paperH(vec3 p){ float u = uZL - p.z; float lift = 3.2*exp(-u/40.)*step(0., u)*(1. - smoothstep(0., 1., (uRoll))); return 1.2 + lift + heroCurl(p) + .5*fbm(p.xz*.012); }
// the second print (lands on top of the hero): local frame centred on the sheet, rotated by uS2.y
vec2 s2Local(vec3 p){ vec2 d = p.xz - vec2(uS2.x, uZL2 - PSZ.y*.5); float c = cos(uS2.y), s = sin(uS2.y); return vec2(c*d.x + s*d.y, -s*d.x + c*d.y); }
float sheetMask2(vec3 p){ vec2 q = s2Local(p); return step(abs(q.x), PSZ.x*.5)*step(abs(q.y), PSZ.y*.5); }
uniform float uFloat2;                  // second print: air film under it while it slides (mm)
float paperH2(vec3 p){ vec2 q = s2Local(p); float u2 = q.y + PSZ.y*.5, ul = PSZ.y*.5 - q.y;
  return 1.45 + uFloat2*(.4 + .6*exp(-ul/60.)) + uCurl2*exp(-max(u2, 0.)/22.) + .5*fbm(p.xz*.012); }
// warm window light: the window's panes projected along LW, a curtain being drawn open (lit where x < uWinX)
vec3 winLight(vec3 P, vec3 n){
  if (uWinI <= 0.) return vec3(0.);
  vec2 g = P.xz - LW.xz*(P.y/LW.y);
  float m = smoothstep(-470., -430., g.x)*smoothstep(330., 290., g.x)*smoothstep(-300., -250., g.y)*smoothstep(780., 730., g.y);
  vec2 w = mat2(.978, .208, -.208, .978)*(g - vec2(0., 90.));
  float mull = 1. - .62*(1. - smoothstep(4., 11., abs(w.y)))                        // transom
             - .62*(1. - smoothstep(4., 11., abs(w.x - 215.)))                       // mullions (beside the sheet)
             - .62*(1. - smoothstep(4., 11., abs(w.x + 250.)));
  float edge = uWinX + 16.*sin(g.y*.029 + 1.3) + 7.*sin(g.y*.083 + .4);              // the curtain's folds
  float cur = smoothstep(edge + 26., edge - 26., g.x);
  // the paper guides shade a thin strip beside them
  float gs = 1.;
  for (int k=0;k<2;k++){ float x0 = (k==0 ? -153. : 159.); float reach = (34. - P.y)*(-LW.x)/LW.y; float dx = P.x - x0;
    gs *= 1. - (1. - smoothstep(reach - 1.5, reach + 1.5, dx))*step(0., dx)*smoothstep(0., 10., P.z); }
  return vec3(1., .74, .48)*2.2*uWinI*m*max(mull, 0.)*cur*gs*max(dot(n, LW), 0.);
}
void main(){
  vec2 ndc = gl_FragCoord.xy/uRes*2. - 1. - uJn;
  vec3 rd = normalize(uCF + uCR*ndc.x*uTanH*uAsp + uCU*ndc.y*uTanH), ro = uCam;
  float tB = 1e9; int mat = 0; vec3 N = vec3(0.,1.,0.); vec3 n;
  // table (y = -24), tray top (y = 0) with ribs, machine front (z = 0) with a slot, side guides, drum, rollers, paper
  float tt = (-24. - ro.y)/rd.y; if (tt > 0.) { tB = tt; mat = 1; }
  vec2 b = boxT(ro, rd, vec3(-250., -24., 0.), vec3(250., 0., 640.), n); if (b.x < b.y && b.x > 0. && b.x < tB) { tB = b.x; mat = 2; N = n; }
  // machine body, with the slot cut out
  b = boxT(ro, rd, vec3(-320., -24., -420.), vec3(320., 240., 0.), n);
  if (b.x < b.y && b.x > 0. && b.x < tB) { vec3 p = ro + rd*b.x;
    bool slot = n.z > .5 && abs(p.x) < 190. && p.y > 2. && p.y < 62.;
    if (!slot) { tB = b.x; mat = 3; N = n; } else { tB = b.x + 190.; mat = 8; } }
  for (int k=0;k<2;k++){ float sx = k==0 ? -1. : 1.; b = boxT(ro, rd, vec3(sx*156. - 3., 0., 30.), vec3(sx*156. + 3., 34., 560.), n); if (b.x < b.y && b.x > 0. && b.x < tB) { tB = b.x; mat = 4; N = n; } }
  float tc = cylX(ro, rd, vec2(DCY, NIP), DR, vec2(-170., 170.), n); if (tc < tB) { tB = tc; mat = 5; N = n; }
  for (int k=0;k<4;k++){ float x0 = -150. + float(k)*80.; tc = cylX(ro, rd, vec2(8., -10.), 7., vec2(x0 - 22., x0 + 22.), n); if (tc < tB) { tB = tc; mat = 6; N = n; } }
  // the sheet: a thin plane over the tray (and inside the machine, under the drum)
  float tp = (1.2 - ro.y)/rd.y;
  if (tp > 0. && tp < tB) { vec3 p = ro + rd*tp; if (sheetMask(p) > .5) { tp = (paperH(p) - ro.y)/rd.y; p = ro + rd*tp; if (sheetMask(p) > .5 && tp < tB) { tB = tp; mat = 7; } } }
  if (uS2.z > .5) { float t2 = (1.5 - ro.y)/rd.y;
    if (t2 > 0. && t2 < tB + 2.) { vec3 p = ro + rd*t2; if (sheetMask2(p) > .5) { t2 = (paperH2(p) - ro.y)/rd.y; p = ro + rd*t2; if (sheetMask2(p) > .5 && t2 < tB) { tB = t2; mat = 9; } } } }
  vec3 P = ro + rd*tB; vec3 V = -rd; vec3 col;
  // inside the machine (behind the slot) it is dark
  float inside = smoothstep(0., -60., P.z);
  if (mat == 0) col = vec3(.02);
  else if (mat == 8) col = vec3(.012,.011,.01)*(1. + 2.*smoothstep(-200., -40., P.z));
  else if (mat == 1) { vec2 q = P.xz; float g = fbm(vec2(q.x*.004, q.y*.05)); vec3 alb = mix(vec3(.10,.06,.035), vec3(.20,.13,.07), g); col = alb*(lightDiffuse(vec3(0.,1.,0.), 1.)*.8 + winLight(P, vec3(0.,1.,0.))); }
  else if (mat == 2) {
    vec3 alb = vec3(.56,.55,.52);
    vec3 nn = N; if (N.y > .5) { float rib = sin(P.x*.42); nn = normalize(vec3(-cos(P.x*.42)*.18*step(abs(P.x), 150.), 1., 0.)); alb *= .97 + .03*rib; }
    float sh = 1.;
    // contact shadow of the sheet and of the guides
    if (N.y > .5) { float dx = abs(P.x) - PSZ.x*.5; float inZ = smoothstep(-4., 4., P.z - (uZL - PSZ.y))*smoothstep(4., -4., P.z - uZL);
      sh *= 1. - .45*inZ*(1. - smoothstep(0., 9., dx))*step(-.5, dx);
      sh *= 1. - .35*(1. - smoothstep(0., 22., 153. - abs(P.x)))*step(abs(P.x), 153.);
      sh *= mix(1., .55, smoothstep(40., 0., P.z));
      // under the curled trailing edge of the hero
      float zt = uZL - PSZ.y; sh *= 1. - .35*clamp(uCurl/4., 0., 1.)*smoothstep(-14., 0., P.z - zt)*step(abs(P.x), PSZ.x*.5 + 2.)*step(P.z, zt);
      if (uS2.z > .5) { vec2 q = s2Local(P); vec2 dq = abs(q) - PSZ*.5; float od = length(max(dq, 0.));
        sh *= 1. - .42*(1. - smoothstep(0., 8., od))*step(-.5, max(dq.x, dq.y)); } }
    col = alb*(lightDiffuse(nn, sh) + winLight(P, nn)*sh) + env(reflect(rd, nn))*.035;
  }
  else if (mat == 3) { vec3 alb = vec3(.22,.215,.205)*(.92 + .08*vnoise(P.xy*.8)); col = alb*lightDiffuse(N, 1.)*.9 + env(reflect(rd, N))*.03;
    // slot lip, a status LED, a vent grille
    if (N.z > .5) { float lip = smoothstep(5., 0., abs(P.y - 64.))*step(abs(P.x), 192.); col *= 1. - .4*lip;
      vec2 led = P.xy - vec2(250., 150.); col += vec3(.2,1.,.3)*1.5*exp(-dot(led,led)/8.) + vec3(.1,.5,.15)*.15*exp(-dot(led,led)/200.);
      if (P.y > 120. && P.y < 190. && abs(P.x + 170.) < 70.) col *= .75 + .25*step(.5, fract(P.y/6.)); } }
  else if (mat == 4) { col = vec3(.6,.6,.58)*(lightDiffuse(N, 1.) + winLight(P, N)) + env(reflect(rd, N))*.04; }
  else if (mat == 5) {
    // the inked drum: mesh master, wet ink, the design mirrored on it, turning
    float ang = atan(P.y - DCY, P.z - NIP);
    float u = ang*DR + uDrumA;                                   // mm along the circumference
    vec2 dp = vec2(-P.x, mod(u, 640.) - 320.);
    float d = textureLod(uInk, dp/PSZ + .5, 1.)[int(uDrumCol)];
    vec3 inkC = uDrumCol < .5 ? vec3(.95,.05,.40) : vec3(.04,.18,.56);
    vec3 master = vec3(.55,.52,.48);                              // the stencil master film over the drum mesh
    float mesh = .9 + .1*sin(P.x*4.0)*sin(u*4.0);
    vec3 alb = mix(master*mix(vec3(1.), inkC, .35), inkC*.75, smoothstep(.2, .6, d))*mesh;
    vec3 rf = reflect(rd, N); float F = .04 + .96*pow(1. - max(dot(N, V), 0.), 5.);
    float wetI = smoothstep(.2, .6, d);
    col = alb*lightDiffuse(N, 1.)*.9 + env(rf)*(F*.6 + .03 + wetI*.10);
    col *= mix(1., .55, smoothstep(10., 80., P.y));               // deeper inside it is darker
  }
  else if (mat == 6) { vec3 rf = reflect(rd, N); col = vec3(.02)*lightDiffuse(N, 1.) + env(rf)*.05; col *= .5; }
  else if (mat == 7) {
    // the sheet: paper fibre + ink + slight cockle
    vec2 pp = vec2(P.x, P.z - (uZL - PSZ.y*.5)); pp.y = -pp.y;   // poster coords: +y toward the leading edge
    float e = .6; float h0 = paperH(P), hx = paperH(P + vec3(e,0.,0.)), hz = paperH(P + vec3(0.,0.,e));
    vec3 nn = normalize(vec3(-(hx - h0)/e, 1., -(hz - h0)/e));
    float wet; vec3 T = inkAt(pp, uP1, uP2, vec3(1.1, -.7, .0028), vec2(1.), 0., uWet, 0., wet);
    vec3 paper = vec3(.90,.875,.82)*(.97 + .03*vnoise(P.xz*.9) + .02*vnoise(P.xz*6.));
    paper *= 1. - .05*smoothstep(.6, 1., vnoise(vec2(P.x*1.5, P.z*.08)));            // fibre streaks
    // faint grey tracks of the exit rollers
    float tr = 0.; for (int k=0;k<4;k++){ float x0 = -150. + float(k)*80.; tr += smoothstep(14., 4., abs(P.x - x0)); }
    paper *= 1. - .035*tr;
    vec3 alb = paper*T;
    float fl = (1. - T.g)*(T.r > .8 ? 1. : 0.);                       // fluorescent pink glows a little
    float sh = 1. - .3*smoothstep(20., 0., P.z)*step(P.z, 20.);
    float wsh = 1.;
    if (uS2.z > .5) { float hgt = .3 + uFloat2; vec3 Ps = P - vec3(-.35, 0., .45)*hgt;            // where the second sheet shades this point
      vec2 q = s2Local(Ps); vec2 dq = abs(q) - PSZ*.5; float od = max(dq.x, dq.y);
