<script>
/* ===== 21 油画厚涂 · OIL IMPASTO =====
   A stretched linen canvas on an easel under one warm raking softbox. Every brush / palette-knife stroke is a
   GPU strip that writes colour + paint height + gloss into 4096x2560 maps (bristle grooves, edge ridges, dry-brush
   skips that show the linen weave, knife plateaus with a lip of paint). The maps are then lit by a perspective
   height-field ray marcher: soft raking shadows, cavity AO, glossy GGX highlights of wet oil, a steel palette
   knife with its own reflections and shadow, depth of field and a filmic grade.
   0.25s the knife lays the first ribbon · strokes stack on the beat into a vase of flowers (timelapse) ·
   4.5s the camera drops to grazing height and the paint rises like a mountain range · pull back, signature,
   the title is painted in thick cream paint and holds. */
const { E, clamp, lerp, inv } = Reel;
const stage = Reel.makeStage('#0b0a09');
const C = Reel.cfg({});
const RS = Reel.RS, W = Math.round(1920 * RS), H = Math.round(1080 * RS);
Reel.ownJitter = true;
const PW = 4096, PH = 2560;              // painting maps (texels); 1 texel ≈ 0.16 mm of a 65 cm canvas

const R = Reel.rng(2126);
const rr = (a, b) => a + (b - a) * R();
const hex = (h) => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const mixc = (a, b, k) => { const A = hex(a), B = hex(b); return '#' + A.map((x, i) => Math.round(lerp(x, B[i], k) * 255).toString(16).padStart(2, '0')).join(''); };
const SANS = '"Noto Sans CJK SC"', SERIF = '"Noto Serif CJK SC"';

// ================= the painting, stroke by stroke =================
// spec: { pts, w, A, B, th (paint level), k (0 brush 1 knife 2 dab), dry, gl, mx, g (group), cap }
const SPEC = [];
const add = (g, pts, w, A, B, th, o = {}) => SPEC.push(Object.assign({ g, pts, w, A, B: B || A, th, k: 0, dry: 0.35, gl: 0.6, mx: 0.5 }, o));
/// --- the opening palette-knife ribbon (deep teal marbled with titanium white)
const KNIFE_PTS = [[330, 470], [1000, 560], [1650, 650], [2250, 800]];
add('k1', KNIFE_PTS, 420, '#1b3f4c', '#e9e5da', 7, { k: 1, dry: 0.3, gl: 0.95, mx: 0.55, cap: 0.2 });
const jit = (c, a = 0.06) => { const A = hex(c); return '#' + A.map((x) => Math.round(clamp(x + rr(-a, a) * (0.6 + x)) * 255).toString(16).padStart(2, '0')).join(''); };
const pick = (arr) => arr[Math.floor(R() * arr.length)];
const BG_D = ['#172a30', '#1e3438', '#22322d', '#2a2b26', '#1b2c34'], BG_M = ['#34504c', '#3f5a58', '#4a5e52', '#3a4e5e', '#465a50'],
  BG_L = ['#7f8c7c', '#959682', '#a8a28a', '#8c9c94', '#9e9c86'], BG_A = ['#6b7a5a', '#7d6a48', '#4c6a80', '#5d6f6a'];
const halo = (x, y) => Math.exp(-(((x - 2780) / 1050) ** 2 + ((y - 760) / 760) ** 2));
const bgCol = (x, y) => { const h = halo(x, y), l = clamp(1 - x / 2600); const d = pick(BG_D), m = pick(BG_M), li = pick(BG_L);
  return h > 0.42 ? mixc(m, li, clamp((h - 0.42) / 0.5)) : mixc(m, d, clamp(l * 0.9 + 0.1 + rr(-0.2, 0.2))); };
const KDIST = (x, y) => { let d = 1e9; for (let i = 0; i < KNIFE_PTS.length - 1; i++) { const [ax, ay] = KNIFE_PTS[i], [bx, by] = KNIFE_PTS[i + 1]; const t = clamp(((x - ax) * (bx - ax) + (y - ay) * (by - ay)) / ((bx - ax) ** 2 + (by - ay) ** 2)); d = Math.min(d, Math.hypot(x - ax - t * (bx - ax), y - ay - t * (by - ay))); } return d; };
(function bg() {
  // 0: thin toned ground over the whole background (leaves the knife ribbon alone)
  for (let row = 0; row < 6; row++) for (let k = 0; k < 2; k++) {
    const y = -60 + row * 360 + rr(-30, 30), x0 = k ? 1900 : -300, x1 = x0 + 2600;
    if (KDIST((x0 + x1) / 2, y) < 150 && row < 2 && k === 0) continue;
    add('bg0', [[x0, y + rr(-60, 60)], [(x0 + x1) / 2, y + rr(-40, 40)], [x1, y + rr(-60, 60)]], 470, jit(bgCol((x0 + x1) / 2, y), 0.03), jit(bgCol(x1, y), 0.03), 1.2, { dry: 0.12, gl: 0.45, mx: 0.5 });
  }
  // 1: crosshatched body strokes
  const cells = [];
  for (let gy = 0; gy < 7; gy++) for (let gx = 0; gx < 11; gx++) cells.push([gx * 400 + rr(-110, 110) + (gy % 2) * 180 - 100, gy * 290 + rr(-60, 60) + 40, gy]);
  cells.sort((a, b) => (a[0] * 0.5 + a[1]) - (b[0] * 0.5 + b[1]) + rr(-300, 300));
  for (const [x, y, gy] of cells) {
    if (y > 1900) continue;
    if (KDIST(x, y) < 230 && R() < 0.85) continue;
    const ang = (gy % 2 ? 0.45 : -0.35) + rr(-0.3, 0.3), len = rr(600, 980), knife = R() < 0.14;
    const dx = Math.cos(ang) * len / 2, dy = Math.sin(ang) * len / 2, bend = rr(-70, 70);
    const A = jit(bgCol(x, y), 0.04);
    const B = R() < 0.5 ? mixc(A, pick(BG_A), 0.5) : mixc(A, halo(x, y) > 0.45 ? pick(BG_L) : pick(BG_D), 0.55);

    add('bg1', [[x - dx, y - dy], [x + bend * Math.sin(ang), y - bend * Math.cos(ang)], [x + dx, y + dy]], knife ? rr(230, 320) : 190 * rr(0.5, 1.8), A, B,
      rr(3.6, 4.6), knife ? { k: 1, dry: 0.45, gl: 0.85, mx: 0.5, cap: 0.6 } : { dry: dryB, gl: 0.6, mx: 0.55, wf: (u) => (sw + (1 - sw) * clamp(u / bulge)) * (1 - 0.35 * clamp((u - 0.7) / 0.3)) });

  for (let i = 0; i < 16; i++) {

    if (halo(x, y) < 0.3) continue;

  }
  for (let i = 0; i < 12; i++) {
    const x = rr(-100, 4200), y = rr(-50, 1850), a = rr(-0.6, 0.6), l = rr(220, 420);
    if (halo(x, y) > 0.35 || KDIST(x, y) < 250) continue;
    add('bg2', [[x - Math.cos(a) * l / 2, y - Math.sin(a) * l / 2], [x + Math.cos(a) * l / 2, y + Math.sin(a) * l / 2]], rr(100, 170), jit(pick(BG_A), 0.04), jit(pick(BG_D), 0.03), 4.5, { dry: 0.6, gl: 0.7, mx: 0.6 });
  }
})();
// --- table: horizontal strokes, lit from the left, dark front edge
(function table() {   // a painter's table: a few broad warm ochre sweeps, a dark front edge, the vase's reflection
  for (let i = 0; i < 2; i++) add('tb0', [[-300, 1960 + i * 330], [2000, 1975 + i * 330], [4400, 1955 + i * 330]], 420, i < 1 ? '#7a5028' : '#3a2416', i < 1 ? '#8e6232' : '#2a1a10', 1.2, { dry: 0.1, gl: 0.45 });
  const ty = [1895, 1990, 2085, 2180, 2255];
  ty.forEach((y, i) => {
    const x0 = -350 + (i % 2) * 300 + rr(-100, 100), x1 = 4450;

// --- vase: a cobalt jug, strokes following the form, highlight on the lit (left) side
const VX = 2700;
const vr = (y) => y < 1395 ? 150 : y < 1570 ? lerp(118, 106, (y - 1395) / 175) : y < 1780 ? lerp(106, 292, E.outSine((y - 1570) / 210)) : y < 1990 ? lerp(292, 270, (y - 1780) / 210) : lerp(270, 196, E.inQuad((y - 1990) / 100));
(function vase() {

  for (let k = -2; k <= 2; k++) { const pts = []; for (let y = 1370; y <= 2030; y += 110) pts.push([VX + vr(y) * k * 0.36, y]); add('vs', pts, 230, '#18264f', '#1f3268', 6, { dry: 0.15, gl: 0.8, mx: 0.4, cap: 0.25 }); }
  for (let k = -5; k <= 5; k++) {
    const f = k / 5.35, pts = [];
    for (let y = 1365; y <= 2010; y += 60) pts.push([VX + vr(y) * f * (1 + 0.03 * Math.sin(y * 0.012 + k * 1.7)), y + (k % 2) * 12]);
    pts.push([VX + vr(2035) * f * 0.97, 2035]);
    const lit = clamp(0.48 - f * 0.6 + rr(-0.08, 0.08));
    add('vs', pts, rr(66, 86), jit(mixc('#111b40', '#4466a8', lit), 0.03), jit(mixc('#1b2a5c', '#7d97c8', lit), 0.03), 6.5 + rr(0, 1.2), { dry: 0.4, gl: 0.9, mx: 0.6, cap: 0.3, wf: (u) => 1 - 0.25 * clamp((u - 0.85) / 0.15) });
  }
  // the foot: a dark rim curving around the base, the shadow right under it
  add('vs', Array.from({ length: 13 }, (_, i) => { const a = Math.PI * (1 - i / 12); return [VX + Math.cos(a) * 214, 2052 + Math.sin(a) * 16]; }), 46, '#0e1838', '#1c2a58', 7.2, { dry: 0.3, gl: 0.85, mx: 0.4, cap: 0.4 });
  add('vs', Array.from({ length: 11 }, (_, i) => { const a = Math.PI * (1 - i / 10); return [VX + 20 + Math.cos(a) * 205, 2074 + Math.sin(a) * 9]; }), 20, '#2a1a10', '#3a2416', 5.2, { dry: 0.45, gl: 0.5, mx: 0.5, cap: 0.6 });
  for (let j = 0; j < 3; j++) {
    const y = 1720 + j * 110, pts = [];
    for (let a = -1.05; a <= 1.05; a += 0.15) pts.push([VX + Math.sin(a) * vr(y) * 0.93, y + Math.cos(a) * 26]);
    if (j === 1) add('vs', pts.slice(0, 7), 46, '#26437e', '#5a78b0', 6, { dry: 0.9, gl: 0.9, mx: 0.5 });
  }
  add('vs', [[VX - 150, 1352], [VX, 1333], [VX + 150, 1352]], 44, '#7d9ee0', '#dfe8fa', 8, { gl: 0.95 });
  add('vs', [[VX - 145, 1364], [VX, 1394], [VX + 145, 1364]], 30, '#0d173e', '#203a80', 8, { gl: 0.8 });
  add('vs', [[VX - 168, 1640], [VX - 222, 1765], [VX - 202, 1890]], 58, '#a9bde0', '#e9eef6', 9, { dry: 0.6, gl: 1, mx: 0.5 }); // highlight
  add('vs', [[VX - 90, 1428], [VX - 99, 1480], [VX - 96, 1530]], 26, '#8aa6dc', '#cbd9f2', 8.2, { dry: 0.75, gl: 1, mx: 0.6 });
  add('vs', [[VX + 252, 1790], [VX + 264, 1860], [VX + 257, 1935]], 22, '#2f4a86', '#4f6b9e', 7, { dry: 0.85, gl: 0.9, mx: 0.6 });  // reflected light
})();
// --- bouquet layout
const FL = [ // [x, y, r, type, depth]
  [2620, 540, 200, 'peony', 0], [2250, 650, 150, 'poppy', 0], [3060, 560, 165, 'poppy', 0], [3430, 830, 95, 'daisy', 0],
  [2000, 830, 72, 'yellow', 0], [2860, 330, 72, 'corn', 0], [3330, 400, 62, 'yellow', 0],
  [3190, 1060, 175, 'peony', 1], [2660, 960, 150, 'poppy', 1], [2180, 1080, 102, 'daisy', 1], [3520, 1180, 66, 'corn', 1], [2420, 1250, 60, 'yellow', 1],
  [2950, 1270, 128, 'poppy', 2],
];
(function stems() {
  for (const [x, y, r] of FL) {
    const x0 = VX + clamp((x - VX) * 0.12, -70, 70), y0 = 1370;
    add('st', [[x0, y0], [lerp(x0, x, 0.45) + rr(-40, 40), lerp(y0, y, 0.5)], [lerp(x0, x, 0.9), lerp(y0, y, 0.9)]], rr(16, 24), jit(mixc('#24401e', '#3f5f27', R()), 0.03), '#5a7a32', 6, { dry: 0.3, gl: 0.6, mx: 0.4 });
  }
  const LV = [[2380, 1180, 2.5, 300], [2530, 1330, 2.9, 260], [2880, 1380, 0.4, 280], [3080, 1300, 0.2, 330], [3340, 1300, 0.55, 300], [2120, 900, 3.4, 260],
    [3450, 980, 0.0, 280], [2430, 830, 2.2, 240], [2860, 780, 1.1, 230], [3280, 700, 0.3, 250], [2050, 1240, 2.7, 280], [2780, 1180, 1.3, 220], [3600, 1330, 0.5, 220], [2240, 430, 3.9, 230]];
  for (const [x, y, a, l] of LV) {
    const c = Math.cos(a), s = Math.sin(a), ben = rr(-0.3, 0.3);
    const tip = [x + c * l, y + s * l + l * 0.18];
    const mid = [x + c * l * 0.5 - s * l * 0.12 * ben, y + s * l * 0.5 + c * l * 0.12 * ben];
    const lit = clamp(0.5 - c * 0.3 - s * 0.3);
    add('lv', [[x, y], mid, tip], rr(76, 100), jit(mixc('#25401f', '#5d7a36', lit), 0.04), jit(mixc('#3e5e28', '#93a452', lit), 0.04), 7.5 + rr(0, 1.5), { dry: 0.55, gl: 0.8, mx: 0.6, wf: (u) => Math.pow(Math.sin(Math.PI * clamp(u * 0.9 + 0.1)), 0.65) });
  }
})();
(function flowers() {
  const order = FL.map((f, i) => [f, i]).sort((a, b) => a[0][4] - b[0][4] || a[0][1] - b[0][1]);
  const LA = Math.atan2(-0.62, -0.78); // painted light from the upper left
  for (const [[x, y, r, ty]] of order) {
    const lit = (a) => 0.5 + 0.5 * Math.cos(a - LA);
    const petal = (a, r0, r1, ww, A, B, th, o = {}) => {
      const p0 = [x + Math.cos(a) * r * r0, y + Math.sin(a) * r * r0], p1 = [x + Math.cos(a + 0.12) * r * (r0 + r1) / 2, y + Math.sin(a + 0.12) * r * (r0 + r1) / 2], p2 = [x + Math.cos(a) * r * r1, y + Math.sin(a) * r * r1];

      for (let k = 0; k < 4; k++) { const a = a0 + 0.6 + k * 1.57 + rr(-0.2, 0.2), L = lit(a); petal(a, 0.15, 0.6, 0.5, jit(mixc('#c22c1c', '#ff7a46', L), 0.03), jit(mixc('#e85a30', '#ffb080', L), 0.03), 7, { dry: 0.6 }); }

      add('fl', [[x - r * 0.03, y], [x + r * 0.03, y + 0.01]], r * 0.17, '#8a9a6a', '#c8d09a', 8, { k: 2, gl: 0.85, mx: 0.5 });

          petal(a, rin, rout, ww, jit(mixc('#a88c86', '#f6ead8', L), 0.02), jit(mixc('#e2b8a8', '#fff8ec', L), 0.02), 7.5 + ring * 1.5, { dry: 0.45 });
        }
      }
      add('fl', [[x - r * 0.08, y], [x + r * 0.08, y + r * 0.04]], r * 0.22, '#e9c69c', '#f6e2bf', 10, { k: 2, gl: 0.9 });
      add('hi', [[x - r * 0.38, y - r * 0.44], [x - r * 0.14, y - r * 0.54]], r * 0.22, '#fff6ea', '#ffffff', 8, { k: 2, gl: 1, mx: 0.3 });
    } else if (ty === 'daisy') {
      const a0 = rr(0, 6.28);

    } else if (ty === 'yellow') {

  add('fl', [[2300, 2235], [2380, 2252]], 84, '#c0301c', '#f07040', 7, { k: 2, gl: 0.85 });
  add('hi', [[1300, 2300], [1700, 2299]], 16, '#fff0c8', '#ffffff', 5, { gl: 1 });
})();
// --- the ending: the palette knife comes back and lays one thick cream highlight down the vase's lit side (7.5–8.0)
const K2_PTS = [1610, 1665, 1725, 1790, 1855, 1925].map((y) => [VX - vr(y) * 0.64 - 6, y]);

// ================= title / signature glyph masks =================
function buildText() {
  const w = PW >> 1, h = PH >> 1, s = 0.5;
  const mk = () => { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d', { willReadFrequently: true }); g.fillStyle = '#000'; g.fillRect(0, 0, w, h); g.scale(s, s); return [c, g]; };
  const [cm, gm] = mk(), [cr, gr] = mk();
  const items = [];  // [text, font, x, baseline, t0, t1, spacing]
  const T0 = 6.7, SPAN = 2.0;
  // title (Chinese): one character per beat-half
  const tt = [...C.title];
  tt.forEach((ch, i) => items.push([ch, `900 300px ${SERIF}`, 360 + i * 335, 1330, 7.2 + i * 0.23, 7.2 + i * 0.23 + 0.34]));
  // english line
  items.push([C.en, `700 118px ${SERIF}`, 372, 1545, 8.02, 8.38, 22]);
  // signature (low-key, on the dark front edge of the table)
  items.push([C.sign + ' ' + C.signEn, `700 58px ${SERIF}`, 3330, 2468, 6.78, 7.12, 6]);
  for (const [txt, font, x, y, a, b, sp] of items) {
    gm.font = font; gr.font = font;
    gm.fillStyle = '#fff';
    const chars = sp ? [...txt] : [txt];
    let cx = x;
    const widths = chars.map((c) => gm.measureText(c).width + (sp || 0));
    const total = widths.reduce((p, q) => p + q, 0) - (sp || 0);
    const asc = parseFloat(font.split(' ')[1]);
    const grad = gr.createLinearGradient(x, y - asc, x + total, y + asc * 0.15 + (sp ? total * 0.05 : asc * 0.8));
    const va = (a - T0) / SPAN, vb = (b - T0) / SPAN;
    grad.addColorStop(0, `rgb(0,0,${Math.round(va * 255)})`); grad.addColorStop(1, `rgb(0,0,${Math.round(vb * 255)})`);
    gr.fillStyle = grad; gr.strokeStyle = grad; gr.lineWidth = 10;
    chars.forEach((c, i) => { gm.fillText(c, cx, y); gr.fillText(c, cx, y); gr.strokeText(c, cx, y); cx += widths[i]; });
  }
  // blurred copy (G) for the groove direction / lip
  const cb = document.createElement('canvas'); cb.width = w; cb.height = h; const gb = cb.getContext('2d', { willReadFrequently: true });
  gb.fillStyle = '#000'; gb.fillRect(0, 0, w, h); gb.filter = 'blur(5px)'; gb.drawImage(cm, 0, 0);
  const M = gm.getImageData(0, 0, w, h).data, B = gb.getImageData(0, 0, w, h).data, RR = gr.getImageData(0, 0, w, h).data;
  const out = new ImageData(w, h); const O = out.data;
  for (let i = 0; i < O.length; i += 4) { O[i] = M[i]; O[i + 1] = B[i]; O[i + 2] = RR[i + 2]; O[i + 3] = 255; }
  const co = document.createElement('canvas'); co.width = w; co.height = h; co.getContext('2d').putImageData(out, 0, 0);
  gl.bindTexture(gl.TEXTURE_2D, tTXT.tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, co);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
}

// ================= camera =================
const V3 = { add: (a, b) => a.map((x, i) => x + b[i]), sub: (a, b) => a.map((x, i) => x - b[i]), mul: (a, k) => a.map((x) => x * k), dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],

// keys: [t, ro, ta, tanF, focusOffset, aperture]
const CX = PW / 2, CY = -PH / 2;
// camera: [t, ro, ta, tanF, aperture]; segment eases chosen so velocity is continuous where it matters
// one continuous camera curve: Hermite through the keys with velocity carried through every key
// (x, y: Catmull–Rom tangents · height z and lens: monotone tangents, so the camera never dips into the paint)
const KEYS = [
  [0.0, orb([1750, -1080, 0], 5100, [0.17, -0.21, 1]), [1750, -1080, 0], 0.3, 0],
  [3.8, orb([2560, -1010, 0], 3780, [0.05, -0.11, 1]), [2560, -1010, 0], 0.3, 0],
  [4.0, orb([2575, -1005, 0], 3880, [0.045, -0.105, 1]), [2575, -1005, 0], 0.3, 0],        // a breath back before the dive
  [4.72, [2080, -1650, 240], [2370, -1130, 0], 0.3, 2.0],
  [6.15, [2880, -1620, 225], [3130, -1110, 0], 0.3, 2.0],
  [7.15, orb([2560, -1220, 0], 4100, [0.0, -0.0001, 1]), [2560, -1220, 0], 0.3, 0],
  [8.0, orb([4096 - 40 - 3920 / 2, -1250, 0], 3920 / 1.06667, [0.0, -0.0001, 1]), [4096 - 40 - 3920 / 2, -1250, 0], 0.3, 0],
  [8.6, orb([4096 - 40 - 3720 / 2, -1250, 0], 3720 / 1.06667, [0.0, -0.0001, 1]), [4096 - 40 - 3720 / 2, -1250, 0], 0.3, 0],
];
const CAMV = KEYS.map((k) => [k[0], [...k[1], ...k[2], k[3], k[4]]]);
const MODE = ['cr', 'cr', 'mono', 'cr', 'cr', 'mono', 'mono', 'mono'];
const TAN = CAMV.map(([t, v], i) => v.map((x, d) => {
  if (i === 0 || i === CAMV.length - 1) return 0;
  const [t0, v0] = CAMV[i - 1], [t1, v1] = CAMV[i + 1];
  const a = (x - v0[d]) / (t - t0), b = (v1[d] - x) / (t1 - t);
  if (MODE[d] === 'cr') return (v1[d] - v0[d]) / (t1 - t0);

function camAt(t) {
  let i = 0; while (i < CAMV.length - 2 && t > CAMV[i + 1][0]) i++;
  const [ta_, va] = CAMV[i], [tb_, vb] = CAMV[i + 1], h = tb_ - ta_, u = clamp((t - ta_) / h);

const hsAt = (t) => 1 + 1.9 * E.inOutCubic(inv(4.35, 5.0, t)) - 1.75 * E.inOutCubic(inv(6.2, 7.05, t));

// ================= palette knife pose =================
const KS = SG.crSample(KNIFE_PTS, 4); const KCL = [0]; for (let i = 1; i < KS.length; i++) KCL.push(KCL[i - 1] + Math.hypot(KS[i][0] - KS[i - 1][0], KS[i][1] - KS[i - 1][1]));
const KL = KCL[KCL.length - 1];
function pathAt(s) { let i = 1; while (i < KCL.length - 1 && KCL[i] < s) i++; const k = clamp((s - KCL[i - 1]) / (KCL[i] - KCL[i - 1] || 1)); const p = [lerp(KS[i - 1][0], KS[i][0], k), lerp(KS[i - 1][1], KS[i][1], k)]; const d = V3.norm([KS[i][0] - KS[i - 1][0], -(KS[i][1] - KS[i - 1][1]), 0]); return { p, d }; }

const KPASS = [
  { path: mkPath(KNIFE_PTS), t0: 0.25, t1: 1.0, tin: 0.0, tout: 1.38, hl: 205, hw: 74, side: 1, come: [0, 0], go: [1000, -1600], z0: 10.5, pa: '#1d4351', pb: '#ebe7dc' },
  { path: mkPath(K2_PTS), t0: 7.5, t1: 8.0, tin: 7.2, tout: 8.32, hl: 50, hw: 20, side: -1, come: [1500, 500], go: [1400, 700], z0: 13.5, pa: '#f1e7cf', pb: '#ffffff' },
];
function passPathAt(P, s) { const KS = P.S, KCL = P.L; let i = 1; while (i < KCL.length - 1 && KCL[i] < s) i++; const k = clamp((s - KCL[i - 1]) / (KCL[i] - KCL[i - 1] || 1)); const p = [lerp(KS[i - 1][0], KS[i][0], k), lerp(KS[i - 1][1], KS[i][1], k)]; const d = V3.norm([KS[i][0] - KS[i - 1][0], -(KS[i][1] - KS[i - 1][1]), 0]); return { p, d }; }

}

// ================= render =================
Reel.scene({
  duration: 10, fps: 30,
  async setup() {},
  cues: [
    { t: 0.25, sfx: 'knife', gain: 0.9 },
    { t: 1.0, sfx: 'brush', gain: 0.55 }, { t: 1.25, sfx: 'brush', gain: 0.35 }, { t: 1.5, sfx: 'brush', gain: 0.45 }, { t: 1.75, sfx: 'brush', gain: 0.35 },
    { t: 2.0, sfx: 'brush', gain: 0.45 }, { t: 2.25, sfx: 'brush', gain: 0.45 }, { t: 2.5, sfx: 'brush', gain: 0.5 }, { t: 3.0, sfx: 'brush', gain: 0.45 },
    { t: 3.5, sfx: 'dabs', gain: 0.6 },
    { t: 4.0, sfx: 'whoosh', gain: 0.35 }, { t: 4.4, sfx: 'rise', gain: 0.55 },
    { t: 6.15, sfx: 'whoosh', gain: 0.25 },

      .v('ro', cam.ro).v('cf', fwd).v('cr', right).v('cu', up).f('tanF', cam.tanF).f('hs', hs).f('top', HMAX * hs)
      .v('Ld', Ld).f('Lc', 2.75, 2.3, 1.74).f('Ac', 0.15, 0.18, 0.23).f('kOn', kn ? 1 : 0);

      const focus = Math.hypot(...V3.sub(cam.ta, cam.ro)) * 0.62;
      SG.bind(gl, fDF);
      pDof.use().t('S', tSH).f('res', W, H).f('aper', cam.ap * 5 * RS).f('maxC', cam.ap * 5 * RS + 0.01);
      QUAD.draw(); src = tDF;
    }
    // 5. bloom + grade
    SG.bind(gl, fB1); pBright.use().t('S', src).f('px', 1 / W, 1 / H).f('th', 1.1); QUAD.draw();
    SG.bind(gl, fB2); pBlur.use().t('S', tB1).f('dir', 1 / bw, 0); QUAD.draw();
    SG.bind(gl, fB1); pBlur.use().t('S', tB2).f('dir', 0, 1 / bh); QUAD.draw();
    SG.bind(gl, fB3); pBlur.use().t('S', tB1).f('dir', 2 / (bw >> 1), 0); QUAD.draw();
    SG.bind(gl, fB4); pBlur.use().t('S', tB3).f('dir', 0, 2 / (bh >> 1)); QUAD.draw();
    SG.bind(gl, null); gl.viewport(0, 0, W, H);
    const beat = Math.floor(t * 2);
    const flick = t > 1 && t < 4.2 ? 1 + (Reel.hash(beat * 3.7) - 0.5) * 0.035 : 1;
    pComp.use().t('S', src).t('B1', tB1).t('B2', tB4).f('res', W, H).f('expo', 0.92 * flick).f('bloom', 0.22).f('vig', 0.38).f('grain', 0.028)
      .f('seed', Math.floor(t * 30) % 97).f('ca', 0.0012);
    QUAD.draw();
    gl.finish();
  },
});
