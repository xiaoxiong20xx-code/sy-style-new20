/* ------------------------------------------------------------------ scene shader */

  if (b.type == 1 || b.type == 4) { vec2 d = vec2(length(q.xz) - hs.x + RB, abs(q.y) - hs.y + RB); return min(max(d.x,d.y),0.) + length(max(d,0.)) - RB; }
  if (b.type == 2) { float h = clamp((q.y + hs.y)/(2.*hs.y), 0., 1.); float r = mix(hs.x, .62, h);
    vec2 d = vec2((length(q.xz) - r)*.9, abs(q.y) - hs.y); return min(max(d.x,d.y),0.) + length(max(d,0.)); }

float sdStuds(Bk b, vec3 q){

float sdFull(Bk b, vec3 p){ vec3 q = toLocal(b, p); return min(sdBody(b, q), sdStuds(b, q)); }
// baseplate stud field
float sdBaseStud(vec3 p){ vec2 c = floor(p.xz); return sdStud(vec3(p.x - c.x - .5, p.y, p.z - c.y - .5)); }
uint cellAt(ivec3 c){ if (any(lessThan(c, ivec3(0))) || any(greaterThanEqual(c, ivec3(${GX},${GY},${GZ})))) return 0u; return texelFetch(uGrid, c, 0).r; }

float shadowRay(vec3 ro, vec3 rd){

      float tn = min(tMax.x, min(tMax.y, tMax.z));
      uint id = cellAt(c);

        if ((b.flags & 1) == 0) for (int s=0;s<3;s++){ float ts = mix(tc, tn, (float(s) + .5)/3.); if (ts < .02) continue; float d = sdBody(b, toLocal(b, ro + rd*ts)); res = min(res, 9.*d/ts); }

float occAt(vec3 p){ return texture(uOcc, p/GD).r; }
vec3 sky(vec3 d){
  float h = d.y;
  vec3 c = mix(vec3(.80,.80,.78), vec3(.36,.56,.88), smoothstep(-.03, .2, h));
  c = mix(c, vec3(.14,.30,.70), smoothstep(.28, .9, h));
