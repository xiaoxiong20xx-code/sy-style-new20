<script>
/* ===== 35 字符画 · ASCII Art =====
   Real world: an amber monochrome CRT terminal on a desk in a dark room. Beige plastic casing, curved glass that
   reflects a far window, P3 amber phosphor with afterglow, 12 raster lines per character row.
   0.3s power-on (dot -> line -> raster). Characters rain down and lock into a rotating ASCII Earth.
   4s (hook): the camera dives into the glass until single characters fill the frame — every one is a real glyph,
   drawn line by line by the beam. Pull back; the globe rains away; the command line types the title, which prints
   as FIGlet-style banners. */
const { E, clamp, inv, lerp } = Reel;
const stage = Reel.makeStage('#000');
Reel.ownJitter = true;
const C = Reel.cfg({ cmd: 'type world.txt' });
const COLS = 96, ROWS = 36;

/* ---------------- glyph atlas (16 x 8 slots, 48 x 96 px) ---------------- */
const GW = 48, GH = 96;
const atlas = Object.assign(document.createElement('canvas'), { width: GW * 16, height: GH * 8 });

  g.font = '700 78px "DejaVu Sans Mono"';
  const slot = (i) => [(i % 16) * GW, Math.floor(i / 16) * GH];
  for (let c = 33; c < 127; c++) { const [x, y] = slot(c - 32); g.fillText(String.fromCharCode(c), x + GW / 2, y + 70); }

  [[95, 1], [96, 0.72], [97, 0.48], [98, 0.24]].forEach(([i, a]) => { const [x, y] = slot(i); g.globalAlpha = a; g.fillRect(x + 2, y + 6, GW - 4, GH - 12); g.globalAlpha = 1; });
  // double-width CJK glyphs (left/right halves in adjacent slots)
  let k = 100;
  for (const ch of []) {
    const [x, y] = slot(k); g.font = '700 84px "Noto Sans CJK SC"'; g.fillText(ch, x + GW, y + 76); CJK[ch] = k; k += 2;

const ASC = (ch) => { const c = ch.charCodeAt(0); return c >= 32 && c < 127 ? c - 32 : 0; };

/* ---------------- world map (very rough continents, equirectangular) ---------------- */

    [[-97, 21], [-91, 16], [-84, 10], [-78, 8], [-84, 14], [-91, 18]],
    [[-80, 10], [-62, 11], [-50, 0], [-35, -6], [-40, -22], [-57, -37], [-67, -55], [-74, -50], [-72, -32], [-81, -5]],
    [[-55, 60], [-44, 60], [-20, 70], [-24, 82], [-60, 82], [-72, 77]],
    [[-10, 36], [-1, 43], [-4, 48], [3, 51], [9, 55], [5, 62], [15, 70], [30, 71], [42, 67], [47, 55], [32, 46], [26, 37], [16, 38], [11, 44], [3, 43]],
    [[-17, 21], [-10, 31], [10, 37], [32, 31], [43, 12], [51, 12], [41, -4], [40, -15], [34, -26], [20, -35], [15, -28], [10, -5], [6, 5], [-9, 5], [-17, 14]],
    [[30, 45], [40, 67], [70, 74], [100, 78], [140, 73], [180, 69], [172, 61], [157, 51], [141, 41], [122, 31], [120, 22], [108, 20], [105, 9], [100, 2], [96, 16], [91, 22], [81, 15], [77, 8], [72, 21], [61, 25], [52, 28], [44, 13], [35, 29], [28, 37], [30, 42]],
    [[95, 5], [106, -7], [121, -9], [141, -6], [131, 1], [118, 6]],
    [[114, -22], [130, -12], [142, -11], [153, -25], [150, -38], [140, -38], [130, -32], [115, -35]],
    [[130, 31], [140, 35], [143, 44], [139, 40]],
    [[-6, 50], [2, 51], [-2, 58], [-6, 56]],
    [[44, -13], [50, -15], [47, -25], [43, -22]],
    [[166, -46], [174, -36], [178, -40], [168, -47]],

const land = (lon, lat) => { const x = ((lon / (2 * Math.PI) + 0.5) % 1 + 1) % 1 * MAPW, y = clamp((0.5 - lat / Math.PI)) * (MAPH - 1); return landMap[Math.floor(y) * MAPW + Math.floor(x) % MAPW]; };

/* ---------------- banners: text rasterised onto the character grid ---------------- */
const RAMP = ' .:-=+*#%@';
let BANNERS = [];
function banner(text, font, row0, rows, sub = 8) {
  const W = COLS * sub, H = rows * sub * 2;
  const cv = Object.assign(document.createElement('canvas'), { width: W, height: H });
  const g = cv.getContext('2d', { willReadFrequently: true });
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H); g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = font; g.fillText(text, W / 2, H / 2 + H * 0.04);

  for (let r = 0; r < rows; r++) for (let c = 0; c < COLS; c++) {
    let s = 0; for (let y = 0; y < sub * 2; y++) for (let x = 0; x < sub; x++) s += d[((r * sub * 2 + y) * W + c * sub + x) * 4];
    const cov = s / (sub * sub * 2 * 255);
    if (cov > 0.06) cells.push([r + row0, c, RAMP[Math.min(9, Math.round(cov * 9.4))]]);
  }

}

/* ---------------- the screen state at time t ---------------- */
const glyph = new Uint8Array(COLS * ROWS), bright = new Float32Array(COLS * ROWS);
const R = Reel.rng(35);
const COLDROP = Array.from({ length: COLS }, () => { const t0 = 0.5 + R() * 0.75, sp = 24 + R() * 22;
  return { t0, sp, drops: [[t0, sp, 6 + Math.floor(R() * 9)], [t0 + 0.7 + R() * 0.5, 26 + R() * 20, 5 + Math.floor(R() * 8)], [t0 + 1.5 + R() * 0.6, 28 + R() * 20, 4 + Math.floor(R() * 6)]] }; });

function gsample(c, r, t) {
  const cx = (c + 0.5 - COLS / 2) / (COLS * 0.31), cy = -(r + 0.5 - ROWS / 2 - 0.3) / (ROWS * 0.42);
  const d2 = cx * cx + cy * cy; if (d2 >= 1) return { out: true, d2, cx, cy };
  const z = Math.sqrt(1 - d2);
  const tl = 0.4, ct = Math.cos(tl), st = Math.sin(tl);
  const y2 = cy * ct - z * st, z2 = cy * st + z * ct;
  const lat = Math.asin(clamp(y2, -1, 1)), lon = Math.atan2(cx, z2) + t * 0.55 - 1.2;
  const L = [-0.55, 0.45, 0.7], ln = Math.hypot(...L);

}
const RAMP_L = ':-=+*#%@', RAMP_O = ' .,-~';
function edgeChar(gx, gy) {        // gradient points towards the land / the inside; the drawn edge runs across it
  if (gx && !gy) return '|';
  if (gy && !gx) return gy > 0 ? '_' : '-';
  return gx * gy > 0 ? '/' : '\\';
}
function globeCell(c, r, t) {
  const g = gsample(c, r, t);

    if (g.d2 > 1.13) return null;

    const nx = Math.round(-g.cx / Math.sqrt(g.d2) * 1.4), ny = Math.round(g.cy / Math.sqrt(g.d2) * 1.4);
    return { ch: edgeChar(clamp(nx, -1, 1), clamp(ny, -1, 1)), b: 0.22 + 0.25 * (1.13 - g.d2) / 0.13 };
  }

    const k = Math.min(7, Math.floor(g.lit * 8.2)); return { ch: RAMP_L[k], b: 0.5 + 0.5 * g.lit };
  }

// the unrolled globe: a 72 x 22 ASCII world map
const MAPC = 72, MAPR = 22, MAP_C0 = 12, MAP_R0 = 6;
let WORLD = null;
function buildWorld() {
  const L = (mc, mr) => (mc < 0 || mc >= MAPC || mr < 0 || mr >= MAPR) ? 0 : land(-Math.PI + (mc + 0.5) / MAPC * 2 * Math.PI, (0.5 - (mr + 0.5) / MAPR) * Math.PI * 0.76 + 0.06) > 0.5 ? 1 : 0;

    for (let mc = 0; mc < MAPC; mc++) {
      let ch = ' ', b = 0;
      if (L(mc, mr)) {
        const gx = L(mc + 1, mr) - L(mc - 1, mr), gy = L(mc, mr + 1) - L(mc, mr - 1);
        if (gx || gy) { ch = edgeChar(gx, gy); b = 1.0; }

      } else if ((mc + mr * 2) % 4 === 0) { ch = hsh(mc * 3, mr) > 0.8 ? '~' : '.'; b = 0.38; }

function put(r, c, ch, b) {

      const d = COLDROP[c];
      for (let r = 0; r < ROWS; r++) {

        const gc = globeCell(c, r, t);
        if (gc && t > 2.0 + r / ROWS * 0.42 + hsh(c, r) * 0.05) { put(r, c, gc.ch, gc.b); continue; }

    for (let c = 0; c < COLS; c++) for (let r0 = 0; r0 < ROWS; r0++) {

  // the map prints row by row 7.5 -> 8.0, then a fresh prompt with the cursor blinking on the beat
  const R0 = 3, C0 = MAP_C0;

  cEnd = putStr(R0, cEnd, cmd, 1, n);

  if (t < 7.5 && (n < cmd.length || blink(6.5))) put(R0, cEnd, '_', 1);

// keystroke times: "type" in 32nds from 6.625, a half-beat pause, "world.txt" 7.0 -> 7.44, Enter on 7.5
const KEYT = (() => { const k = []; for (let i = 0; i < 4; i++) k.push(6.625 + i * 0.0625); k.push(6.875); for (let i = 0; i < 9; i++) k.push(7.0 + i * 0.0556); return k; })();

const BUF = new Uint8Array(COLS * ROWS * 4), BUF2 = new Uint8Array(COLS * ROWS * 4);
let MEANB = 0;

  const lay = [[0, BUF, 0], [0.033, BUF, 2], [0.07, BUF2, 0], [0.12, BUF2, 2]];

/* ---------------- renderer ---------------- */
const rm = Reel.RM(stage, {
  bloom: 0.55, th: 0.95, expo: 1.0, vig: 0.45, grain: 0.035, ca: 0.7, contrast: 1.05, sat: 1.0, bands: 4,
  uniforms: `
uniform sampler2D uAtlas; uniform highp sampler2D uBuf, uBuf2; uniform float uDist, uBump;
uniform vec3 uRo, uTa; uniform float uFL;
uniform vec4 uPow;        // power-on phase, overall raster brightness, screen light, flicker`,
  scene: `
const vec3 AMBER = vec3(1., .58, .12);
const vec2 OPEN = vec2(.5, .385); const float OY = .03;
const vec2 RAST = vec2(.455, .34);
float sdCase(vec3 p){
  float body = sdRoundBox(p - vec3(0., 0., -.42), vec3(.64, .52, .5), .07);
  float back = sdRoundBox(p - vec3(0., .02, -1.02), vec3(.46, .4, .3), .12);
  float d = smin(body, back, .1);
  float hole = sdRoundBox(p - vec3(0., OY, .12), vec3(OPEN + .035, .2), .05);
  d = smax(d, -hole, .035);
  float foot = sdRoundBox(p - vec3(0., -.56, -.4), vec3(.36, .05, .32), .03);
  return min(d, foot);
}
float mapS(vec3 p){ return min(sdCase(p), p.y + .61); }
vec3 nrmS(vec3 p){ vec2 e = vec2(.0008, 0.); return normalize(vec3(mapS(p + e.xyy) - mapS(p - e.xyy), mapS(p + e.yxy) - mapS(p - e.yxy), mapS(p + e.yyx) - mapS(p - e.yyx))); }
vec3 env(vec3 r){
  vec3 c = vec3(.004, .004, .005);
  // a far window, cool moonlight, behind the camera to the left
  vec3 wc = normalize(vec3(-.8, .55, .5)); float cz = dot(r, wc);
  if (cz > 0.) { vec3 u = normalize(cross(vec3(0., 1., 0.), wc)), v = cross(wc, u); vec2 q = vec2(dot(r, u), dot(r, v)) / cz;
    vec2 e = smoothstep(vec2(.22, .3) + .04, vec2(.22, .3) - .04, abs(q));
    float bars = smoothstep(.006, .014, abs(q.x)) * smoothstep(.006, .014, abs(q.y - .05));
    c += vec3(.55, .65, .85) * .34 * e.x * e.y * bars; }
  return c;
}
// the phosphor image at raster coordinates (s in [0,1]^2, origin top-left)
vec3 phosphor(vec2 s, vec2 ds){
  vec2 g = s * vec2(${COLS}., ${ROWS}.);
  vec2 cell = floor(g), f = fract(g);
  if (any(lessThan(cell, vec2(0.))) || any(greaterThanEqual(cell, vec2(${COLS}., ${ROWS}.)))) return vec3(0.);
  vec4 B = texelFetch(uBuf, ivec2(cell), 0), B2 = texelFetch(uBuf2, ivec2(cell), 0);

  // 12 raster lines per character row: the beam draws the glyph line by line
  float lines = 12.;

  float lineFoot = abs(ds.y) * ${ROWS}. * lines;      // raster lines per screen pixel
  vec2 dg = ds * vec2(${COLS}., ${ROWS}.) / vec2(16., 8.);

    vec2 gb = k == 0 ? B.rg : k == 1 ? B.ba : k == 2 ? B2.rg : B2.ba;

vec3 glassShade(vec3 P, vec3 rd){

}
vec3 screenLight(vec3 P, vec3 n){

const gl = rm.canvas.getContext('webgl2');

/* ---------------- camera ----------------

   the pull-back easing in from 5.5 and settling for the terminal. x/y/target keep moving through 5.0. */
let CLOSE = [0.0, 0.06];
let ZT = null, XT = null, AT = null;
function buildCam() {
  const [cx, cy] = CLOSE;

    { t: 0.0, v: [Math.log(1.75), 2.2] }, { t: 1.8, v: [Math.log(1.55), 2.2] }, { t: 3.4, v: [Math.log(1.3), 2.22] },
    { t: 4.35, v: [Math.log(0.42), 2.32] }, { t: 5.0, v: [Math.log(0.115), 2.4], stop: true }, { t: 5.5, v: [Math.log(0.111), 2.4] },
    { t: 6.6, v: [Math.log(0.72), 2.25] }, { t: 7.3, v: [Math.log(0.5), 2.3] }, { t: 8.0, v: [Math.log(0.9), 2.2] }, { t: 10.0, v: [Math.log(0.885), 2.2] },
  ]);
  XT = Track([
    { t: 0.0, v: [0.5, 0.12] }, { t: 1.8, v: [0.33, 0.085] }, { t: 3.4, v: [0.13, 0.055] }, { t: 4.35, v: [cx + 0.03, cy + 0.004] },
    { t: 5.0, v: [cx + 0.012, cy] }, { t: 5.5, v: [cx - 0.03, cy - 0.004] }, { t: 6.6, v: [-0.07, 0.2] }, { t: 7.3, v: [-0.12, 0.262] }, { t: 8.0, v: [0.0, 0.045] }, { t: 10.0, v: [-0.012, 0.042] },
  ]);
  AT = Track([
    { t: 0.0, v: [0.0, -0.02, 0.0] }, { t: 1.8, v: [0.0, 0.0, 0.0] }, { t: 3.4, v: [0.0, 0.02, -0.05] }, { t: 4.35, v: [cx + 0.02, cy, -0.3] },
    { t: 5.0, v: [cx + 0.012, cy, -0.3] }, { t: 5.5, v: [cx - 0.03, cy - 0.004, -0.3] }, { t: 6.6, v: [-0.07, 0.2, -0.3] }, { t: 7.3, v: [-0.12, 0.262, -0.3] }, { t: 8.0, v: [0.0, 0.04, 0.0] }, { t: 10.0, v: [0.0, 0.04, 0.0] },
