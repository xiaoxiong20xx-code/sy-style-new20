<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>39 光绘长曝光 · Light Painting</title>
<script src="../../lib/core.js"></script><script src="../../lib/gl.js"></script>
</head><body><div id="stage"></div>
<script>
/* ===== 39 光绘长曝光 · LIGHT PAINTING =====
   One long exposure on a tripod in a moonlit old street, wet stone underfoot. The frame IS the exposure:
   everything that has ever glowed stays on the sensor. A light painter sweeps an LED tube into a pair of
   phoenix wings, feather by feather on the beat; at the hook a burning steel-wool whisk spins at the heart of
   the wings, flinging spiral sparks that bounce off the paving and light the whole street orange; then a cold
   pen light draws the phoenix's neck, crested head and a long curling tail. On the downbeat the shutter closes:
   the frame freezes into the finished photograph. Trails are rasterised into an HDR accumulation (energy = power × dwell time), mirrored
   into the wet ground, bloomed and tone-mapped, so cores burn to white and only the halos keep their colour. */
const { E, clamp, inv, lerp } = Reel;
const stage = Reel.makeStage('#020306');
Reel.ownJitter = true;
const TEND = 8.0;   // the shutter closes on the downbeat
const RS = Reel.RS, W = Math.round(1920 * RS), H = Math.round(1080 * RS);
const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
cv.style.cssText = 'position:absolute;left:0;top:0;width:1920px;height:1080px'; stage.appendChild(cv);
const gl = cv.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true, alpha: false });
gl.getExtension('EXT_color_buffer_float'); gl.getExtension('EXT_float_blend');
const G = Reel.GL(cv);
const R = Reel.rng(3909);
const DBG = +(Reel.Q.get('dbg') || 0);

/* ---------------- camera (tripod) ---------------- */
const CAM = { p: [0.1, 1.25, 0.0], pitch: 6 * Math.PI / 180, fovy: 50 * Math.PI / 180 };
const nrm = (a) => { const l = Math.hypot(...a) || 1; return a.map((v) => v / l); };
const crs = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const camBasis = () => {
  const f = [0, Math.sin(CAM.pitch), Math.cos(CAM.pitch)];
  const r = nrm(crs(f, [0, 1, 0])); const u = crs(r, f);      // r = screen right (-x when looking +z)
  return { f, r, u };
};
const CB = camBasis();
const PAINT = [0, 0, 7.2];        // where the painter stands

/* ---------------- background: moonlit street, raymarched once ---------------- */
const BGF = `#version 300 es
precision highp float; in vec2 uv; layout(location=0) out vec4 oMoon; layout(location=1) out vec4 oFire; layout(location=2) out vec4 oAux;
uniform vec3 uCP, uCF, uCR, uCU; uniform float uTan, uAsp; uniform vec3 uFireP;
#define PI 3.14159265
float h11(float p){ p = fract(p*.1031); p *= p + 33.33; p *= p + p; return fract(p); }
float h21(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y)*p3.z); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3. - 2.*f);
  return mix(mix(h21(i), h21(i + vec2(1,0)), f.x), mix(h21(i + vec2(0,1)), h21(i + vec2(1,1)), f.x), f.y); }
float fbm(vec2 p){ float a = .5, s = 0.; for (int i=0;i<5;i++){ s += a*vn(p); p = p*2.03 + 7.1; a *= .5; } return s; }
float sdBox(vec3 p, vec3 b){ vec3 q = abs(p) - b; return length(max(q, 0.)) + min(max(q.x, max(q.y, q.z)), 0.); }
// a row of old shop-houses across the street, facing the camera (bays along x); a corner house frames the left edge
vec4 bay(float seg){
  float h = h11(seg*1.37 + 4.1);
  return vec4(11. + .35*h11(seg*3.1), 4.5 + 1.1*h, h11(seg*5.3 + 2.), h11(seg*8.9 + 1.));   // facade z, eave height, variant, rnd
}
// material ids: 1 ground, 2 plaster, 3 wood, 4 roof tile, 5 lantern, 6 eave underside, 7 dark interior, 8 lit window
vec2 map(vec3 p){
  vec2 res = vec2(p.y, 1.);                                   // ground
  const float BW = 3.6;
  float seg = floor(p.x/BW + .5);
  float xl = p.x - seg*BW;                                    // -1.8..1.8 within the bay
  vec4 B = bay(seg);
  float fz = B.x, eh = B.y;
  float zl = p.z - fz;
  float d = 1e3, mat = 2.;
  if (B.w < .86) {                                            // (one bay is an open alley)
    float roofY = eh + .12 + (zl + 1.15)*.52;
    float wall = max(-zl, p.y - roofY);
    float shop = sdBox(vec3(xl, p.y - 1.15, zl - .22), vec3(1.42, 1.15, .26));
    wall = max(wall, -shop);
    float win = sdBox(vec3(xl - (B.z - .5)*.6, p.y - 3.25, zl - .12), vec3(.82, .55, .16));
    wall = max(wall, -win);
    d = wall; mat = 2.;
    float post = sdBox(vec3(abs(xl) - 1.74, p.y - 1.25, zl + .06), vec3(.13, 1.25, .13));
    float beam = sdBox(vec3(xl, p.y - 2.42, zl + .06), vec3(1.86, .11, .12));
    float wood = min(post, beam);
    float planks = sdBox(vec3(xl, p.y - 1.15, zl - .36), vec3(1.42, 1.15, .05));
    wood = min(wood, planks);
    float lat = sdBox(vec3(xl - (B.z - .5)*.6, p.y - 3.25, zl - .2), vec3(.82, .55, .03));
    vec2 lg = abs(fract(vec2(xl*3.6, (p.y - 3.25)*3.6)) - .5);
    lat = max(lat, -(min(.5 - lg.x, .5 - lg.y) - .08)*.27);
    wood = min(wood, lat);
    if (wood < d) { d = wood; mat = 3.; }
    float glow = sdBox(vec3(xl - (B.z - .5)*.6, p.y - 3.25, zl - .26), vec3(.82, .55, .02));
    if (glow < d) { d = glow; mat = 7. + step(.78, B.z); }
    float eave = sdBox(vec3(xl, p.y - eh, zl + .58), vec3(1.86, .085, .64));
    if (eave < d) { d = eave; mat = 6.; }
    float tile = (p.y - roofY)*.86 - .045*abs(sin(xl*PI*4.6));
    tile = max(tile, -(zl + 1.2)); tile = max(tile, -(p.y - eh + .04));
    if (tile < d) { d = tile; mat = 4.; }
    if (B.z > .3) {
      vec3 lp = vec3(xl - .9*(B.z > .65 ? 1. : -1.), p.y - (eh - .72), zl + .66);
      float ln = length(lp*vec3(1., .82, 1.)) - .2;
      if (ln < d) { d = ln; mat = 5.; }
    }
  } else {
    d = max(-(p.z - fz - 6.), p.y - 9.);                      // back of the alley: far wall in deep shadow
    mat = 7.;
  }
  if (d < res.x) res = vec2(d, mat);
  return res;
}
vec3 nrmAt(vec3 p){ vec2 e = vec2(.002, 0.); return normalize(vec3(map(p + e.xyy).x - map(p - e.xyy).x, map(p + e.yxy).x - map(p - e.yxy).x, map(p + e.yyx).x - map(p - e.yyx).x)); }
float march(vec3 ro, vec3 rd, float tmax){
  float t = .02;
  for (int i=0;i<200;i++){ float d = map(ro + rd*t).x; if (d < .0006*t) return t; t += d*.8; if (t > tmax) break; }
  return -1.;
}
float softShadow(vec3 ro, vec3 rd, float tmax, float k){
  float res = 1., t = .03;
  for (int i=0;i<80;i++){ float h = map(ro + rd*t).x; res = min(res, k*h/t); t += clamp(h, .02, .5); if (res < .002 || t > tmax) break; }
  return clamp(res, 0., 1.);
}
float ao(vec3 p, vec3 n){ float o = 0., s = 1.; for (int i=1;i<=5;i++){ float h = .06*float(i); o += (h - map(p + n*h).x)*s; s *= .7; } return clamp(1. - o*2.2, 0., 1.); }
vec3 skyCol(vec3 rd){
  vec3 c = mix(vec3(.010, .016, .036), vec3(.004, .007, .02), clamp(rd.y*1.6, 0., 1.));
  c += vec3(.03, .04, .07)*pow(max(dot(rd, normalize(vec3(.55, .5, .3))), 0.), 6.);      // moon glow (moon off frame, upper left)
  vec2 sp = rd.xy/max(rd.z, .1)*300.;
  vec2 id = floor(sp); float s = h21(id);
  if (s > .985) { vec2 f = fract(sp) - .5 - (vec2(h21(id + 3.), h21(id + 7.)) - .5)*.6; c += vec3(.8, .85, 1.)*pow(h21(id + 11.), 6.)*exp(-dot(f, f)*60.)*2.5; }
  return c;
}
void main(){
  vec2 p = uv*2. - 1.;
  vec3 rd = normalize(uCF + uCR*p.x*uTan*uAsp + uCU*p.y*uTan);
  vec3 ro = uCP;
  float t = march(ro, rd, 60.);
  if (t < 0.) { oMoon = vec4(skyCol(rd), 1.); oFire = vec4(0.); oAux = vec4(0., 1e3, 1., 0.); return; }
  vec3 P = ro + rd*t; vec2 m = map(P); vec3 n = nrmAt(P);
  float mat = m.y;
  vec3 alb; float wet = 0., rough = .8;
  if (mat < 1.5) {                       // stone slabs, wet
    vec2 g = P.xz*vec2(1.6, 1.1); g.x += floor(g.y)*.5;
    vec2 f = abs(fract(g) - .5);
    float joint = smoothstep(.47, .5, max(f.x, f.y));
    float tone = .7 + .3*h21(floor(g));
    alb = vec3(.20, .21, .23)*tone*(1. - joint*.6)*(.8 + .4*fbm(P.xz*3.));
    float pud = smoothstep(.45, .62, fbm(P.xz*.45 + 3.)) ;
    wet = mix(.35, .95, pud)*(1. - joint*.5);
    alb *= 1. - wet*.45;
  } else if (mat < 2.5) {                // lime plaster, weathered
    vec2 wq = abs(n.x) > .5 ? P.zy : P.xy;
    alb = vec3(.55, .54, .52)*(.6 + .4*fbm(wq*vec2(1.5, 2.)))*(1. - .35*smoothstep(.5, .9, fbm(wq*vec2(.8, 4.) + 9.)));
    alb *= mix(.55, 1., smoothstep(0., .8, P.y));                 // splash grime at the foot
  } else if (mat < 3.5) {                // old timber: vertical planks
    float pq = abs(n.x) > .5 ? P.z : P.x;
    float pl = abs(fract(pq*5.5) - .5);
    alb = vec3(.17, .11, .07)*(.7 + .3*fbm(vec2(pq*30., P.y*1.2)))*(1. - .4*smoothstep(.44, .5, pl));
  } else if (mat < 4.5) { alb = vec3(.09, .09, .1)*(.8 + .3*fbm(P.xz*6.)); rough = .6;
  } else if (mat < 5.5) { alb = vec3(.35, .06, .04); rough = .5;
  } else if (mat < 6.5) { alb = vec3(.08, .06, .05);
  } else { alb = vec3(.08, .07, .06); }
  vec3 Lm = normalize(vec3(.5, .7, -.45));                     // moonlight from upper left, behind the camera
  float sh = softShadow(P + n*.01, Lm, 40., 10.);
  float occ = ao(P, n);
  vec3 moon = vec3(.22, .28, .46)*.42;
  vec3 col = alb*(moon*max(dot(n, Lm), 0.)*sh + vec3(.03, .04, .07)*(.5 + .5*n.y)*occ + vec3(.025, .03, .05)*occ);
  if (mat > 6.5 && mat < 7.5) col = vec3(.004, .005, .008);
  if (mat > 7.5) col = vec3(1., .5, .2)*.22*(.6 + .4*vn(P.xy*8.));          // somebody is still up
  // fire / wing response: irradiance from a unit point light where the painter works
  vec3 Lf = uFireP - P; float df = length(Lf); Lf /= df;
  float shf = softShadow(P + n*.01, Lf, df - .05, 14.);
  vec3 fire = alb*max(dot(n, Lf), 0.)*shf/(df*df + .3)*occ;
  if (mat < 1.5) fire += vec3(.05)*max(dot(n, Lf), 0.)*shf/(df*df + .3)*wet;      // a little sheen on wet stone
  oMoon = vec4(col, 1.);
  oFire = vec4(fire, 1.);
  oAux = vec4(mat < 1.5 ? wet : 0., dot(P - ro, uCF), 0., mat);
}`;

/* ---------------- light sources → segments ----------------
   ribbons (LED tube sweeps): quads between consecutive tube positions, energy spread over the swept area
   lines (pen light, steel wool, sparks): segments drawn with a fixed screen width and a gaussian profile */
const RIB = [];   // per vertex: pos(3) tau(1) col(3) e(1) v(1)  -> 9 floats, 6 verts per quad
const LIN = [];   // per segment: p0(3) p1(3) tau0 tau1 col(3) e w  -> 13 floats, 6 verts (corner id added in shader by gl_VertexID)
let EW = [], EF = [];   // energy timelines for the street illumination (wings, fire), 0.01 s bins
for (let i = 0; i <= 1000; i++) { EW.push(0); EF.push(0); }
const addE = (arr, tau, e) => { const k = Math.min(1000, Math.max(0, Math.round(tau * 100))); arr[k] += e; };
const mix3 = (a, b, s) => [a[0] + (b[0] - a[0]) * s, a[1] + (b[1] - a[1]) * s, a[2] + (b[2] - a[2]) * s];
function tubeSweep(t0, dur, piv, len, a0, a1, cA, cB, power, drift, seed = 0) {
  const N = Math.max(16, Math.round(dur * 320));
  const pos = (k) => {
    let u = k / N;
    u = clamp(u + 0.035 * Math.sin(2 * Math.PI * 3 * u + seed) * Math.sin(Math.PI * u));   // the hand never sweeps at an even speed
    const e = E.inOutSine(u);
    const a = lerp(a0, a1, e);
    const pv = [piv[0] + drift[0] * u, piv[1] + drift[1] * Math.sin(Math.PI * u), piv[2] + drift[2] * u];
    const d = [Math.cos(a), Math.sin(a), 0];
    const curl = 0.10 * Math.sin(Math.PI * u);                         // the wrist bends the tube along the arc
    return [pv, [pv[0] + d[0] * len - d[1] * curl * len * 0.3, pv[1] + d[1] * len + d[0] * curl * len * 0.3, pv[2]]];
  };
  let prev = pos(0);
  for (let k = 1; k <= N; k++) {
    const cur = pos(k), tau = t0 + (k / N) * dur;
    const dt = dur / N;
    // swept area of the quad (two triangles)
    const ar = (a, b, c) => 0.5 * Math.hypot(...crs([b[0] - a[0], b[1] - a[1], b[2] - a[2]], [c[0] - a[0], c[1] - a[1], c[2] - a[2]]));
    const area = ar(prev[0], prev[1], cur[1]) + ar(prev[0], cur[1], cur[0]) + 1e-4;
    const e = Math.min(power * dt / area, 12);
    const fade = 0.75 + 1.4 * Math.exp(-(k - 1) / 4) + 1.4 * Math.exp(-(N - k) / 4);   // the hand dwells at both ends: the straight edges burn brightest
    const V = [[prev[0], 0], [prev[1], 1], [cur[1], 1], [prev[0], 0], [cur[1], 1], [cur[0], 0]];
    for (const [p, v] of V) RIB.push(...p, tau, ...mix3(cA, cB, v), e * fade, v);
    addE(EW, tau, power * dt);
    prev = cur;
  }
}
function line(pts, taus, col, power, width, energyArr, eScale = 1) {
  for (let k = 1; k < pts.length; k++) {
    const p0 = pts[k - 1], p1 = pts[k];
    const L = Math.hypot(p1[0] - p0[0], p1[1] - p0[1], p1[2] - p0[2]) + 0.004;
    const dt = taus[k] - taus[k - 1];
    const c = typeof col === 'function' ? col(k / (pts.length - 1)) : col;
    const pw = typeof power === 'function' ? power(k / (pts.length - 1)) : power;
    LIN.push(...p0, ...p1, taus[k - 1], taus[k], ...c, Math.min(pw * dt / L, 30), width);
    if (energyArr) addE(energyArr, taus[k], pw * dt * eScale);
  }
}

/* 1. phoenix wings: fourteen LED-tube feathers, alternating sides on the sixteenths, fanning up from the shoulders */
function buildWings() {
  const sh = [0, 1.9, 5.75];
  const n = 7;
  // accelerando into the ignition: two on quarters, then eighths, the last two on sixteenths
  const T0 = [0.0, 0.5, 1.0, 1.25, 1.5, 1.75, 2.0, 2.25, 2.5, 2.75, 3.0, 3.25, 3.5, 3.625];
  const DUR = [0.4, 0.4, 0.22, 0.22, 0.22, 0.22, 0.22, 0.22, 0.22, 0.22, 0.22, 0.22, 0.12, 0.13];
  const Rw = Reel.rng(339);
  for (let i = 0; i < n; i++) {
    for (const side of [1, -1]) {          // world +x is screen left
      const k = i * 2 + (side > 0 ? 0 : 1);
      const u = i / (n - 1);
      const jit = (a) => 1 + (Rw() - 0.5) * 2 * a;
      const ang = (-24 + u * 84) * Math.PI / 180 * jit(0.06) + (side > 0 ? 0.02 : -0.03);
      const a0 = side > 0 ? ang : Math.PI - ang;
      const sweep = 0.16 * jit(0.25) * (side > 0 ? 1 : -1);
      const len = [1.85, 2.1, 2.2, 2.05, 1.8, 1.55, 1.3][i] * jit(0.06) * (side > 0 ? 1.0 : 0.96);
      const piv = [side * (0.2 + 0.12 * u) + (Rw() - 0.5) * 0.06, sh[1] + 0.32 * u + (Rw() - 0.5) * 0.05, sh[2] + 0.015 * k];
      const gold = [1.0, 0.55, 0.12], rose = [1.0, 0.12, 0.38], violet = [0.45, 0.2, 1.0], cyan = [0.1, 0.6, 1.0];
      const cA = gold, cB = u < 0.5 ? mix3(rose, violet, u * 2) : mix3(violet, cyan, (u - 0.5) * 2);
      tubeSweep(T0[k], DUR[k], piv, len, a0, a0 + sweep, cA, cB, 1.15 * (0.22 / DUR[k]) ** 0.35, [side * 0.06 + (Rw() - 0.5) * 0.05, 0.05, 0], Rw() * 6.28);
    }
  }
}

/* 2. steel wool: spinning whisk + spiral sparks that bounce off the paving */
const WOOL = { c: [0, 2.08, 5.6], r: 0.86, w: 2 * Math.PI * 2.6, t0: 4.0, t1: 6.6 };
const burn = (tau) => clamp((tau - WOOL.t0) / 0.25) * (1 - clamp((tau - (WOOL.t1 - 0.45)) / 0.45)) * (0.85 + 0.15 * Math.sin(tau * 23));
function woolPos(tau) {
  const a = WOOL.w * (tau - WOOL.t0) + 0.4;
  const yaw = 0.35 * Math.sin((tau - WOOL.t0) * 1.6);
  const x = Math.cos(a) * WOOL.r, y = Math.sin(a) * WOOL.r;
  return [WOOL.c[0] + x * Math.cos(yaw), WOOL.c[1] + y, WOOL.c[2] + x * Math.sin(yaw)];
}
function buildWool() {
  // the whisk's own glowing path
  const pts = [], taus = [];
  for (let tau = WOOL.t0; tau <= WOOL.t1; tau += 1 / 600) { pts.push(woolPos(tau)); taus.push(tau); }
  line(pts, taus, (u) => mix3([1, 0.55, 0.18], [1, 0.42, 0.1], u), (u) => 2.3 * burn(WOOL.t0 + u * (WOOL.t1 - WOOL.t0)), 4.2, EF, 0.5);
  // sparks
  const NS = 2000;
  for (let i = 0; i < NS; i++) {
    let tau = WOOL.t0 + R() * (WOOL.t1 - WOOL.t0);
    if (R() > burn(tau)) continue;
    const p = woolPos(tau), p2 = woolPos(tau + 0.001);
    const v = [(p2[0] - p[0]) / 0.001, (p2[1] - p[1]) / 0.001, (p2[2] - p[2]) / 0.001];
    const sp = 0.45 + R() * 0.55;
    let vel = [v[0] * sp + (R() - 0.5) * 2.5, v[1] * sp + (R() - 0.5) * 2.5, v[2] * sp + (R() - 0.5) * 7];
    let pos = p.slice();
    const life = 0.25 + Math.pow(R(), 1.6) * 1.4;
    const heat = 0.6 + R() * 0.8;
    const sp_pts = [pos.slice()], sp_t = [tau];
    const dt = 1 / 240;
    for (let a = 0; a < life; a += dt) {
      vel[1] -= 9.8 * dt;
      const drag = Math.exp(-1.2 * dt); vel = vel.map((c) => c * drag);
      pos = [pos[0] + vel[0] * dt, pos[1] + vel[1] * dt, pos[2] + vel[2] * dt];
      if (pos[1] < 0.005) { pos[1] = 0.005; vel[1] = -vel[1] * 0.38; vel[0] *= 0.7; vel[2] *= 0.7; }
      sp_pts.push(pos.slice()); sp_t.push(tau + a + dt);
      if (sp_pts.length > 400) break;
    }
    // thin the polyline for speed (keep every 3rd point)
    const P2 = [], T2 = [];
    for (let k = 0; k < sp_pts.length; k += 3) { P2.push(sp_pts[k]); T2.push(sp_t[k]); }
    if (P2.length < 2) continue;
    line(P2, T2, (u) => mix3([1, 0.75, 0.38], [1, 0.25, 0.05], Math.min(1, u * 1.3)), (u) => heat * 1.5 * Math.exp(-u * 2.8), 1.6, EF, 0.04);
  }
}

/* 3. the pen light draws the phoenix: neck and crested head, a faint covered move, then the long curling tail */
function catmull(P, nPer) {
  const out = [];
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
    for (let k = 0; k < nPer; k++) {
      const u = k / nPer, u2 = u * u, u3 = u2 * u;
      out.push([0, 1].map((j) => 0.5 * ((2 * p1[j]) + (-p0[j] + p2[j]) * u + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * u2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * u3)));
    }
  }
  out.push(P[P.length - 1].slice());
  return out;
}
function penStroke(P, t0, t1, col, power, width, z) {
  const pts = catmull(P, 24);
  // arc length -> time, slower through the tight turns
  const seg = [0];
  for (let i = 1; i < pts.length; i++) {
    const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    let turn = 0;

      .set('uTrail', { tex: trailT.tex, unit: 3 }).set('uRefl', { tex: reflT.tex, unit: 5 }).set('uRes', [W, H])
      .set('uExpo', (0.6 + 0.5 * clamp(t / 10)) * dip).set('uEW', eW).set('uEF', eF).set('uGhost', ghost)
      .set('uWC', [0.9, 0.45, 0.7]).set('uFC', [1.0, 0.45, 0.14])
      .set('uCP', CAM.p).set('uCF', CB.f).set('uCR', CB.r).set('uCU', CB.u).set('uTan', Math.tan(fy / 2)).set('uAsp', W / H).set('uDbg', DBG)
      .draw(sceneT);
    brightP.use().set('s', { tex: sceneT.tex, unit: 0 }).set('px', [1 / W, 1 / H]).set('th', 0.9).draw(BA);
    blurP.use().set('s', { tex: BA.tex, unit: 0 }).set('dir', [1 / dw, 0]).draw(BB);
    blurP.use().set('s', { tex: BB.tex, unit: 0 }).set('dir', [0, 1 / dh]).draw(BA);
    blurP.use().set('s', { tex: BA.tex, unit: 0 }).set('dir', [2 / dw, 0]).draw(BB2);
    blurP.use().set('s', { tex: BB2.tex, unit: 0 }).set('dir', [0, 2 / dh]).draw(BA2);
    blurP.use().set('s', { tex: BA2.tex, unit: 0 }).set('dir', [3 / dw, 0]).draw(BB2);
    blurP.use().set('s', { tex: BB2.tex, unit: 0 }).set('dir', [0, 3 / dh]).draw(BA2);
    finalP.use().set('s', { tex: sceneT.tex, unit: 0 }).set('b1', { tex: BA.tex, unit: 1 }).set('b2', { tex: BA2.tex, unit: 2 })
      .set('frame', Math.floor(t * 30)).set('res', [W, H]).set('dip', dip).draw(null);
    gl.finish();
  },
});
