<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>31 建筑投影秀 · Projection Mapping</title>
<script src="../../lib/core.js"></script><script src="../../lib/gl.js"></script><script src="../../lib/rm.js"></script><script src="../../lib/track.js"></script>
</head><body><div id="stage"></div>
<script>
/* ===== 31 建筑投影秀 · PROJECTION MAPPING =====
   A night square. A neoclassical facade (of our own design: portico of six columns, pediment, two arcaded
   wings) is the screen. Projectors on a tower behind the crowd paint it: a scan line draws the architecture,
   colour fills land on the beat, the wall breaks into blocks that push in and out, the columns run with water,
   windows light up on the eighths; at the hook the whole wall leans out over the audience (a black gap opens
   under the cornice, the base cracks and sheds dust), crumbles toward the crowd, and slams back. A two-colour
   section chases light along the mouldings; the finale crowns the building bay by bay on the eighths — wings,
   portico, pediment — and a run of light climbs the architecture into a projected sun emblem.
   Everything is lit BY the projector: the content is computed in projector space, so it bends over the relief,
   the columns throw projector shadows, beams show in the haze, and the crowd + raised phones sit in front, out of focus. */
const { E, clamp, inv, lerp } = Reel;
// ★ 改光色改这里：着色器里的 LIGHT_COL（搜 LIGHT_COL）。它乘在整场投影机的光（墙面、雾里的光柱、湿地面倒影、人群轮廓光、手机屏）上。
//   vec3(1.) = 原样（和成片一模一样）；更暖例如 vec3(1.1, .95, .8)；想换某一段画面的颜色，改 content() 里那一段的色值。只想换物体/纸/颜料的颜色是“配色”，不是光，见 SKILL 的对照表。
const stage = Reel.makeStage('#020208');
Reel.ownJitter = true;

const TXW = 2048, TXH = 1024;     // title texture: facade elevation u in [-24,24], v in [0,24]

const rm = Reel.RM(stage, {
  bloom: 0.55, th: 0.9, expo: 1.0, vig: 0.4, grain: 0.035, ca: 0.6, contrast: 1.05, sat: 1.08, bands: 8,
  uniforms: `
uniform sampler2D uTx;
uniform vec3 uRo, uTa; uniform float uF, uRoll;
uniform float uT, uTilt, uVoid, uFlash, uDbg, uGap, uCrack;
uniform vec3 uPj;`,
  scene: `
// ---------------- the building (metres; front wall plane z = 0, building extends to +z; camera at -z) ----------------
const float CZ = -3.;                       // column centre line
float sdBox2(vec2 p, vec2 b){ vec2 q = abs(p) - b; return length(max(q, 0.)) + min(max(q.x, q.y), 0.); }
float colR(float y){ return mix(.78, .64, clamp((y - 1.6)/12.6, 0., 1.)); }
// material: 0 limestone wall, 1 column, 2 window glass/void, 3 ground, 4 dark door
vec2 bld(vec3 p){
  float d = 1e3, m = 0.;
  // main mass
  float wall = sdBox(p - vec3(0., 8.5, 10.), vec3(24., 8.5, 10.));
  // windows on the wings (arched, recessed), two floors
  float ax = abs(p.x);
  float wx = ax - (11.6 + 4.*clamp(floor((ax - 9.6)/4.), 0., 2.));
  if (ax > 9.6 && ax < 22.) {
    vec2 q = vec2(wx, p.y - 5.);
    float arch = min(sdBox2(q - vec2(0., -.6), vec2(1., 1.9)), length(q - vec2(0., 1.3)) - 1.);
    float win1 = max(arch, abs(p.z - .25) - .5);
    float win2 = sdBox(vec3(wx, p.y - 11.6, p.z - .25), vec3(.95, 1.5, .5));
    wall = max(wall, -min(win1, win2));
  }
  // portico recess + central door
  if (ax < 9.) {
    float door = max(min(sdBox2(vec2(p.x, p.y - 4.2), vec2(1.6, 2.6)), length(vec2(p.x, p.y - 6.8) ) - 1.6), abs(p.z - .3) - .6);
    float pw = sdBox(vec3(abs(p.x) - 5.2, p.y - 6.2, p.z - .2), vec3(.9, 1.7, .45));
    wall = max(wall, -min(door, pw));
  }
  d = wall;
  // pilasters + string course + plinth on the wings
  float pil = sdBox(vec3(ax - (9.6 + 4.*clamp(floor((ax - 7.6)/4.), 0., 3.)), p.y - 8.2, p.z + .12), vec3(.42, 6.6, .14));
  pil = ax > 9.2 ? pil : 1e3;
  float sc = sdBox(vec3(p.x, p.y - 8.9, p.z + .15), vec3(24., .28, .17));
  float plinth = sdBox(vec3(p.x, p.y - .8, p.z + .25), vec3(24.2, .8, .27));
  d = min(d, min(pil, min(sc, plinth)));
  // entablature across the whole front, deeper over the portico
  float porti = ax < 9.4 ? 1. : 0.;
  float zf = porti > .5 ? -3.8 : -.2;
  float arch_ = sdBox(vec3(p.x, p.y - 14.6, p.z - (zf + .25 + 10.)*.0 - (zf*.5 + .1)), vec3(porti > .5 ? 9.4 : 24., .4, abs(zf*.5) + .25));
  float frieze = sdBox(vec3(p.x, p.y - 15.6, p.z - zf*.5 - .1), vec3(porti > .5 ? 9.4 : 24., .6, abs(zf*.5) + .1));
  float corn = sdBox(vec3(p.x, p.y - 16.6, p.z - zf*.5 + .3), vec3(porti > .5 ? 9.8 : 24.4, .4 - max(0., (p.z - zf*.5 + .3))*.0, abs(zf*.5) + .6));
  d = min(d, min(arch_, min(frieze, corn)));
  // pediment
  vec2 pq = vec2(ax, p.y - 17.);
  float tri = max(max(-pq.y, pq.y - 5.5 + ax*(5.5/9.6)), abs(p.z + 3.3) - .5);
  float trirec = max(max(-(pq.y - .55), pq.y - 4.7 + ax*(4.7/8.4)), abs(p.z + 3.6) - .25);
  d = min(d, max(tri, -trirec));
  // balustrade on the wing roofs
  float bal = sdBox(vec3(p.x, p.y - 17.6, p.z + .1), vec3(24., .6, .2));
  float bars = abs(fract(p.x*2.2) - .5) - .3;
  bal = max(bal, -max(bars, abs(p.y - 17.55) - .38));
  if (ax > 9.8) d = min(d, bal);
  // steps in front of the portico
  float st = 1e3;
  for (int i=0;i<5;i++){ float fi = float(i); float fr = -6.1 + fi*.42; st = min(st, sdBox(vec3(p.x, p.y - (fi + 1.)*.16, p.z - (fr - 2.)*.5), vec3(9.6 + (4. - fi)*.15, (fi + 1.)*.16, (-2. - fr)*.5))); }
  st = min(st, sdBox(vec3(p.x, p.y - .8, p.z + 2.3), vec3(9.6, .8, 2.)));
  d = min(d, st);
  // columns: fluted shafts with bases and capitals
  float cx = (floor((p.x + 9.6)/3.2) )*3.2 - 9.6 + 1.6;
  cx = clamp(cx, -8., 8.);
  vec3 cp = p - vec3(cx, 0., CZ);
  float r = colR(p.y);
  float ang = atan(cp.z, cp.x);
  float flute = .035*smoothstep(.2, .9, abs(sin(ang*12.)));
  float shaft = max(length(cp.xz) - r + flute, max(1.6 - p.y, p.y - 14.2));
  float base = max(length(cp.xz) - .98, abs(p.y - 1.85) - .25);
  float cap = max(length(cp.xz) - .92, abs(p.y - 13.95) - .25);
  float abac = sdBox(cp - vec3(0., 14.1, 0.), vec3(.98, .12, .98));
  float col = min(min(shaft, base), min(cap, abac));
  if (col < d) { d = col; m = 1.; }
  return vec2(d, m);
}
vec2 map(vec3 p){
  vec2 b = bld(p);
  float g = p.y;
  if (g < b.x) return vec2(g, 3.);
  return b;
}
vec3 nrmB(vec3 p){ vec2 e = vec2(.004, 0.); return normalize(vec3(map(p + e.xyy).x - map(p - e.xyy).x, map(p + e.yxy).x - map(p - e.yxy).x, map(p + e.yyx).x - map(p - e.yyx).x)); }

// ---------------- the show: content in projector image space (u,v = point on the wall plane seen from the projector) ----------------
float h21(vec2 p){ return hash12(p); }
float E_outCubic(float x){ return 1. - pow(1. - x, 3.); }
// architectural line drawing of the elevation: distance to the nearest edge + region id
vec2 elev(vec2 q){
  float u = q.x, v = q.y, au = abs(u);
  float d = 1e3, id = 0.;
  // wing windows
  if (au > 9.6 && au < 22.) {
    float wx = au - (11.6 + 4.*clamp(floor((au - 9.6)/4.), 0., 2.));
    vec2 w = vec2(wx, v - 5.);
    float a1 = min(sdBox2(w - vec2(0., -.6), vec2(1., 1.9)), length(w - vec2(0., 1.3)) - 1.);
    float a2 = sdBox2(vec2(wx, v - 11.6), vec2(.95, 1.5));
    d = min(d, min(abs(a1), abs(a2)));
    if (min(a1, a2) < 0.) id = 1.;
    float pil = abs(abs(au - (9.6 + 4.*clamp(floor((au - 7.6)/4.), 0., 3.))) - .42);
    if (v > 1.6 && v < 14.2) d = min(d, pil);
  }
  // horizontal courses
  d = min(d, min(abs(v - 1.6), abs(v - 8.62)));
  d = min(d, min(abs(v - 9.18), abs(v - 14.2)));
  d = min(d, min(abs(v - 15.), abs(v - 16.2)));
  d = min(d, abs(v - 17.));
  if (v > 14.2 && v < 17.) id = 3.;
  if (v < 1.6) id = 5.;
  // columns (projector space: they stand 3 m in front, so they read 6% wider)
  float k = 48./45.;
  float cx = clamp(floor((u/k + 9.6)/3.2)*3.2 - 9.6 + 1.6, -8., 8.)*k;
  float cr = mix(.78, .64, clamp((v - 1.6)/12.6, 0., 1.))*k;
  float cd = abs(u - cx) - cr;
  if (v > 1.6 && v < 14.2) { d = min(d, abs(cd)); if (cd < 0.) id = 2.; }
  // door
  if (au < 9.) {
    float door = min(sdBox2(vec2(u, v - 4.2), vec2(1.6, 2.6)), length(vec2(u, v - 6.8)) - 1.6);
    if (cd > 0. || v < 1.6) { d = min(d, abs(door)); if (door < 0.) id = 6.; }
  }
  // pediment
  if (v > 17. && au < 9.8) { float tri = max(-(v - 17.), v - 17. - 5.5 + au*(5.5/9.6)); d = min(d, abs(tri)); d = min(d, abs(max(-(v - 17.55), v - 17. - 4.7 + au*(4.7/8.4)))); if (tri < 0.) id = 4.; }
  if (au > 24.) d = 1e3;
  return vec2(d, id);
}
vec3 hsv(float h, float s, float v){ vec3 c = clamp(abs(mod(h*6. + vec3(0., 4., 2.), 6.) - 3.) - 1., 0., 1.); return v*mix(vec3(1.), c, s); }
float beatPulse(float t, float rate){ return exp(-fract(t*rate)*6.); }
const vec3 LIGHT_COL = vec3(1.);   // light colour, vec3(1.) = as delivered (see the Chinese note at the top of the script)
vec3 content(vec2 q, float lod){
  float t = uT;
  vec3 c = vec3(0.);
  vec2 e = elev(q);
  float line = 1. - smoothstep(.0, .06 + lod*.2, e.x);
  float glowL = exp(-e.x*3.)*.25;
  float u = q.x, v = q.y;
  // 1. scan line draws the architecture (0 - 1.2 s)
  float scanV = mix(-1., 24., E_outCubic(clamp(t/1.15, 0., 1.)));
  if (t < 2.) {
    float drawn = step(v, scanV);
    c += vec3(.85, .92, 1.)*line*drawn*1.4 + vec3(.3, .5, 1.)*glowL*drawn;
    c += vec3(.6, .8, 1.)*exp(-abs(v - scanV)*3.)*1.6*step(t, 1.25);
    // colour fills on the beats 1.0 and 1.5
    float f1 = smoothstep(.98, 1.02, t)*(1. - smoothstep(1.4, 1.5, t)), f2 = smoothstep(1.48, 1.52, t);
    if (e.y == 2.) c += vec3(.9, .2, .5)*f1*.8;
    if (e.y == 1. || e.y == 6.) c += vec3(.1, .7, 1.)*(f1 + f2)*.9;
    if (e.y == 3. || e.y == 4.) c += vec3(1., .65, .1)*f2*.9;
    c *= 1. - smoothstep(1.85, 2., t)*.6;
  }
  // 2. blocks push in and out, columns run with water, windows light one by one (2 - 4 s)
  if (t >= 1.85 && t < 4.15) {
    float w = smoothstep(1.85, 2.05, t)*(1. - smoothstep(3.95, 4.15, t));
    vec2 cell = floor(q/vec2(1.8, 1.5));
    vec2 fq = fract(q/vec2(1.8, 1.5));
    float ph = h21(cell);
    float beat = floor((t - 2.)*2.);
    float kb = clamp((t - 2. - beat*.5)/.12, 0., 1.);
    kb = 1. + 2.7*pow(kb - 1., 3.) + 1.7*pow(kb - 1., 2.);          // out-back: push past and settle, every beat
    float dep = mix(sin((beat - 1.)*1.7 + ph*6.28), sin(beat*1.7 + ph*6.28), kb)*.5 + .5;
    float push = dep*(.6 + .4*sin(cell.x*.7 + t*3.));
    // fake extrusion: lit top/left bevel, shadowed bottom/right, dark gaps
    float bev = .12*push + .02;
    float lit = smoothstep(bev, 0., fq.y) - smoothstep(1. - bev, 1., fq.x);
    float gap = smoothstep(.0, .025, fq.x)*smoothstep(.0, .025, fq.y)*smoothstep(1., .975, fq.x)*smoothstep(1., .975, fq.y);
    vec3 base = mix(vec3(.10, .12, .22), vec3(.30, .34, .55), push);
    vec3 blk = base*(1. + lit*.9)*gap;
    blk += vec3(.7, .8, 1.)*line*.6;
    if (e.y == 2.) {                              // water down the columns
      float fl = fbm2(vec2(u*3., v*.5 + t*3.2)) ;
      float st = pow(abs(sin(u*9. + fl*6.)), 18.);
      blk = vec3(.05, .25, .6)*(.6 + .8*fl) + vec3(.6, .9, 1.)*st*.9 + vec3(.8, .95, 1.)*pow(fbm2(vec2(u*8., v*1.5 + t*6.)), 3.)*1.6;
    }
    if (e.y == 1.) {                              // windows: one per beat
      float wid = floor(u/4.) + floor(v/6.)*7.;
      float t0w = 2. + .25*floor(h21(vec2(wid, 3.))*8.);            // every window lands on an eighth note
      float on = smoothstep(t0w, t0w + .08, t)*(1. + .3*exp(-max(t - t0w - .08, 0.)*10.)*step(t0w + .08, t));
      blk = mix(vec3(.02, .02, .05), vec3(1., .72, .35)*1.6, on);
    }
    c = mix(c, blk, w);
  }
  // 3. HOOK: the wall leans out over the audience, cracks, drops into black, slams back (4 - 5.5 s)
  if (t >= 3.95 && t < 5.7) {
    vec3 E3 = uRo;                                // the illusion is drawn for the audience's eye
    float th = uTilt;
    vec3 P = vec3(u, v, 0.);
    vec3 dir = P - E3;
    // tilted plane hinged at the base: points (x, s cos th, -s sin th)
    float tn = tan(th);
    float lam = -(E3.z + tn*E3.y)/(dir.z + tn*dir.y);
    vec3 R = E3 + dir*lam;
    float s = R.y/max(cos(th), .01);
    vec2 tq = vec2(R.x, s);
    vec3 img = vec3(0.); float cover = 0.;
    // ashlar courses: 1.25 m high, 2.5 m blocks, alternate courses offset; after 4.5 s each block drops on its own beat
    const float BH = 1.25, BWd = 2.5;
    float row0 = floor(s/BH);
    for (int k=8;k>=0;k--){
      float r = row0 + float(k);
      if (r < 0. || r > 18.) continue;
      float off = mod(r, 2.)*BWd*.5;
      float bi = floor((tq.x + off)/BWd);
      float td = 4.48 + .3*h21(vec2(bi, r)) + .022*(18. - r);
      float ft = max(0., t - td);
      float dy = 30.*ft*ft;                             // falls (in the leaning wall's own plane)
      float rot = ft*ft*(h21(vec2(r, bi)) - .5)*2.2;
      float grow = 1. + .6*clamp(ft/.55, 0., 1.);       // and tips out toward the audience: it grows as it comes
      vec2 lc = vec2(tq.x + off - (bi + .5)*BWd, s + dy - (r + .5)*BH)/grow;
      float cs = cos(rot), sn = sin(rot); lc = mat2(cs, -sn, sn, cs)*lc;
      if (abs(lc.x) < BWd*.5 && abs(lc.y) < BH*.5) {
        vec2 sq = vec2((bi + .5)*BWd - off, (r + .5)*BH) + lc;     // the original spot on the wall this pixel shows
        vec2 e2 = elev(sq);
        float l2 = 1. - smoothstep(0., .07, e2.x);
        vec3 stone = vec3(.42, .40, .38)*(.85 + .2*fbm2(sq*.6));
        if (e2.y == 1. || e2.y == 6.) stone *= .25;
        if (e2.y == 2.) stone *= 1.12;
        stone *= .95 - 1.25*sin(th)*smoothstep(0., 20., s);          // the face turns down, away from the light: 40-50 % darker at the top
        float joint = smoothstep(BWd*.5 - .05, BWd*.5 - .01, abs(lc.x)) + smoothstep(BH*.5 - .05, BH*.5 - .01, abs(lc.y));
        stone *= 1. - .6*clamp(joint, 0., 1.)*smoothstep(4.3, 4.6, t);
        stone *= 1. - .5*clamp(ft*2., 0., 1.);
        img = stone + vec3(.9, .95, 1.)*l2*.22 + vec3(.6, .8, 1.)*clamp(joint, 0., 1.)*exp(-ft*6.)*step(.001, ft)*.8;
        cover = 1.;
        break;
      }
    }
    if (!(lam > 0. && s > -1. && s < 24.)) cover = 0.;
    // the wall has come away from the cornice: a black gap opens under it, and thin black slits at the sides
    float gapW = uGap*2.6;
    if (v > 14.2 - gapW && v < 14.25) cover = 0.;
    if (abs(u) > 24. - uGap*1.1 && v < 14.2) cover = 0.;
    // the base cracks: a hot line along the plinth, and dust pouring off it
    float crack = uCrack*exp(-abs(v - 1.62 - .06*sin(u*2.3) - .04*sin(u*7.1))*14.);
    img += vec3(1., .9, .75)*crack*1.8;
    float dust = uCrack*smoothstep(.55, .9, fbm2(vec2(u*1.6, v*.9 + t*7.)))*smoothstep(1.6, .6, v)*smoothstep(-.4, .5, v);
    img += vec3(.6, .58, .55)*dust*.6;
    // what is behind the wall: black, with a cold rim
    vec3 voidC = vec3(.004, .006, .015);
    float a = smoothstep(3.95, 4.05, t)*(1. - smoothstep(5.48, 5.56, t));
    c = mix(c, mix(voidC, img, cover), a);
  }
  // flash on the slam back
  c += vec3(.9, .95, 1.)*uFlash*(.4 + line);
  // 4. two colours swap every bar; light chases along the mouldings on the eighths; columns fill on every kick (5.5 - 7.6 s)
  if (t >= 5.5 && t < 8.) {
    float w = smoothstep(5.5, 5.6, t)*(1. - smoothstep(7.35, 7.6, t));
    float bar = floor((t - 5.5 + 1.5)/2.);
    vec3 cA = vec3(1., .12, .55), cB = vec3(.1, .75, 1.);
    vec3 k1 = mod(bar, 2.) < .5 ? cA : cB, k2 = mod(bar, 2.) < .5 ? cB : cA;
    float e8 = floor((t - 5.5)*4.);
    float chase = fract((abs(u)*.09 + v*.11) - e8*.125);
    float dash = smoothstep(.0, .05, chase)*smoothstep(.22, .12, chase);
    vec3 cc = k2*.06 + k1*line*(.35 + 2.2*dash);
    float kick = fract((t - 5.5)*2.);
    if (e.y == 2.) { float fill = 1.6 + 12.6*E_outCubic(clamp(kick/.35, 0., 1.)); cc = k2*(.15 + 1.4*step(v, fill)*exp(-kick*2.5)) + k1*line; }
    if (e.y == 1. || e.y == 6.) cc = k1*.05;
    c = mix(c, cc, w);
  }
  // 5. finale (7.35 s ->): deep blue wash; wings, portico and pediment light up on the eighths; a run of light climbs into the emblem
  if (t >= 7.35) {
    float w = smoothstep(7.35, 7.5, t);
    vec2 tuv = vec2((24. - u)/48., v/24.);
    vec4 tx = texture(uTx, tuv);
    float au = abs(u);
    float tb = u > 9.4 ? 7.5 : (u < -9.4 ? 7.75 : (v < 16.9 ? 8.0 : 8.25));   // left wing, right wing, portico, pediment
    float onb = smoothstep(tb, tb + .06, t);
    float hitb = exp(-max(t - tb, 0.)*7.)*step(tb, t);
    vec3 bg = mix(vec3(.02, .04, .12), vec3(.05, .09, .28), smoothstep(0., 20., v))*.9;
    vec3 gold = vec3(1., .74, .36);
    vec3 cc = bg + vec3(.45, .6, 1.)*line*(.25 + .55*onb + 1.2*hitb);
    cc += gold*tx.g*onb*(1.3 + 1.5*hitb)*(lod < 1.5 ? 1. : .5);                // key-fret band on the frieze
    // the run of light: from the ground up every line of the building, into the emblem (8.5 -> 8.85)
    float vf = mix(-1., 23., clamp((t - 8.5)/.35, 0., 1.));
    float run = exp(-abs(v - vf)*1.6)*step(8.5, t)*(1. - smoothstep(8.85, 9.2, t));
    cc += vec3(1., .95, .85)*line*run*2.4;
    float em = smoothstep(8.25, 8.31, t)*(1. + 1.4*exp(-max(t - 8.25, 0.)*8.) + 1.8*exp(-max(t - 8.8, 0.)*6.)*step(8.8, t));
    cc += gold*tx.r*em*1.9*(lod < 1.5 ? 1. : .6);                                // the sun emblem in the pediment
    c = mix(c, cc, w);
  }
  return c*LIGHT_COL;
}

// ---------------- rendering ----------------
vec3 projLight(vec3 P, vec3 n, out float facing){
  // projector space: ray from the projector through P, onto the wall plane z = 0
  vec3 d = P - uPj;
  vec2 q = (uPj + d*(-uPj.z/d.z)).xy;
  vec3 L = normalize(uPj - P);
  facing = max(dot(n, L), 0.);
  float dist = length(P - uPj);
  return content(q, 0.)*(48.*48.)/(dist*dist);
}
float projShadow(vec3 P, vec3 n){
  vec3 L = uPj - P; float tm = length(L); L /= tm;
  float t = .05;
  for (int i=0;i<60;i++){ float h = bld(P + n*.02 + L*t).x; if (h < .002) return 0.; t += max(h, .05); if (t > 12.) break; }
  return 1.;
}
vec3 sky(vec3 rd){
  vec3 c = mix(vec3(.05, .035, .06), vec3(.008, .01, .03), smoothstep(-.05, .4, rd.y));
  return c;
}
// crowd: rows of heads & shoulders, some phones held up (screens glowing with the show)
