<html lang="zh"><head><meta charset="utf-8"><title>30 皮影戏 · Shadow Puppetry</title>
<script src="../../lib/core.js"></script>
<script src="../../lib/track.js"></script>
</head><body><div id="stage"></div>
<script>
/* ===== 30 皮影戏 · SHADOW PUPPETRY =====
   An oil lamp behind a gauze screen. Cow-hide puppets (a mounted general, a tiger) are drawn as dyed, carved
   transmission sprites: double outline with a carved slit, openwork dots/scales/slits, mottled hide. Every puppet is a
   rig of jointed parts on rods. The screen image is physical: light x the product of each puppet's transmission,
   magnified about the lamp and blurred by the penumbra for its distance from the gauze, so a figure pressed to the
   screen is crisp and coloured and one pulled back toward the lamp becomes a huge soft dark shadow.
   The camera pulls back to a lacquered stage; the lanterns light the gilded plaque with the title. */
const { E, clamp, lerp, inv } = Reel;
// ★ 改光色改这里：着色器里的 LIGHT_COL（搜 LIGHT_COL）。它乘在幕后油灯（幕布，以及镜头拉开后照到戏台、烟雾的溢光）上。
//   vec3(1.) = 原样（和成片一模一样）；偏冷例如 vec3(.75, .9, 1.3)（皮影是透光的彩色滤片，光太蓝时红黄皮影会发黑）；6.45 秒后的两盏灯笼是另一束光。只想换物体/纸/颜料的颜色是“配色”，不是光，见 SKILL 的对照表。
const stage = Reel.makeStage('#030203');
Reel.ownJitter = true;
const C = Reel.cfg({});
const RS = Reel.RS, OW = Math.round(1920 * RS), OH = Math.round(1080 * RS);
const SW = 160, SH = 90;                       // screen size (cm)
const SCW = Math.round(1920 * RS), SCH = Math.round(1080 * RS);  // screen texture (12 px/cm at rs 1)
const LAMP = [0, -8], LD = 80, LR = 1.7;       // lamp position on screen plane, distance behind the screen, flame+reflector radius (cm)
const hsh = Reel.hash, n1 = Reel.noise1;

/* ------------------------------------------------------------------ GL */
const cv = document.createElement('canvas'); cv.width = OW; cv.height = OH;
cv.style.cssText = 'position:absolute;left:0;top:0;width:1920px;height:1080px'; stage.appendChild(cv);
const gl = cv.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true, alpha: false });
gl.getExtension('EXT_color_buffer_float'); gl.getExtension('OES_texture_float_linear');
function shd(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { const e = gl.getShaderInfoLog(s); console.error(e + '\n' + src.split('\n').map((l, i) => (i + 1) + ': ' + l).join('\n')); throw new Error(e); } return s; }
function prog(vs, fs) { const p = gl.createProgram(); gl.attachShader(p, shd(gl.VERTEX_SHADER, vs)); gl.attachShader(p, shd(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); const L = {}; p.loc = (n) => (n in L ? L[n] : (L[n] = gl.getUniformLocation(p, n))); return p; }
function U(p, n, v) { const l = p.loc(n); if (l === null) return; if (typeof v === 'number') gl.uniform1f(l, v); else if (v.length === 2) gl.uniform2fv(l, v); else if (v.length === 3) gl.uniform3fv(l, v); else if (v.length === 4) gl.uniform4fv(l, v); else if (v.length === 6) gl.uniform3fv(l, v); }
function tex2(w, h, ifmt, fmt, type, filt) { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t); gl.texImage2D(gl.TEXTURE_2D, 0, ifmt, w, h, 0, fmt, type, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filt); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; }
function target(w, h, fl) { const t = tex2(w, h, fl ? gl.RGBA16F : gl.RGBA8, gl.RGBA, fl ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, gl.LINEAR); const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0); return { t, f, w, h }; }
const bindTex = (p, n, t, unit) => { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t); const l = p.loc(n); if (l !== null) gl.uniform1i(l, unit); };
function texFromCanvas(c, mip) { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t); gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c); if (mip) gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mip ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; }
// per puppet layer: full res + blur pyramid
const LAYERS = [0, 1, 2, 3, 4, 5].map(() => ({ L0: target(SCW, SCH), F: target(SCW, SCH), lv: [1, 2, 3, 4, 5].map((k) => ({ A: target(Math.ceil(SCW / 2 ** k), Math.ceil(SCH / 2 ** k)), B: target(Math.ceil(SCW / 2 ** k), Math.ceil(SCH / 2 ** k)) })) }));
const SCR = target(SCW, SCH, true);
const vaoFS = gl.createVertexArray(); gl.bindVertexArray(vaoFS);
{ const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0); }
const vaoQ = gl.createVertexArray(); gl.bindVertexArray(vaoQ);
{ const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0); }
const VSFS = `#version 300 es
layout(location=0) in vec2 p; out vec2 vUV; void main(){ vUV = p*.5+.5; gl_Position = vec4(p,0.,1.); }`;
// a part: textured quad, corners in local cm, affine (a,b,c,d,e,f), output = transmission (multiplied into the layer)
const pPart = prog(`#version 300 es
layout(location=0) in vec2 q; uniform vec4 uRect; uniform vec4 uUV; uniform vec3 uM0, uM1; uniform vec2 uHalf; out vec2 vT;
void main(){ vec2 l = mix(uRect.xy, uRect.zw, q); vec2 w = vec2(uM0.x*l.x + uM0.y*l.y + uM0.z, uM1.x*l.x + uM1.y*l.y + uM1.z);
  vT = mix(uUV.xy, uUV.zw, q); gl_Position = vec4(w/uHalf, 0., 1.); }`, `#version 300 es
precision highp float; in vec2 vT; out vec4 o; uniform sampler2D uAt; uniform float uDim, uScat; uniform vec2 uAtPx;
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(hash12(i),hash12(i+vec2(1,0)),f.x), mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ float a=.5,s=0.; for(int i=0;i<4;i++){ s+=a*vnoise(p); p=mat2(.8,.6,-.6,.8)*p*2.03+vec2(3.1,1.7); a*=.5; } return s; }
void main(){
  vec4 c = texture(uAt, vT);
  if (c.a < .003) { o = vec4(1.); return; }
  // the knife-cut face of the leather (outline and every carved hole) reads a little darker and crisp
  float amin = 1.;
  for (int k=0;k<8;k++){ float a = float(k)*.785; amin = min(amin, texture(uAt, vT + vec2(cos(a), sin(a))*uAtPx*2.1).a); }
  float rim = c.a*(1. - amin);
  vec2 q = vT/uAtPx;                                         // atlas pixels, 18 per cm
  // cow hide: thickness mottling + fibre bundles; thicker leather deepens the dye (light passes through it)
  float fib = vnoise(mat2(.94,.34,-.34,.94)*q*vec2(.05,.55)) + vnoise(mat2(.5,-.87,.87,.5)*q*vec2(.045,.5)) - 1.;
  float th = .52 + 1.0*fbm(q*.014) + .42*fib + .12*vnoise(q*.35);
  vec3 base = max(pow(c.rgb, vec3(2.2)), vec3(.0015));
  float take = smoothstep(.25, .8, fbm(q*.009 + 11.)) * (.6 + .4*vnoise(mat2(.8,.6,-.6,.8)*q*vec2(.012,.09)));
  base = mix(base, vec3(.78,.42,.12)*max(max(base.r, base.g), base.b), .32*take*step(.02, max(base.r, max(base.g, base.b))));
  vec3 tr = pow(base, vec3(th))*(1. - .55*rim);
  tr *= .95*uDim*uScat;
  o = vec4(mix(vec3(1.), tr, c.a), 1.);
}`);
// a bamboo control rod: its node rings, a crisp core near the puppet and a penumbra growing toward the puppeteer
const pRod = prog(`#version 300 es
layout(location=0) in vec2 q; uniform vec2 uA, uB; uniform float uW; uniform vec2 uHalf; out vec2 vQ;
void main(){ vec2 d = normalize(uB - uA), n = vec2(-d.y, d.x); vec2 w = mix(uA, uB, q.x) + n*(q.y*2. - 1.)*uW*(1. + q.x*4.); vQ = vec2(q.x, q.y*2. - 1.); gl_Position = vec4(w/uHalf, 0., 1.); }`, `#version 300 es
precision highp float; in vec2 vQ; out vec4 o; uniform float uW, uLen;
void main(){ float L = vQ.x; float sc = L*uLen; float f = (fract(sc/11. + .37) - .5)*11.; float node = exp(-f*f/.18);
  float core = (1. + .35*node)*(1. + L*1.6)/(1. + L*4.), soft = .1 + L*1.15;
  float a = 1. - smoothstep(core - soft*core, core + soft*.5, abs(vQ.y));
  a = max(a*mix(.96, .4, L), .2*L*(1. - smoothstep(0., 1., abs(vQ.y))));
  o = vec4(mix(vec3(1.), vec3(.035,.025,.015), a), 1.); }`);
const pDown = prog(VSFS, `#version 300 es
precision highp float; in vec2 vUV; out vec4 o; uniform sampler2D uS; uniform vec2 uPx;
void main(){ o = (texture(uS, vUV + uPx*vec2(-.5,-.5)) + texture(uS, vUV + uPx*vec2(.5,-.5)) + texture(uS, vUV + uPx*vec2(-.5,.5)) + texture(uS, vUV + uPx*vec2(.5,.5)))*.25; }`);
const pGauss = prog(VSFS, `#version 300 es
precision highp float; in vec2 vUV; out vec4 o; uniform sampler2D uS; uniform vec2 uDir; uniform float uSig;
void main(){ vec4 acc = vec4(0.); float ws = 0.; for (int i=-12;i<=12;i++){ float x = float(i)*max(uSig, .3)/4.; float w = exp(-x*x/(2.*max(uSig*uSig, .01))); acc += texture(uS, vUV + uDir*x)*w; ws += w; } o = acc/ws; }`);
// the lit screen: point lamp (cos^3/d^2 falloff + reflector hot spot) x the product of the puppet layers x woven gauze
const pScreen = prog(VSFS, `#version 300 es
precision highp float; in vec2 vUV; out vec4 o;
uniform sampler2D uL0, uL1, uL2, uL3, uL4, uL5; uniform float uLamp, uT; uniform vec2 uLampP;
const vec3 LIGHT_COL = vec3(1.);   // light colour, vec3(1.) = as delivered (see the Chinese note at the top of the script)
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(hash12(i),hash12(i+vec2(1,0)),f.x), mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ float a=.5,s=0.; for(int i=0;i<4;i++){ s+=a*vnoise(p); p=mat2(.8,.6,-.6,.8)*p*2.03+vec2(3.1,1.7); a*=.5; } return s; }
void main(){
  vec2 p = (vUV - .5)*vec2(${SW}., ${SH}.);
  vec2 dl = p - uLampP; float r2 = dot(dl, dl);
  float fall = pow(1. + r2/(${LD}.*${LD}.), -1.5);
  float I = uLamp*(1.15*fall + .42*exp(-r2/(2.*16.*16.)) + .12*exp(-r2/(2.*5.*5.)));
  vec3 lampC = mix(vec3(1.,.48,.17), vec3(1.,.86,.62), clamp(fall*1.6 - .55, 0., 1.));
  vec3 T = texture(uL0, vUV).rgb*texture(uL1, vUV).rgb*texture(uL2, vUV).rgb*texture(uL3, vUV).rgb*texture(uL4, vUV).rgb*texture(uL5, vUV).rgb;
  // woven cotton gauze: warp/weft threads with slubs, a sewn seam, faint stains, soft creases
  vec2 q = p/.42;
  float wx = .5 + .5*cos(q.x*6.2832), wy = .5 + .5*cos(q.y*6.2832);
  float sx = .7 + .6*vnoise(vec2(floor(q.x)*1.37, p.y*.11)), sy = .7 + .6*vnoise(vec2(p.x*.11, floor(q.y)*1.71));
  float weave = .84 + .16*(wx*sx + wy*sy)*.5 + .05*vnoise(p*5.1);
  float seam = 1. - .07*smoothstep(.4, 0., abs(p.x - 31.5)) + .02*smoothstep(.9, .4, abs(p.x - 31.5));
  float stain = 1. - .06*smoothstep(.55, .85, fbm(p*.035 + 7.));
  float crease = .975 + .025*sin(p.x*.09 + vnoise(p*.04)*3.)*vnoise(p*.02 + 3.);
  o = vec4(LIGHT_COL*lampC*I*T*weave*seam*stain*crease, 1.);
}`);
// final composite: camera dolly, screen (with halation), the photographed stage, silk lanterns, smoke
const pFinal = prog(VSFS, `#version 300 es
precision highp float; in vec2 vUV; out vec4 o;
uniform sampler2D uScr, uStA, uStH, uLan; uniform vec2 uRes, uJn; uniform vec3 uCam; uniform float uF, uT, uLanI, uScrAvg, uFrame, uFade, uShake;
uniform vec4 uStR; uniform float uGlint, uSway;
const vec3 LIGHT_COL = vec3(1.);   // light colour, vec3(1.) = as delivered (see the Chinese note at the top of the script)
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(hash12(i),hash12(i+vec2(1,0)),f.x), mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ float a=.5,s=0.; for(int i=0;i<4;i++){ s+=a*vnoise(p); p=mat2(.8,.6,-.6,.8)*p*2.03+vec2(3.1,1.7); a*=.5; } return s; }
float n1(float x){ float i = floor(x), f = fract(x); float u = f*f*(3.-2.*f); return mix(fract(sin(i*127.1)*43758.5), fract(sin((i+1.)*127.1)*43758.5), u)*2. - 1.; }
vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14), 0., 1.); }
vec2 onPlane(vec2 px, float z){ float s = uF/(uCam.z - z); return uCam.xy + (px - uRes*.5)/s; }
const vec3 LP0 = vec3(-110., 35., 26.), LP1 = vec3(110., 35., 26.);
vec3 screenAt(vec2 p){ vec2 uv = p/vec2(${SW}., ${SH}.) + .5; float lod = log2(max(1., ${SCW}./${SW}. / (uF/uCam.z)));
  vec3 c = textureLod(uScr, uv, lod).rgb; vec3 g = textureLod(uScr, uv, lod + 3.5).rgb;
  return c + max(g - .6, 0.)*.22 + g*.03; }               // light blooming through the cut-outs and the gauze
vec2 stUV(vec2 p){ vec2 uv = (p - uStR.xy)/(uStR.zw - uStR.xy); uv.y = 1. - uv.y; return uv; }
float stH(vec2 p){ return texture(uStH, stUV(p)).r; }
float relShadow(vec3 P, vec3 lp){ vec2 d2 = lp.xy - P.xy; float L = max(length(d2), 1e-3); vec2 dir = d2/L; float slope = (lp.z - P.z)/L; float occ = 0.;
  for (int i=1;i<=8;i++){ float s = float(i)*float(i)*.09; float h = 8. + stH(P.xy + dir*s)*4.; occ = max(occ, (h - (P.z + slope*s))/(.25 + s*.3)); }
  return 1. - clamp(occ, 0., 1.)*.85; }
vec3 stageShade(vec2 p, out float a){
  vec2 uv = stUV(p); vec4 A = texture(uStA, uv); a = A.a; if (a < .004) return vec3(0.);
  vec4 Hm = texture(uStH, uv);
  vec2 e = 1.5/vec2(textureSize(uStH, 0)); float cmt = 1.5/8.;
  float hl = texture(uStH, uv - vec2(e.x,0.)).r, hr = texture(uStH, uv + vec2(e.x,0.)).r, hd = texture(uStH, uv + vec2(0.,e.y)).r, hu = texture(uStH, uv - vec2(0.,e.y)).r;
  vec2 grad = vec2(hr - hl, hu - hd)*4./(2.*cmt);
  vec3 n = normalize(vec3(-grad, 1.));
  float h = Hm.r; vec3 P = vec3(p, 8. + h*4.);
  float ao = 1. - clamp((textureLod(uStH, uv, 2.5).r - h)*2.6 + (textureLod(uStH, uv, 4.5).r - h)*1.6, 0., .8);
  vec3 alb = pow(A.rgb, vec3(2.2));
  float gold = smoothstep(.4, .8, Hm.g);
  // age: rubbed edges (lacquer worn to brown wood, gold worn to the red bole), dust in the recesses
  float wear = smoothstep(.25, 1.1, length(grad))*smoothstep(.42, .78, vnoise(p*.85) + .25*vnoise(p*4.));
  alb = mix(alb, mix(vec3(.10,.035,.016), vec3(.30,.05,.025), gold), wear*.75);
  gold *= 1. - wear*.6;
  alb = mix(alb, vec3(.05,.042,.034), clamp((1. - ao)*.7, 0., .55)*(1. - gold));
  vec3 V = normalize(vec3(uCam.xy - p, uCam.z - P.z));
  float rough = mix(.18, .6, wear) + .1*vnoise(p*2.);
  vec3 col = vec3(0.);
  for (int i=0;i<3;i++){
    vec3 lp = i==0 ? LP0 : (i==1 ? LP1 : vec3(0., 30., 115.));
    vec3 dv = lp - P; float d2 = dot(dv,dv); vec3 L = dv*inversesqrt(d2);
    float cone = i==2 ? smoothstep(0., .5, 1. - length((p - vec2(0., 72.))/vec2(75., 24.))) : 1.;
    vec3 lc = (i==2 ? vec3(1.,.72,.42)*18000. : vec3(1.,.47,.19)*14000.)*uLanI/(d2 + 500.)*cone;
    if (dot(lc, vec3(1.)) < 1e-4) continue;
    float ndl = max(dot(n, L), 0.); float sh = relShadow(P, lp);
    vec3 hv = normalize(L + V); float nh = max(dot(n, hv), 0.);
    float F = .04 + .96*pow(1. - max(dot(hv, V), 0.), 5.);
    float lac = pow(nh, 2./(rough*rough) - 1.)*F*2.2/(rough*rough*8.);
    vec3 lacq = alb*ndl + vec3(lac)*ndl;
    vec3 gld = alb*(.55*ndl + 2.4*pow(nh, 22.)) + alb*.25;
    col += lc*sh*mix(lacq, gld, gold);
  }
  // the glowing screen is an area light in the opening: faces turned toward it catch warm light
  { vec2 q = clamp(p, -vec2(${SW / 2}., ${SH / 2}.), vec2(${SW / 2}., ${SH / 2}.)); vec3 Ls = vec3(q - p, -1.5); float dl = length(Ls); Ls /= max(dl, 1e-3);
    col += LIGHT_COL*vec3(1.,.6,.28)*uScrAvg*max(dot(n, Ls), 0.)*2.6*exp(-dl*.028)*alb*ao*(1. + gold*1.6); }
  col += alb*vec3(.025,.03,.045)*ao*(.6 + .4*n.y);
  // a glint runs over the gold of the plaque once the lanterns are up
  if (uGlint > -500. && abs(p.x) < 48. && abs(p.y - 72.) < 11.2) {
    float gb = exp(-pow((p.x + (p.y - 72.)*.55) - uGlint, 2.)/12.);
    col += gold*(alb*7. + vec3(1.3,.95,.45))*gb*(.35 + .65*pow(max(n.z, 0.), 2.))*uLanI;
  }
  return col;
}
vec3 lantern(vec2 p, vec2 lc, out float a){
  vec2 uv = (p - lc)/vec2(30., 52.) + .5; uv.y = 1. - uv.y; a = 0.;
  if (uv.x < 0. || uv.x > 1. || uv.y < 0. || uv.y > 1.) return vec3(0.);
  vec4 Ls = texture(uLan, uv); a = Ls.a;
  vec2 lq = vec2((uv.x - .5)*30., uv.y*52.);                  // sprite cm, y down from the hook
  vec2 b = (lq - vec2(0., 21.))/vec2(13., 12.); float r = length(b);
  vec3 alb = pow(Ls.rgb, vec3(2.2));
  if (r < 1. && lq.y > 9.4 && lq.y < 32.6) {
    float rimf = sqrt(max(1. - r*r, 0.));
    vec2 cq = (lq - vec2(0., 23.))/vec2(7., 6.);
    float core = exp(-dot(cq, cq));
    return alb*uLanI*(.55 + 2.9*core)*mix(.3, 1., rimf) + alb*.04;
  }
  return alb*(.03 + uLanI*.55*(.6 + .4*exp(-dot(lq - vec2(0., 21.), lq - vec2(0., 21.))/300.)));
}
void main(){
  vec2 px = gl_FragCoord.xy + uJn*uRes*.5;
  px += vec2(n1(uT*40.), n1(uT*37. + 3.))*uShake;
  // the dark yard behind the stage: drifting smoke, lit by the lanterns and the screen
  vec2 pb = onPlane(px, -60.);
  float smoke = fbm(pb*.010 + vec2(uT*.03, -uT*.06))*fbm(pb*.025 + vec2(-uT*.05, uT*.02) + 4.);
  vec3 lit = vec3(1.,.42,.16)*uLanI*(exp(-length(pb - LP0.xy*1.15)/85.) + exp(-length(pb - LP1.xy*1.15)/85.)) + LIGHT_COL*vec3(1.,.55,.25)*uScrAvg*.6*exp(-length(max(abs(pb) - vec2(85.,50.), 0.))/55.);
  vec3 col = vec3(.0035,.0035,.005) + lit*(.025 + .16*smoke);
