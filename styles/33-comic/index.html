<html lang="zh"><head><meta charset="utf-8"><title>33 美式漫画 · Comic Book</title>

<script>
/* ===== 33 美式漫画 · COMIC BOOK =====
   A real four-colour comic cover lying on a desk. The art is drawn as flat colour + black key-plate line art; the GPU
   then *prints* it: cyan / magenta / yellow halftone screens at 15° / 75° / 0°, each plate slightly out of register,
   ink spreading into yellowed newsprint with fibres and foxing, the black plate laid last. The camera reads the inset
   panels (limited animation at 12 drawings per second), then at 4.45 the original hero punches up through the panel
   border and peels off the paper as a die-cut cutout with a real shadow, flies over the page and lands as the cover
   star; the masthead prints plate by plate (Y, M, C, K) on the half-beats. */
const { E, clamp, lerp, inv } = Reel;
const stage = Reel.makeStage('#0b0907');
const C = Reel.cfg({ no: 'No.33', price: '12¢', cap: 'MEANWHILE, ABOVE HARBOR CITY...', say: 'NOT ON MY WATCH!', sfx: 'KRAKOOM!' });
const RS = Reel.RS, W = Math.round(1920 * RS), H = Math.round(1080 * RS);
Reel.ownJitter = true;
const SANS = '"Noto Sans CJK SC"', HEROS = '"TeX Gyre Heros Cn"';
const R = Reel.rng(3333), rr = (a, b) => a + (b - a) * R();
const PGW = 1000, PGH = 1540, TS = 2.0;                   // page units, texture px per unit
const TW = Math.round(PGW * TS), TH = Math.round(PGH * TS);
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d', { willReadFrequently: true })]; };
const [cCol, gC] = mk(TW, TH), [cInk, gK] = mk(TW, TH);
const HS = 1100; const [hCol, hgC] = mk(HS, HS), [hInk, hgK] = mk(HS, HS);   // hero cutout art (units = px)
// panels (page units)
const PA = [40, 1004, 470, 262], PB = [530, 1004, 430, 262], PC = [40, 1290, 920, 216], ART = [40, 318, 920, 650];
const T_BREAK = 4.5, T_LAND = 6.0, T_HIT = 4.0;
// hand lettering: every letter its own size, tilt and baseline (ink plate only unless a fill is given)
function handText(str, x, y, font, align = 'left', o = {}) {
  const ch = [...str]; G.k.font = font; G.c.font = font;
  const ws = ch.map((c) => G.k.measureText(c).width * (o.sp ?? 1));
  const total = ws.reduce((a, b) => a + b, 0);
  let cx = align === 'center' ? x - total / 2 : x;
  const rg = Reel.rng(o.seed || 7);
  ch.forEach((c, i) => {
    const r = (rg() - 0.5) * (o.rot ?? 0.07), s = 1 + (rg() - 0.5) * (o.sc ?? 0.1), dy = (rg() - 0.5) * (o.dy ?? 3);
    both(() => {
      xf(1, 0, 0, 1, cx + ws[i] / 2, y + dy); G.c.rotate(r); G.k.rotate(r); xf(s, 0, 0, s, 0, 0);
      for (const g of [G.c, G.k]) { g.textAlign = 'center'; g.textBaseline = 'alphabetic'; }
      if (o.extrude) for (let d = o.extrude; d > 0; d -= 2) { G.c.fillStyle = o.extCol; G.c.fillText(c, d, d); }
      if (o.fill) { G.c.fillStyle = o.fill; G.c.fillText(c, 0, 0); }
      if (o.stroke) { G.k.lineWidth = o.stroke; G.k.strokeStyle = '#000'; G.k.lineJoin = 'round'; G.k.strokeText(c, 0, 0); }
      if (!o.noInk) { G.k.fillStyle = '#000'; G.k.fillText(c, 0, 0); }
    });
    cx += ws[i];
  });
}

// ---------- drawing helpers: every shape is filled on the colour plate and stroked on the key (black) plate ----------
let G = null;   // { c: colour ctx, k: ink ctx }
function shape(path, fill, lw = 4, opt = {}) {
  if (fill) { G.c.fillStyle = fill; G.c.fill(path); if (!opt.keepInk) { G.k.save(); G.k.globalCompositeOperation = 'destination-out'; G.k.fillStyle = '#000'; G.k.fill(path); G.k.restore(); } }
  if (opt.inkFill) { G.k.fillStyle = '#000'; G.k.fill(path); }
  if (lw > 0) { G.k.lineWidth = lw; G.k.lineJoin = 'round'; G.k.lineCap = 'round'; G.k.strokeStyle = '#000'; G.k.stroke(path); }
}
const pth = (pts, close = true) => { const p = new Path2D(); pts.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y))); if (close) p.closePath(); return p; };
const ell = (x, y, rx, ry, a = 0) => { const p = new Path2D(); p.ellipse(x, y, rx, ry, a, 0, 6.2832); return p; };
const cap = (x0, y0, x1, y1, r0, r1) => {   // tapered limb
  const a = Math.atan2(y1 - y0, x1 - x0), n = [-Math.sin(a), Math.cos(a)];
  const p = new Path2D();
  p.moveTo(x0 + n[0] * r0, y0 + n[1] * r0); p.lineTo(x1 + n[0] * r1, y1 + n[1] * r1); p.arc(x1, y1, r1, a + Math.PI / 2, a - Math.PI / 2, true);
  p.lineTo(x0 - n[0] * r0, y0 - n[1] * r0); p.arc(x0, y0, r0, a - Math.PI / 2, a + Math.PI / 2, true); p.closePath(); return p;
};
function both(fn) { for (const g of [G.c, G.k]) { g.save(); } fn(); for (const g of [G.c, G.k]) g.restore(); }
function xf(a, b, c, d, e, f) { G.c.transform(a, b, c, d, e, f); G.k.transform(a, b, c, d, e, f); }
function clipRect(x, y, w, h) { for (const g of [G.c, G.k]) { g.beginPath(); g.rect(x, y, w, h); g.clip(); } }
function text(str, x, y, font, fill, stroke = 0, ink = true, align = 'left') {
  for (const g of [G.c, G.k]) { g.font = font; g.textAlign = align; g.textBaseline = 'alphabetic'; }
  if (fill) { G.c.fillStyle = fill; G.c.fillText(str, x, y); }
  if (stroke) { G.k.lineWidth = stroke; G.k.strokeStyle = '#000'; G.k.lineJoin = 'round'; G.k.strokeText(str, x, y); }
  if (ink) { G.k.fillStyle = '#000'; G.k.fillText(str, x, y); }
}
function speedLines(cx, cy, r0, r1, n, seed, lw = 2) {
  const rg = Reel.rng(seed); G.k.strokeStyle = '#000';
  for (let i = 0; i < n; i++) { const a = rg() * 6.283, w = (0.4 + rg()) * lw; G.k.lineWidth = w; G.k.beginPath(); G.k.moveTo(cx + Math.cos(a) * (r0 + rg() * 30), cy + Math.sin(a) * (r0 + rg() * 30)); G.k.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); G.k.stroke(); }
}
function burst(cx, cy, r0, r1, n, fill, seed, rot = 0) {
  const rg = Reel.rng(seed), pts = [];
  for (let i = 0; i < n * 2; i++) { const a = rot + i / (n * 2) * 6.283, r = i % 2 ? r0 * (0.85 + rg() * 0.2) : r1 * (0.8 + rg() * 0.35); pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  shape(pth(pts), fill, 5);
}

// ---------- the hero (original: a rocket-pack courier in a bubble helmet and red scarf) ----------
// flying punch, facing right, drawn around (0,0) ~ 420 units tall; f = 12fps tick for the flame / scarf flutter
function heroFly(f) {
  const fl = Math.sin(f * 2.1), fl2 = Math.sin(f * 1.3 + 1);
  // jet flames
  shape(pth([[-120, 40], [-250 - fl * 30, 70 + fl2 * 10], [-180, 52], [-300 - fl * 40, 30], [-175, 30], [-240 - fl2 * 30, -8], [-118, 14]]), '#ffd23f', 4);
  shape(pth([[-122, 34], [-200 - fl * 20, 48], [-150, 34], [-210 - fl2 * 20, 20], [-120, 20]]), '#ff6a2a', 0);
  // scarf
  shape(pth([[36, -168], [-60, -190 + fl * 12], [-150, -170 + fl2 * 18], [-230, -200 + fl * 22], [-200, -160], [-140, -140 + fl2 * 12], [-60, -150], [30, -140]]), '#e2302f', 4.5);
  // back leg, back arm
  shape(cap(-40, 40, -150, 120, 30, 22), '#2a55b0', 5);
  shape(cap(-170, 128, -200, 150, 24, 24), '#ffcc22', 5);
  shape(cap(-10, -90, -110, -60, 24, 20), '#2a55b0', 5);
  shape(ell(-120, -56, 26, 24), '#ffcc22', 5);
  // jetpack
  shape(pth([[-60, -120], [-10, -130], [10, 40], [-40, 60], [-120, 40], [-130, -60]]), '#9aa4ad', 5);
  shape(pth([[-120, 0], [-100, -4], [-100, 30], [-122, 34]]), '#5d6670', 3);
  G.k.lineWidth = 3; G.k.beginPath(); G.k.moveTo(-105, -90); G.k.lineTo(-30, -100); G.k.stroke();
  // torso
  shape(pth([[-30, -140], [70, -150], [110, -60], [80, 40], [-20, 60], [-50, -40]]), '#2e63c7', 5.5);
  shape(pth([[10, -100], [70, -110], [90, -60], [40, -40]]), '#ffcc22', 4);        // chest emblem (a lightning bolt)
  shape(pth([[48, -104], [30, -74], [52, -76], [38, -46], [70, -84], [50, -82], [62, -104]]), '#e2302f', 2.5);
  shape(pth([[-30, 30], [90, 24], [86, 50], [-26, 62]]), '#ffcc22', 4);              // belt
  // front leg
  shape(cap(40, 40, -30, 180, 34, 26), '#2e63c7', 5.5);
  shape(cap(-38, 186, -70, 216, 27, 27), '#ffcc22', 5.5);
  // front arm, punching
  shape(cap(60, -120, 220, -150, 28, 24), '#2e63c7', 5.5);
  shape(ell(250, -152, 38, 34, -0.15), '#ffcc22', 5.5);
  G.k.lineWidth = 3; G.k.beginPath(); G.k.moveTo(244, -178); G.k.lineTo(250, -130); G.k.moveTo(262, -176); G.k.lineTo(268, -132); G.k.stroke();
  // helmet + visor
  shape(ell(60, -200, 66, 62), '#f2f2f2', 5.5);
  const vis = new Path2D(); vis.moveTo(40, -232); vis.quadraticCurveTo(110, -238, 124, -206); vis.quadraticCurveTo(122, -170, 60, -170); vis.quadraticCurveTo(30, -190, 40, -232); vis.closePath();
  shape(vis, '#1b1b2e', 3, { inkFill: true });
  G.c.fillStyle = '#5fd0ff'; G.c.beginPath(); G.c.ellipse(92, -218, 22, 6, -0.25, 0, 6.3); G.c.fill();
  G.k.globalCompositeOperation = 'destination-out'; G.k.beginPath(); G.k.ellipse(92, -218, 20, 4.5, -0.25, 0, 6.3); G.k.fill(); G.k.globalCompositeOperation = 'source-over';
  shape(ell(20, -190, 13, 18, 0.2), '#e2302f', 3.5);       // ear piece
  G.k.lineWidth = 3; G.k.beginPath(); G.k.arc(60, -200, 52, 3.4, 4.3); G.k.stroke();
  // muscle / fold lines, motion streaks
  G.k.lineWidth = 2.5; G.k.beginPath(); G.k.moveTo(0, -20); G.k.quadraticCurveTo(30, 0, 60, -10); G.k.moveTo(10, 90); G.k.quadraticCurveTo(0, 120, -10, 150); G.k.stroke();
}
function heroStand(f) {   // rooftop silhouette, side view, scarf in the wind
  const fl = Math.sin(f * 1.7), fl2 = Math.sin(f * 2.3 + 1);
  shape(pth([[-6, -236], [-90, -254 + fl * 10], [-170, -232 + fl2 * 14], [-226, -262 + fl * 18], [-180, -214], [-112, -206 + fl2 * 8], [-40, -214], [-4, -220]]), '#e2302f', 3);
  const parts = [
    cap(14, -96, 34, -6, 20, 14), cap(-14, -96, -26, -6, 20, 14),                       // legs
    pth([[24, -10], [62, -6], [62, 4], [20, 4]]), pth([[-30, -10], [8, -6], [8, 4], [-34, 4]]),   // boots
    pth([[-40, -226], [36, -230], [46, -170], [34, -96], [-30, -94], [-44, -160]]),        // torso, broad shoulders
    pth([[-74, -222], [-38, -228], [-30, -120], [-70, -124]]),                           // jetpack
    cap(34, -214, 62, -150, 15, 12), cap(62, -150, 56, -112, 12, 13),                   // arm on the hip
    cap(-30, -210, -14, -140, 14, 12),
    ell(4, -262, 34, 33),                                                                // helmet
  ];
  for (const pp of parts) shape(pp, null, 0, { inkFill: true });
  G.c.fillStyle = '#ff9a3c'; G.c.beginPath(); G.c.ellipse(20, -266, 16, 8, -0.2, 0, 6.3); G.c.fill();   // visor catching the sunset
  G.k.globalCompositeOperation = 'destination-out'; G.k.beginPath(); G.k.ellipse(20, -266, 14, 6, -0.2, 0, 6.3); G.k.fill(); G.k.globalCompositeOperation = 'source-over';
}
function robot(x, y, s, f, hit = 0) {
  both(() => {
    xf(s, 0, 0, s, x, y); G.c.rotate(hit * 0.25); G.k.rotate(hit * 0.25);
    shape(pth([[-120, -260], [120, -260], [140, 40], [-140, 40]]), '#7a5aa8', 6);
    shape(pth([[-90, -240], [90, -240], [100, -150], [-100, -150]]), '#5b4185', 4);
    shape(ell(0, -196, 40, 26), '#ff2a2a', 5);
    shape(ell(0, -196, 16, 10), '#ffd23f', 0);
    shape(cap(-140, -180, -230, -40 + Math.sin(f) * 10, 30, 26), '#7a5aa8', 6);
    shape(cap(140, -180, 230, -60, 30, 26), '#7a5aa8', 6);
    shape(pth([[-260, -40], [-200, -60], [-190, 0], [-250, 10]]), '#9aa4ad', 5);
    shape(pth([[260, -70], [200, -80], [190, -20], [250, -10]]), '#9aa4ad', 5);
    shape(pth([[-6, -260], [6, -260], [8, -330], [-8, -330]]), '#9aa4ad', 4); shape(ell(0, -338, 14, 14), '#ff2a2a', 4);
    G.k.lineWidth = 3; for (let i = 0; i < 4; i++) { G.k.beginPath(); G.k.moveTo(-110, -120 + i * 34); G.k.lineTo(110, -120 + i * 34); G.k.stroke(); }
    for (const [rx, ry] of [[-100, -110], [100, -110], [-100, 10], [100, 10]]) { shape(ell(rx, ry, 7, 7), '#cfd6dd', 2); }
  });
}
function skyline(x0, y0, w, h, seed, col, win) {
  const rg = Reel.rng(seed); let x = x0;
  while (x < x0 + w) {
    const bw = 40 + rg() * 90, bh = h * (0.35 + rg() * 0.65);
    shape(pth([[x, y0], [x, y0 - bh], [x + bw, y0 - bh], [x + bw, y0]]), col, 3);
    for (let yy = y0 - bh + 14; yy < y0 - 10; yy += 22) for (let xx = x + 10; xx < x + bw - 10; xx += 18) if (rg() < 0.45) { G.c.fillStyle = win; G.c.fillRect(xx, yy, 8, 10); }
    x += bw + rg() * 6;
  }
}
function caption(x, y, w, h, str, font) { shape(pth([[x, y], [x + w, y], [x + w, y + h], [x, y + h]]), '#ffe46b', 3.5); handText(str, x + 10, y + h - 12, font, 'left', { seed: 3, rot: 0.06, sc: 0.08, dy: 2.2 }); }
function balloon(cx, cy, rx, ry, tx, ty, str, font) {
  const p = new Path2D(); p.ellipse(cx, cy, rx, ry, 0, 0, 6.2832);
  const tail = pth([[cx - rx * 0.2, cy + ry * 0.7], [tx, ty], [cx + rx * 0.15, cy + ry * 0.8]]);
  shape(tail, '#ffffff', 4); shape(p, '#ffffff', 4);
  G.c.fillStyle = '#fff'; G.c.beginPath(); G.c.ellipse(cx, cy, rx - 3, ry - 3, 0, 0, 6.3); G.c.fill();
  G.k.globalCompositeOperation = 'destination-out'; G.k.beginPath(); G.k.ellipse(cx, cy, rx - 2.5, ry - 2.5, 0, 0, 6.3); G.k.fill(); G.k.globalCompositeOperation = 'source-over';
  handText(str, cx, cy + 12, font, 'center', { seed: 5, rot: 0.07, sc: 0.09, dy: 2.5 });
}
function panelFrame(x, y, w, h, broken = 0) {
  G.k.lineWidth = 6; G.k.strokeStyle = '#000';
  if (!broken) { G.k.strokeRect(x, y, w, h); return; }
  // the top border shattered where the hero punched through
  const bx = x + w * 0.5, gap = 140 * broken;
  G.k.beginPath(); G.k.moveTo(bx - gap, y); G.k.lineTo(x, y); G.k.lineTo(x, y + h); G.k.lineTo(x + w, y + h); G.k.lineTo(x + w, y); G.k.lineTo(bx + gap * 0.8, y); G.k.stroke();
  const rg = Reel.rng(77);
  for (let i = 0; i < 9; i++) {
    const a = -Math.PI / 2 + (rg() - 0.5) * 2.2, d = 40 + 220 * broken * (0.5 + rg()), cx = bx + (rg() - 0.5) * gap * 1.6 + Math.cos(a) * d, cy = y + Math.sin(a) * d * 0.8;
    const s = 10 + rg() * 22, r = rg() * 6;
    shape(pth([[cx - s, cy], [cx + s * 0.7, cy - s * 0.25], [cx + s * 0.4, cy + 6], [cx - s * 0.6, cy + 8]].map(([px, py]) => [cx + (px - cx) * Math.cos(r) - (py - cy) * Math.sin(r), cy + (px - cx) * Math.sin(r) + (py - cy) * Math.cos(r)])), '#ffffff', 3);
  }
}

// ---------- the whole page for 12fps tick f ----------
function drawPage(f) {
  const t = f / 15; f = f * 12 / 15;           // drawings on twos (15 per second); wiggles keep their old speed
  G = { c: gC, k: gK };
  for (const g of [gC, gK]) { g.setTransform(TS, 0, 0, TS, 0, 0); }
  gC.fillStyle = '#ffffff'; gC.fillRect(0, 0, PGW, PGH); gK.clearRect(0, 0, PGW, PGH);
  // --- masthead: the hero's bolt emblem (diamond, red block shadow), a Ben-Day stripe band, issue box, price box
  //     (printed plate by plate at the end: the shader gates this strip by region)
  both(() => {
    const ex = 470, ey = 152;
    // behind the emblem: inked action lines bursting out of it across the masthead
    G.k.save(); G.k.beginPath(); G.k.rect(130, 30, 700, 228); G.k.clip();
    const rg = Reel.rng(41);
    for (let i = 0; i < 46; i++) { const a = rg() * 6.283, r0 = 165 + rg() * 30, r1 = 420; G.k.lineWidth = 1.5 + rg() * 3.5; G.k.beginPath(); G.k.moveTo(ex + Math.cos(a) * r0 * 1.15, ey + Math.sin(a) * r0 * 0.85); G.k.lineTo(ex + Math.cos(a) * r1, ey + Math.sin(a) * r1 * 0.6); G.k.stroke(); }
    G.k.restore();
    const dia = (o, s) => pth([[ex + o, ey - 118 * s + o], [ex + 150 * s + o, ey + o], [ex + o, ey + 118 * s + o], [ex - 150 * s + o, ey + o]]);
    for (let d = 16; d > 0; d -= 2) shape(dia(d, 1), '#c41f26', 0);
    shape(dia(0, 1), '#ffd23f', 7);
    shape(dia(0, 0.8), null, 3);
    const bolt = pth([[ex + 34, ey - 92], [ex - 52, ey + 10], [ex - 6, ey + 10], [ex - 40, ey + 96], [ex + 58, ey - 16], [ex + 10, ey - 16], [ex + 44, ey - 92]]);
    for (let d = 10; d > 0; d -= 2) shape(pth([[ex + 34 + d, ey - 92 + d], [ex - 52 + d, ey + 10 + d], [ex - 6 + d, ey + 10 + d], [ex - 40 + d, ey + 96 + d], [ex + 58 + d, ey - 16 + d], [ex + 10 + d, ey - 16 + d], [ex + 44 + d, ey - 92 + d]]), '#7a1218', 0);
    shape(bolt, '#e2302f', 5);
    // Ben-Day band under the emblem: diagonal stripes, red dots between
    both(() => {
      const band = pth([[110, 262], [850, 262], [832, 300], [128, 300]]);
      G.c.save(); G.c.clip(band); G.k.save(); G.k.clip(band);
      G.c.fillStyle = '#ffd23f'; G.c.fillRect(100, 255, 760, 50);
      for (let x = 60; x < 900; x += 34) { G.c.fillStyle = '#2e63c7'; G.c.beginPath(); G.c.moveTo(x, 300); G.c.lineTo(x + 16, 300); G.c.lineTo(x + 40, 262); G.c.lineTo(x + 24, 262); G.c.fill(); }
      G.c.restore(); G.k.restore();
      shape(band, null, 4);
    });
    shape(pth([[840, 40], [960, 40], [960, 150], [840, 150]]), '#ffffff', 4);
    handText(C.no, 900, 100, `italic 700 40px ${HEROS}`, 'center', { seed: 11, rot: 0.05, sc: 0.06, dy: 2 });
    handText('OCT', 900, 138, `700 28px ${HEROS}`, 'center', { seed: 12, fill: '#d9282f', noInk: true, rot: 0.05 });
    burst(70, 80, 36, 60, 10, '#ffd23f', 5); text('★', 70, 94, `700 40px ${SANS}`, '#d9282f', 0, false, 'center');
    shape(pth([[44, 150], [118, 150], [118, 214], [44, 214]]), '#ffffff', 4);
    handText(C.price, 81, 198, `700 40px ${HEROS}`, 'center', { seed: 13, rot: 0.06, sc: 0.06, dy: 2 });
  });
  // --- main cover art: night city, the giant robot, search lights
  both(() => {
    clipRect(ART[0], ART[1], ART[2], ART[3]);
    const sky = gC.createLinearGradient(0, ART[1], 0, ART[1] + ART[3]); sky.addColorStop(0, '#16205a'); sky.addColorStop(0.65, '#5a2f8a'); sky.addColorStop(1, '#e05a8a');
    gC.fillStyle = sky; gC.fillRect(ART[0], ART[1], ART[2], ART[3]);
    for (const [x, a] of [[220, -0.25], [760, 0.3]]) { gC.save(); gC.translate(x, ART[1] + ART[3]); gC.rotate(a); const sg = gC.createLinearGradient(0, 0, 0, -700); sg.addColorStop(0, 'rgba(255,240,170,.75)'); sg.addColorStop(1, 'rgba(255,240,170,0)'); gC.fillStyle = sg; gC.beginPath(); gC.moveTo(-20, 0); gC.lineTo(-110, -700); gC.lineTo(110, -700); gC.lineTo(20, 0); gC.fill(); gC.restore(); }
    robot(560, ART[1] + 520, 1.25, f * 0.7, 0);
    skyline(ART[0] - 10, ART[1] + ART[3] + 4, ART[2] + 30, 260, 9, '#23285a', '#ffd23f');
    if (t >= T_LAND) { both(() => { xf(1.18, 0, 0, 1.18, 430, ART[1] + 300); G.c.rotate(-0.42); G.k.rotate(-0.42); heroFly(f); }); speedLines(560, ART[1] + 260, 300, 900, 40, 3, 3); }

  [2.75, [500, 1400, 820, 0.0, -0.2]], [4.1, [515, 1386, 760, 0.02, -0.18]], [4.7, [520, 1330, 880, 0.03, -0.18]],
  [5.9, [500, 790, 2300, 0.06, -0.24]], [8.0, [480, 430, 1350, 0.04, -0.2]], [8.6, [480, 424, 1320, 0.04, -0.2]],
];
const TAN = KEYS.map(([t, v], i) => v.map((x, d) => {
  if (i === 0 || i === KEYS.length - 1) return 0;
  const [t0, v0] = KEYS[i - 1], [t1, v1] = KEYS[i + 1];
  const a = (x - v0[d]) / (t - t0), b = (v1[d] - x) / (t1 - t);
  if (a * b <= 0) return 0;
  const m = (a * (t1 - t) + b * (t - t0)) / (t1 - t0);
  return Math.sign(m) * Math.min(Math.abs(m), 3 * Math.min(Math.abs(a), Math.abs(b)));
}));
function camAt(t) {
  let i = 0; while (i < KEYS.length - 2 && t > KEYS[i + 1][0]) i++;
  const [ta_, va] = KEYS[i], [tb_, vb] = KEYS[i + 1], h = tb_ - ta_, u = clamp((t - ta_) / h);
  const u2 = u * u, u3 = u2 * u, h00 = 2 * u3 - 3 * u2 + 1, h10 = u3 - 2 * u2 + u, h01 = -2 * u3 + 3 * u2, h11 = u3 - u2;
  const [cx, cy, hh, tx, ty] = va.map((x, d) => h00 * x + h10 * h * TAN[i][d] + h01 * vb[d] + h11 * h * TAN[i + 1][d]);
  return look(cx, cy, hh, tx, ty);
}
// hero cutout flight: from panel C up over the page, lands in the cover art
function heroAt(t) {
  const k = inv(T_BREAK, T_LAND - 0.07, t);
  // start / end poses match the printed hero in panel C and on the cover (centre of the cut-out canvas)
  const x = lerp(482, 382, E.inOutSine(k)) + Math.sin(E.inOutSine(k) * Math.PI) * 150;
  const y = lerp(PC[1] - 69, ART[1] + 232.6, E.inOutSine(k));
  const kz = k;                                                         // flight done two frames early: lands, squashes, then prints
  const z = Math.pow(Math.sin(Math.PI * kz), 0.85) * 900 * (1 - 0.25 * kz);
  const rot = lerp(-1.05, -0.42, E.inOutCubic(k)) + Math.sin(k * 9) * 0.05;
  const sc = lerp(0.42 / 1.6, 1.18 / 1.6, E.inOutCubic(k));
  const tilt = -Math.sin(Math.PI * kz) * 0.35;
  // anticipation squash as it tears free, stretch on the way up, squash on the landing
  // (keyed to the frame, not to the motion-blur sub-samples, so a pose never blends with the next one)
  const tf = Math.round(t * 30) / 30;
  let sx = 1, sy = 1;
  if (tf < T_BREAK + 0.067) { sx = 1.08; sy = 0.88; } else if (tf < T_BREAK + 0.167) { sx = 0.9; sy = 1.16; }
  else if (tf >= T_LAND - 0.07) { sx = 1.12; sy = 0.84; }
  return { x, y, z: Math.max(0.8, z), rot, sc, tilt, flex: Math.sin(k * 14) * 0.6, sx, sy };   // never below the paper's own thickness (no z-fighting on landing)
}

Reel.scene({
  duration: 10, fps: 30,
  fonts: [`700 40px ${HEROS}`, `italic 700 40px ${HEROS}`, `700 22px ${SANS}`, `700 40px ${SANS}`],
  async setup() {},
  cues: [
    { t: 0.0, sfx: 'city', gain: 0.5 }, { t: 1.2, sfx: 'whoosh', gain: 0.3 }, { t: 1.5, sfx: 'zap', gain: 0.5 },
    { t: 2.45, sfx: 'whoosh', gain: 0.25 }, { t: 2.6, sfx: 'jet', gain: 0.7 }, { t: T_HIT, sfx: 'krakoom', gain: 1.0 },
    { t: 4.5, sfx: 'tear', gain: 0.85 }, { t: 4.55, sfx: 'jet', gain: 0.6 }, { t: T_LAND - 0.07, sfx: 'land', gain: 0.7 },
    { t: 6.5, sfx: 'press', gain: 0.6 }, { t: 7.0, sfx: 'press', gain: 0.6 }, { t: 7.5, sfx: 'press', gain: 0.65 }, { t: 8.0, sfx: 'press', gain: 0.8 }, { t: 8.0, sfx: 'stinger', gain: 0.6 },
  ],
  render(t) {
    const frame = Math.round(t * 30), tick = Math.floor((frame + 1) / 2), tp = tick / 15;   // 15 drawings per second, locked to the frame (not the blur sub-samples)
    if (tick !== lastTick) { drawPage(tick); upFlip(tCOL, cCol); upFlip(tINK, cInk); lastTick = tick; }
    const hs = tp >= T_BREAK && tp < T_LAND ? heroAt(t) : null;
    if (hs && heroTick !== tick) { drawHero(tick); upFlip(tHC, hCol); upFlip(tHK, hInk); heroTick = tick; }
    const jit = Reel.jit || [0, 0];
    const cam = camAt(t);
    const fwd = V3.norm(V3.sub(cam.ta, cam.ro)), right = V3.norm(V3.cross(fwd, [0, 1, 0])), up = V3.cross(right, fwd);
    const plates = [t >= 6.5 ? 1 : 0, t >= 7.0 ? 1 : 0, t >= 7.5 ? 1 : 0, t >= 8.0 ? 1 : 0];
    const settle = t >= 8.0 ? Math.sin(Math.PI * clamp((t - 8.0) / 0.3)) * Math.exp(-(t - 8.0) * 4) : 0;   // the corner drops flat as the black plate lands
    const rp = t >= T_LAND - 0.07 ? t - (T_LAND - 0.07) : -1;
    SG.bind(gl, fSH);
    const P = pShade.use().t('COL', tCOL).t('INK', tINK).t('HCOL', tHC).t('HINK', tHK).f('res', W, H).f('jit', jit[0], -jit[1])
      .v('ro', cam.ro).v('cf', fwd).v('cr', right).v('cu', up).f('tanF', 0.36).f('T', t).v('plates', plates).f('PG', PGW, PGH);
    if (hs) P.f('hero', hs.x, hs.y, hs.z, 1).f('heroR', hs.rot, hs.sc, hs.tilt, hs.flex).f('heroS', hs.sx, hs.sy); else P.f('hero', 0, 0, 0, 0).f('heroR', 0, 1, 0, 0).f('heroS', 1, 1);
    P.f('curlK', 1 - 0.55 * settle).f('bump', 430, ART[1] + 300, rp >= 0 ? rp * 1300 : -999, rp >= 0 && rp < 0.6 ? 2.2 * Math.exp(-rp * 6) : 0);
    QUAD.draw();
    let src = tSH;
    const dist = Math.hypot(...V3.sub(cam.ta, cam.ro));
    const ap = hs ? 1.4 : 0.5;
    SG.bind(gl, fDF); pDof.use().t('S', tSH).f('res', W, H).f('focus', hs ? Math.max(200, dist - hs.z * 0.8) : dist).f('aper', ap * 6 * RS).f('maxC', ap * 6 * RS + 0.01); QUAD.draw(); src = tDF;
    SG.bind(gl, null); gl.viewport(0, 0, W, H);
    pComp.use().t('S', src).f('res', W, H).f('seed', Math.floor(t * 30) % 97).f('expo', 1.25); QUAD.draw();
    gl.finish();
  },
});
