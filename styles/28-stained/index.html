<html lang="zh"><head><meta charset="utf-8"><title>28 彩色玻璃窗 · Stained Glass</title>
<script src="../../lib/core.js"></script><script src="../../lib/track.js"></script><script src="../../lib/gl.js"></script><script src="../../lib/rm.js"></script>
</head><body><div id="stage"></div>
<script>
/* ===== 28 彩色玻璃窗 · Stained Glass =====
   Real world: a dim stone chapel. A tall lancet window, deep in a splayed stone reveal, leaded like a craftsman's
   landscape window: a dawn sky cut in curved bands, hills, irises, a tree whose leaves are cut along their midribs;
   streaky cathedral and opalescent glass, painted grisaille veins and bark, lead came of uneven width with solder
   joints, two iron saddle bars. Clouds pass outside so the window breathes; the panes catch the sun band by band on
   the beat; at 4s the sun comes out fully — coloured shafts full of dust reach the floor. The sun keeps moving, the
   patches slide over the flagstones; the camera sinks into a low three-quarter view: the window above, the dusty shaft,
   and on the floor the projection of the leaded rosette at the foot of the window, whose petals catch the sun one by
   one on the beat; its amber heart lights on 8.0. */
const { E, clamp, inv, lerp } = Reel;
const stage = Reel.makeStage('#050403');
Reel.ownJitter = true;
const C = Reel.cfg({});

/* ---------------- the window: a craftsman's leaded landscape (Tiffany-style dawn, tree, irises) ----------------
   Pieces are cut along the design: curved sky bands split by slanted cuts, hills and meadow split the same way,
   each leaf cut in two along its midrib, the trunk in slanted pieces. Lead came of varying width with solder
   blobs at the joints, two iron saddle bars, grisaille veins/bark/matting painted on. */
const WC = 960, HC = 2540, K = WC / 1.8, APEX = 4.2 + 0.9 * Math.sqrt(3);
const px = (x) => (x + 0.9) * K, py = (y) => (APEX - y) * K;
const ux = (cx) => cx / K - 0.9, uy = (cy) => APEX - cy / K;
function inLancet(x, y, d, y0) {
  if (y < y0 || Math.abs(x) > 0.9 - d) return false;
  if (y <= 4.2) return true;
  const r = 1.8 - d;
  return Math.hypot(x - 0.9, y - 4.2) < r && Math.hypot(x + 0.9, y - 4.2) < r;
}
const BAND = 1.52, PANEL = 1.56, BORDER = 0.07, BARS = [2.63, 3.97];
const R = Reel.rng(28);
const lin = (h) => { const n = parseInt(h.slice(1), 16); return [((n >> 16) & 255), ((n >> 8) & 255), (n & 255)]; };
let winCanvas, auxCanvas, paintCanvas, auxData, colData, LEADM;
const SQ = 0.8;    // tan of the sun's elevation: the rosette is pre-squashed so it lands round on the floor

function buildWindow() {
  const sc = Object.assign(document.createElement('canvas'), { width: WC, height: HC });
  const g = sc.getContext('2d', { willReadFrequently: true });
  g.fillStyle = '#000'; g.fillRect(0, 0, WC, HC);

  const mkCuts = (spacing, seed) => { const r = Reel.rng(seed); const c = []; let x = -1.05 + r() * spacing * 0.6; while (x < 1.05) { c.push([x, (r() - 0.5) * 0.7]); x += spacing * (0.65 + 0.7 * r()); } return c; };

  const farH = (x) => prof(x, 2.36, 0.12, 2.3, 0.4, 0.05, 6.1, 1.2), nearH = (x) => prof(x, 2.06, 0.1, 3.1, 2.2, 0.04, 7.3, 0.3), meadH = (x) => prof(x, 1.84, 0.05, 4.2, 1.1, 0.02, 9, 2);
  add({ pal: ['#5b5c9a', '#6a679f', '#55548e', '#6f6fa8', '#61649f'], cuts: mkCuts(0.36, 11), yr: 2.3, opal: 0.6 }, () => poly([[-1, PANEL], ...xs.map((x) => [x, farH(x)]), [1, PANEL]]));
  add({ pal: ['#6d8c4c', '#7f9c55', '#5f7f45', '#88a25e', '#738f50'], cuts: mkCuts(0.32, 12), yr: 2.0, opal: 0.4 }, () => poly([[-1, PANEL], ...xs.map((x) => [x, nearH(x)]), [1, PANEL]]));
  add({ pal: ['#3f6a35', '#4c7a3c', '#3a5f33', '#567f3f'], cuts: mkCuts(0.27, 13), yr: 1.7, opal: 0.3 }, () => poly([[-1, PANEL], ...xs.map((x) => [x, meadH(x)]), [1, PANEL]]));

    if (side <= 0) g.quadraticCurveTo(px(cx - nx * w * 1.25), py(cy - ny * w * 1.25), px(B[0]), py(B[1])); else g.lineTo(px(B[0]), py(B[1]));
    g.closePath(); g.fill();

  IRIS.forEach(([x, y], i) => {
    add({ col: pick(['#4e8a3c', '#5a9a44']), opal: 0.4 }, () => vesica(x - 0.035, y - 0.07, Math.PI / 2 + 0.25, 0.2, 0.032, 0));
    add({ col: pick(['#3f7a36', '#4c8a3e']), opal: 0.4 }, () => vesica(x + 0.04, y - 0.08, Math.PI / 2 - 0.3, 0.18, 0.03, 0));
    const pts = [[Math.PI / 2, 0.1, 0.045, '#7d60b8'], [Math.PI / 2 + 2.1, 0.105, 0.05, '#55409a'], [Math.PI / 2 - 2.1, 0.105, 0.05, '#5c46a2']];
    pts.forEach(([a, L, w, c]) => { const cx = x + Math.cos(a) * L * 0.55, cy = y + 0.04 + Math.sin(a) * L * 0.55; add({ col: c, opal: 0.55 }, () => vesica(cx, cy, a, L, w, 0)); PAINT.petals.push([cx, cy, a, L, w]); });
    add({ col: '#e2b33c', opal: 0.2 }, () => vesica(x, y + 0.035, Math.PI / 2, 0.042, 0.017, 0));

  }

  LIMBS.forEach(([ex, ey, cx, cy]) => {
    const Pt = (u) => [lerp(lerp(0, cx, u), lerp(cx, ex, u), u), lerp(lerp(3.05, cy, u), lerp(cy, ey, u), u)];
    for (let seg = 0; seg < 2; seg++) {
      add({ col: seg ? '#9a5f2a' : '#87501f', opal: 0.4 }, () => { g.lineCap = 'round'; g.lineWidth = (seg ? 0.034 : 0.05) * K; g.beginPath();
        for (let u = seg * 0.5; u <= seg * 0.5 + 0.5 + 1e-6; u += 0.05) { const [x, y] = Pt(u); u === seg * 0.5 ? g.moveTo(px(x), py(y)) : g.lineTo(px(x), py(y)); } g.stroke(); });
    }

  });

  const LEAFG = ['#5fa04a', '#7cb85a', '#9cc966', '#4f8f45', '#b5d070', '#6aab55', '#88c25e', '#3f8a4a'], LEAFW = ['#d6a03a', '#c9862f', '#e2b84a'];
  const leaves = [];

    const x = Math.cos(a) * r * 0.82, y = 3.95 + Math.sin(a) * r * 0.7;
    if (y < 3.15 || !inLancet(x, y, BORDER + 0.06, PANEL)) continue;
    if (leaves.some((l) => Math.hypot(l[0] - x, l[1] - y) < 0.07)) continue;
    leaves.push([x, y]);
  }
  for (const [x, y] of leaves) {
    const a = Math.atan2(y - 3.3, x) + (R() - 0.5) * 0.9, L = 0.18 + R() * 0.06, w = 0.06 + R() * 0.02;
    const warm = R() < 0.12, c1 = warm ? pick(LEAFW) : pick(LEAFG);
    const c2 = lin(c1).map((v) => Math.round(v * 0.8)); const c2h = '#' + c2.map((v) => v.toString(16).padStart(2, '0')).join('');

    const a = R() * Math.PI * 2, r = 0.2 + R() * 0.45, x = Math.cos(a) * r * 0.8, y = 3.95 + Math.sin(a) * r * 0.66;
    if (!inLancet(x, y, BORDER + 0.07, PANEL)) continue;
    add({ col: pick(['#c8572f', '#a5262f', '#d98a2e']), opal: 0.2 }, () => { g.beginPath(); g.arc(px(x), py(y), 0.022 * K, 0, 7); g.fill(); });
  }

  const ids = new Int32Array(WC * HC).fill(-1);
  const bandY = (k, x) => 1.9 + k * 0.29 + 0.055 * Math.sin(x * 2.1 + k * 1.3) + 0.025 * Math.sin(x * 4.7 + k * 2.9);
  const skyCuts = Array.from({ length: 16 }, (_, k) => mkCuts(0.31, 100 + k));
  const cutIdx = (cuts, x, y, yr) => { let j = 0; for (const [cx, sl] of cuts) { if (x > cx + sl * (y - yr) + 0.035 * Math.sin((y - yr) * 8 + cx * 5)) j++; else break; } return j; };
  for (let cy = 0; cy < HC; cy++) {

    for (let cx = 0; cx < WC; cx++) {

        // the rosette, drawn squashed by SQ so its projection on the floor is round
        const rx = x, ry = (y - 1.26) / SQ, r = Math.hypot(rx, ry), an = (Math.atan2(ry, rx) + Math.PI * 2) % (Math.PI * 2);
        const lobe = 0.215 + 0.055 * Math.abs(Math.cos(4 * an));

        if (r < lobe) { ids[o] = ROS + 1 + Math.floor(((an + Math.PI / 8) % (Math.PI * 2)) / (Math.PI / 4)); continue; }
        if (r < 0.3) { ids[o] = ROS + 10 + Math.floor(an / (Math.PI / 8)); continue; }

        else s = (x < 0 ? 0 : 1000) + (4.2 - PANEL) / 0.15 + Math.abs(Math.atan2(y - 4.2, x < 0 ? x - 0.9 : x + 0.9)) * 1.8 / 0.15;
        ids[o] = BORD + Math.floor(s); continue;

      if (id !== 0) { ids[o] = -2; continue; }

      ids[o] = SKY + k * 64 + cutIdx(skyCuts[Math.min(15, k)], x, y, bandY(k, 0) + 0.15);
    }
  }

    const nb = [ids[o + 1], ids[o - 1], ids[o + WC], ids[o - WC]];
    let e = a === -2;

    if (seen.size >= 3) junc[o] = 1;
  }

  for (let o = 0; o < N; o++) if (edge[o]) dist[o] = 0;
  for (let cy = 0; cy < HC; cy++) for (let cx = 0; cx < WC; cx++) { const o = cy * WC + cx; let d = dist[o];
    if (cx > 0) d = Math.min(d, dist[o - 1] + 1); if (cy > 0) { d = Math.min(d, dist[o - WC] + 1); if (cx > 0) d = Math.min(d, dist[o - WC - 1] + 1.414); if (cx < WC - 1) d = Math.min(d, dist[o - WC + 1] + 1.414); } dist[o] = d; }
  for (let cy = HC - 1; cy >= 0; cy--) for (let cx = WC - 1; cx >= 0; cx--) { const o = cy * WC + cx; let d = dist[o];
    if (cx < WC - 1) d = Math.min(d, dist[o + 1] + 1); if (cy < HC - 1) { d = Math.min(d, dist[o + WC] + 1); if (cx < WC - 1) d = Math.min(d, dist[o + WC + 1] + 1.414); if (cx > 0) d = Math.min(d, dist[o + WC - 1] + 1.414); } dist[o] = d; }

  }

  return { p: [x, y, z], fw, rt, up, fl };
}
function sun(t) {
  // the sun keeps creeping after 8.0, so the patches never quite freeze
  const dx = lerp(-0.3, 0.0, Track.easeRange(t, 3.6, 8.0)) + 0.006 * Math.max(0, t - 8.0);
  const gain = lerp(0.42, 1.0, E.outCubic(inv(3.92, 4.35, t)));
  const dust = lerp(0.4, 1.0, E.outCubic(inv(3.95, 4.6, t)));

}
function auxAt(x, y) {
  const cx = Math.floor((x + 0.9) * K), cy = Math.floor((APEX - y) * K);
  if (cx < 0 || cy < 0 || cx >= WC || cy >= HC) return null;
  const o = cy * WC + cx;

}
const MOTES = Array.from({ length: 900 }, (_, i) => { const r = Reel.rng(900 + i); return { x: (r() - 0.5) * 3.4, y: 0.2 + r() * 5.2, z: 0.4 + r() * 8.2, ph: r() * 6.28, sp: 0.3 + r() * 0.6, b: 0.4 + r() * 0.8 }; });

function motes(t, c, s, focus) {
  mA.fill(0); mC.fill(0);
  const W = 1920 * Reel.RS, H = 1080 * Reel.RS;
  let n = 0;
  if (s[3] < 0.05) return 0;
  for (const m of MOTES) {
    if (n >= NM) break;
    const X = [m.x + 0.06 * Math.sin(t * 0.4 * m.sp + m.ph), m.y + 0.05 * Math.sin(t * 0.3 + m.ph * 2) + t * 0.012, m.z + 0.05 * Math.cos(t * 0.35 * m.sp + m.ph)];
    const sS = X[2] + 0.45, Wx = X[0] - s[0] * sS, Wy = X[1] - s[1] * sS;
    if (!inLancet(Wx, Wy, 0, 1.0)) continue;
    const a = auxAt(Wx, Wy); if (!a || a.lead || t < a.tIgn) continue;
    const d = [X[0] - c.p[0], X[1] - c.p[1], X[2] - c.p[2]];
    const z = d[0] * c.fw[0] + d[1] * c.fw[1] + d[2] * c.fw[2]; if (z < 0.3) continue;
    const sx = (d[0] * c.rt[0] + d[1] * c.rt[1] + d[2] * c.rt[2]) / z * c.fl, sy = (d[0] * c.up[0] + d[1] * c.up[1] + d[2] * c.up[2]) / z * c.fl;
    const X2 = (sx * H + W) / 2, Y2 = (sy * H + H) / 2;
    if (X2 < -20 || X2 > W + 20 || Y2 < -20 || Y2 > H + 20) continue;
    const coc = Math.abs(1 / focus - 1 / z) * 34 * Reel.RS;
    const rad = Math.max(1.6 * Reel.RS, Math.min(26 * Reel.RS, coc + 1.3 * Reel.RS));
    const tw = 0.6 + 0.4 * Math.sin(t * 5 * m.sp + m.ph * 3);
    const I = m.b * tw * s[3] * s[2] * 3.2 * Math.pow(1.6 * Reel.RS / rad, 1.6);
    mA.set([X2, Y2, rad, I], n * 4);
    mC.set(a.c.map((v) => Math.pow(v / 255, 2.2) * 0.8 + 0.2), n * 4);
    n++;
  }
  return n;
}

Reel.scene({
  duration: 10, fps: 30,

  async setup() { buildWindow(); texWin = upload(5, winCanvas, true); texAux = upload(6, auxCanvas, false); texPaint = upload(7, paintCanvas, true); },
  cues: [
    { t: 0.5, sfx: 'pane_1', gain: 0.55 }, { t: 1.0, sfx: 'pane_2', gain: 0.55 }, { t: 1.5, sfx: 'pane_3', gain: 0.6 }, { t: 2.0, sfx: 'pane_4', gain: 0.6 },
    { t: 2.5, sfx: 'pane_5', gain: 0.62 }, { t: 3.0, sfx: 'pane_6', gain: 0.65 }, { t: 3.5, sfx: 'pane_7', gain: 0.68 },
    { t: 4.0, sfx: 'sun_burst', gain: 0.9 }, { t: 6.0, sfx: 'air_move', gain: 0.55 },
    { t: 7.0, sfx: 'letter_on', gain: 0.5 }, { t: 7.125, sfx: 'letter_on', gain: 0.5 }, { t: 7.25, sfx: 'letter_on', gain: 0.5 }, { t: 7.375, sfx: 'letter_on', gain: 0.5 }, { t: 7.5, sfx: 'letter_on', gain: 0.55 },
    { t: 8.0, sfx: 'title_glow', gain: 0.7 },
  ],
  render(t) {
    const c = cam(t), s = sun(t);
    // focus: the window, then the shaft, then the rosette on the floor
    const focus = lerp(lerp(7.0, 5.2, Track.easeRange(t, 3.9, 6.3)), Math.hypot(c.p[0], c.p[1], c.p[2] - 1.15), Track.easeRange(t, 6.3, 8.0));
    const nm = motes(t, c, s, focus);
    rm.set('uWin', { __ints: 1, v: 5 }).set('uAux', { __ints: 1, v: 6 }).set('uPaint', { __ints: 1, v: 7 })
      .set('uRo', c.p).set('uFw', c.fw).set('uRt', c.rt).set('uUp', c.up).set('uFL', c.fl)
      .set('uSun', s).set('uT', t).set('uSky', lerp(0.15, 0.8, inv(0, 4, t))).set('uGlassX', lerp(1.0, 0.5, Track.easeRange(t, 3.85, 4.3))).set('uCloud', lerp(1, 0.18, E.inOutSine(inv(3.8, 4.4, t))))
      .set('uMote', mA).set('uMoteC', mC).set('uNM', { __ints: 1, v: nm });
    gl.activeTexture(gl.TEXTURE5); gl.bindTexture(gl.TEXTURE_2D, texWin);
    gl.activeTexture(gl.TEXTURE6); gl.bindTexture(gl.TEXTURE_2D, texAux);
    gl.activeTexture(gl.TEXTURE7); gl.bindTexture(gl.TEXTURE_2D, texPaint);
    gl.activeTexture(gl.TEXTURE0);
    rm.render(t, { focus, aperture: 30, maxCoc: lerp(18, 12, Track.easeRange(t, 4.0, 5.0)) });
  },
});
